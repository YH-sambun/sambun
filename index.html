<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1716">
<meta name="description" content="연합 삼국지 · 창천토벌 — 장수를 모으고 진형을 짜서 친구들과 겨루는 삼국지 게임">
<title>연합 삼국지 · 창천토벌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  /* Layout: phone-first command tent — bronze seals on patina lacquer, one scrolling column, tab bar at the foot */
  --bg:#0e1716; --panel:#152220; --panel2:#1c2d2a; --line:#2a3f3a;
  --fg:#ede5d1; --mute:#93a39b; --ink:#16120a;
  --bronze:#d2aa55; --bronze-d:#7d6330; --cinnabar:#d0503a; --jade:#5ab596;
  --wei:#6197d8; --shu:#5ab596; --wu:#db6a52; --qun:#ab8ed3;
  --r2:#6f7f7a; --r3:#9fb0aa; --r4:#ad90e6; --r5:#e9c66c;
  --display:"Song Myung","Nanum Myeongjo","Batang",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(210,170,85,.10),transparent 60%);}
button{font:inherit;color:inherit;cursor:pointer}
.sc{display:none}
/* 업무 모드: 픽셀아트·한자 장식을 숨기고 밝은 회색 화면으로 */
html.work{--bg:#f5f5f5;--panel:#ffffff;--panel2:#efefef;--line:#dadada;--fg:#222222;--mute:#6e6e6e;--ink:#ffffff;--bronze:#555555;--bronze-d:#bdbdbd;--cinnabar:#555555;--jade:#8a8a8a;
  --wei:#c9d3df;--shu:#c9d3df;--wu:#c9d3df;--qun:#c9d3df;--r2:#c3c8ce;--r3:#c3c8ce;--r4:#aab2bd;--r5:#8f99a6;--display:var(--body);color-scheme:light}
html.work body{background-image:none;font-size:14px}
html.work .px{display:none!important}
html.work .sc{display:inline;font-family:var(--body);font-size:13px;font-weight:700;color:var(--fg);line-height:1}
html.work .seal{background:var(--panel2)!important;box-shadow:0 0 0 1px var(--line)!important}
html.work .itm{background:var(--panel2)!important;border-color:var(--line)!important}
html.work .bk-deco,html.work .tab b,html.work .big,html.work .stamp,html.work .lg-hz,html.work .empty-state b{display:none!important}
html.work .stars{color:var(--mute)!important}
html.work .bu.hit,html.work .dmg{animation:none!important}
html.work #work-btn{background:#555;color:#fff}
/* 남은 색(고정 색 버튼·막대·뱃지)까지 흑백으로 */
html.work #app,html.work #sheet,html.work #battle,html.work #toast{filter:grayscale(1)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand-hz{font-family:var(--display);font-size:22px;color:var(--bronze);letter-spacing:.04em;white-space:nowrap}
.brand-ko{font-size:11px;color:var(--mute);letter-spacing:.2em}
.res{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.coin{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-weight:700;font-variant-numeric:tabular-nums}
.sl{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-family:var(--display);font-size:13px;color:var(--ink);font-weight:400}
.sl.gold{background:var(--bronze)} .sl.food{background:var(--jade)}

.claim{margin:0 16px 8px;display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.claim .meter{flex:1;min-width:0}
.claim .lab{font-size:12px;color:var(--mute)}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--jade);border-radius:3px;transition:width .4s}
.banner{margin:0 16px 8px;font-size:12px;color:var(--mute);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}

main#view{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 24px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:var(--panel)}
.tab{background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute)}
.tab b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1}
.tab span{font-size:11px}
.tab[aria-current="true"]{color:var(--bronze)}

h2{font-family:var(--display);font-weight:400;font-size:22px;margin:8px 0 4px;text-wrap:balance}
h3{font-size:14px;margin:16px 0 8px;color:var(--mute);letter-spacing:.06em;font-weight:500}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

.btn{background:var(--bronze);color:var(--ink);font-weight:700;border:0;border-radius:8px;padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.red{background:var(--cinnabar);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:7px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* seals */
.seal{--fac:var(--qun);--rc:var(--r3);width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:24px;color:var(--ink);background:var(--fac);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--rc)}
.seal.lg{width:72px;height:72px;font-size:40px}
.seal.sm{width:34px;height:34px;font-size:18px}
.f-wei{--fac:var(--wei)} .f-shu{--fac:var(--shu)} .f-wu{--fac:var(--wu)} .f-qun{--fac:var(--qun)}
.r2{--rc:var(--r2)} .r3{--rc:var(--r3)} .r4{--rc:var(--r4)} .r5{--rc:var(--r5)}
.seal.r5{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--r5),0 0 14px rgba(233,198,108,.45)}
.stars{color:var(--rc);font-size:11px;letter-spacing:-1px}
.cls{font-family:var(--display);font-size:13px;color:var(--mute)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.gc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.gc .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gc .meta{font-size:11px;color:var(--mute);display:flex;gap:6px;align-items:center}
.gc.in-deck{border-color:var(--bronze-d)}
.chip{font-size:10px;border:1px solid var(--bronze-d);color:var(--bronze);border-radius:999px;padding:0 6px}

.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;margin:4px 0 12px}
.seg button{flex:1;background:none;border:0;border-radius:7px;padding:7px 0;color:var(--mute);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg)}

/* stage map */
.chap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.chap.locked{opacity:.5}
.chap-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.chap-h .hz{font-family:var(--display);font-size:24px;color:var(--bronze)}
.chap-h .ko{font-weight:700}
.chap-h .pg{margin-left:auto;font-size:12px;color:var(--mute)}
.nodes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;position:relative}
.node{aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-family:var(--display);font-size:18px;color:var(--mute);padding:0}
.node.done{background:var(--bronze-d);border-color:var(--bronze);color:var(--fg)}
.node.next{border-color:var(--cinnabar);color:var(--fg);box-shadow:0 0 0 4px rgba(208,80,58,.18);animation:pulse 1.8s ease-in-out infinite}
.node.boss{border-style:double;border-width:4px}
.node:disabled{cursor:not-allowed}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(208,80,58,.05)}}

/* deck */
.slot{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.slot .pos{width:40px;flex:none;text-align:center;font-family:var(--display);color:var(--bronze);font-size:15px;line-height:1.1}
.slot .pos small{display:block;font-family:var(--body);font-size:10px;color:var(--mute)}
.slot .info{flex:1;min-width:0}
.slot .info b{display:block}
.slot .info span{font-size:12px;color:var(--mute)}
.slot.empty{border-style:dashed;color:var(--mute)}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;width:30px;height:24px;font-size:12px;padding:0}
.power{font-family:var(--display);font-size:28px;color:var(--bronze);line-height:1}
.legend{font-size:12px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
.legend b{color:var(--fg);font-weight:500}

/* gacha */
.banner-card{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:12px}
.banner-card .big{font-family:var(--display);font-size:56px;line-height:1;color:var(--bronze);opacity:.16;position:absolute;right:10px;top:4px;pointer-events:none}
.banner-card h2{margin-top:0}
.rates{display:flex;gap:12px;font-size:12px;margin:6px 0 14px;flex-wrap:wrap}
.rates span{color:var(--rc)}
.reveal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:380px){.reveal{grid-template-columns:repeat(4,1fr)}}
.rv{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:11px;animation:pop .45s both;min-width:0}
.rv .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rv .tag{font-size:10px;color:var(--bronze)}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.li .info{flex:1;min-width:0}
.li .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .info span{font-size:12px;color:var(--mute)}
.li.me{border-color:var(--bronze-d)}
.rank{width:22px;text-align:center;font-family:var(--display);color:var(--bronze);font-size:18px;flex:none}
.av{width:34px;height:34px;border-radius:50%;flex:none;background:var(--panel2);object-fit:cover}
.itm{width:40px;height:40px;flex:none;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:22px;background:var(--panel2);border:1.5px solid var(--rc);color:var(--rc)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:var(--panel2);border-radius:10px;padding:8px;text-align:center}
.stat small{display:block;font-size:11px;color:var(--mute)}
.stat b{font-variant-numeric:tabular-nums}
.recbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.empty-state{text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px;padding:20px 16px;font-size:13px}
.empty-state b{display:block;font-family:var(--display);font-weight:400;font-size:28px;color:var(--bronze);margin-bottom:6px}

/* sheet */
#sheet{position:fixed;inset:0;background:rgba(4,8,8,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet-body{width:100%;max-width:540px;max-height:86%;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.sheet-h .x{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:50%;width:32px;height:32px;padding:0}

/* battle */
#battle{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bt{width:100%;max-width:540px;display:flex;flex-direction:column;padding:12px 16px;gap:12px;position:relative;
  background-image:radial-gradient(90% 40% at 50% 50%,rgba(208,80,58,.08),transparent 70%)}
.bt-head{display:flex;align-items:center;gap:8px}
.bt-title{font-family:var(--display);font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-side{font-size:11px;color:var(--mute);letter-spacing:.2em}
.bt-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bu{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;transition:opacity .3s,transform .15s}
.bu .bn{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bu .hp{width:100%;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bu .hp i{display:block;height:100%;background:var(--jade);transition:width .25s}
.bt-foe .bu .hp i{background:var(--cinnabar)}
.bu.dead{opacity:.28;filter:grayscale(1)}
.bu.act{transform:translateY(-4px);border-color:var(--bronze)}
.bt-foe .bu.act{transform:translateY(4px)}
.bu.hit{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.bu.void{visibility:hidden}
/* 줄 배치 (v1.20.2) */
.bt-row{display:flex;flex-direction:column;gap:5px}
.bt-line{display:flex;justify-content:center;gap:8px;position:relative}
.bt-line .bu{width:30%;max-width:118px;padding:5px 4px 4px;gap:2px}
.bt-rl{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:10px;color:var(--mute)}
.bu .rk{position:absolute;left:5px;top:3px;font-style:normal;font-size:10px;color:var(--r5);line-height:1}
.bu .rk.up{color:var(--cinnabar)}.bu .rk.dn{color:var(--jade)}
.bt-top .bu.act{transform:translateY(4px)}.bt-bot .bu.act{transform:translateY(-4px)}
.bt-log{min-height:56px}
.castle{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--panel2) 0 18px,var(--panel) 18px 22px);border:1px solid var(--line);border-top:5px solid var(--line)}
.castle b{font-family:var(--display);color:var(--bronze);font-weight:400;font-size:18px}
.cbar{flex:1;height:9px;background:var(--bg);border-radius:4px;overflow:hidden}.cbar i{display:block;height:100%;background:var(--bronze);transition:width .2s}
.siege .bt-ally .hp{display:none}
.dmg{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-weight:700;font-size:14px;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none;animation:float .8s forwards;white-space:nowrap}
.dmg.c{color:var(--r5);font-size:16px}
.dmg.h{color:var(--jade)}
@keyframes float{to{transform:translate(-50%,-26px);opacity:0}}
.bt-log{flex:1;min-height:90px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:4px}
.bt-log .sk{font-family:var(--display);font-size:26px;color:var(--bronze);min-height:1.2em}
.bt-log .ln{font-size:13px;color:var(--mute);min-height:1.4em}
.bt-res{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;text-align:center}
.stamp{font-family:var(--display);font-size:64px;line-height:1;width:132px;height:132px;display:grid;place-items:center;border:4px solid currentColor;border-radius:14px;transform:rotate(-8deg);animation:stamp .35s cubic-bezier(.2,1.6,.4,1) both}
.stamp.w{color:var(--cinnabar)} .stamp.l{color:var(--mute)}
@keyframes stamp{from{transform:scale(2.2) rotate(-8deg);opacity:0}}
.rw{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}
.loading{display:grid;place-items:center;height:60%;color:var(--mute);font-family:var(--display);font-size:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.login{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:40px 4px 24px;max-width:380px;margin:0 auto}
.lg-hz{font-family:var(--display);font-size:46px;color:var(--bronze);letter-spacing:.12em;line-height:1}
input:focus-visible{outline:2px solid var(--bronze);outline-offset:1px}

.sl.ap{background:var(--cinnabar);color:#fff}
.apt{font-size:11px;color:var(--mute);font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--mute)}
.chips button[aria-pressed="true"]{border-color:var(--bronze);color:var(--bronze)}
.li.dex{text-align:left;align-items:flex-start}
.li.unown{opacity:.5}
.li.unown .seal,.li.unown .itm{filter:grayscale(.85)}
.dst{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.dc{display:grid;grid-template-columns:auto 1fr;column-gap:4px;align-items:baseline;min-width:0}
.dc small{font-size:10px;color:var(--mute)}
.dc b{font-size:12px;text-align:right}
.db{grid-column:1/-1;height:3px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:2px}
.db i{display:block;height:100%;background:var(--bronze)}
.dtab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.dtab th,.dtab td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
.dtab th[scope="row"],.dtab thead th:first-child{text-align:left;color:var(--mute);font-weight:500}
.dtab thead th{color:var(--mute);font-weight:500;font-size:12px}
.dtab th[scope="row"]{white-space:nowrap}
.top{flex-wrap:wrap}

.warn{border:1px solid var(--cinnabar);background:rgba(208,80,58,.10);border-radius:12px;padding:12px;margin-top:10px;font-size:13px}
.warn b{color:var(--fg)}
.pc{font-family:var(--display);color:var(--bronze);font-size:17px;flex:none}
.ig{color:var(--rc);font-family:var(--display)}
.li[data-peek]{cursor:pointer}
.li[data-peek]:hover{border-color:var(--bronze-d)}
.li .info .bar{margin-top:6px}
.li .info>span{display:block}

.seal{overflow:hidden}
.seal .px{width:100%;height:100%}
.seal.sm{width:38px;height:38px}
.px{display:block;image-rendering:crisp-edges;image-rendering:pixelated}
.itm{overflow:hidden}
.itm .px{width:32px;height:32px}
.dup2{margin-left:3px;color:#c9a6ff}.dup2 i{color:var(--mute);font-style:normal}

// 서로 다른 진영 장수로 이루어진 인연(타국 인연)은 효과가 CROSS_MUL배
const CROSS_MUL=2;
BONDS.forEach(B=>{B.cross=new Set(B.ids.map(id=>GMAP[id].fac)).size>1;if(B.cross){const sc=o=>{if(!o)return;for(const k of Object.keys(o))o[k]=k==='spd'?Math.round(o[k]*CROSS_MUL):Math.round(o[k]*CROSS_MUL*1000)/1000};B.base={fx:{...B.fx},full:B.full?{...B.full}:null};sc(B.fx);sc(B.full)}});
// 인연 효과는 진형 전원에게 적용돼요(v1.18.0~). 전원 적용으로 바뀐 만큼, 진형 전체가 받는 효과의 총합이 이전과 비슷하도록 수치를 40%로 조정
const BOND_TEAM=.4;
BONDS.forEach(B=>{const sc=o=>{if(!o)return;for(const k of Object.keys(o))o[k]=k==='spd'?Math.max(1,Math.round(o[k]*BOND_TEAM)):Math.max(.01,Math.round(o[k]*BOND_TEAM*100)/100)};sc(B.fx);sc(B.full);if(B.base){sc(B.base.fx);sc(B.base.full)}});
function fxStr(v){const o=[];if(v.atk)o.push(`공격 +${Math.round(v.atk*100)}%`);if(v.hp)o.push(`체력 +${Math.round(v.hp*100)}%`);if(v.def)o.push(`방어 +${Math.round(v.def*100)}%`);if(v.spd)o.push(`속도 +${v.spd}`);return o.join(' · ')}
function facStr(v){return fxStr(v)+(v.r3?` · ★3 장수 추가 ${fxStr(v.r3)}`:'')}
function bondActive(B,ids){const have=B.ids.filter(x=>ids.has(x)).length;return have>=(B.min||B.ids.length)}
function bondFx(B,ids){return B.full&&B.ids.filter(x=>ids.has(x)).length>=(B.fullMin||B.ids.length)?B.full:B.fx}
// 연합군: ★3 이상 장수의 나라가 3개국 이상이면 진형 전원(★3 이상)에게 적용
const VOL_BONUS={1:{atk:.05,hp:.05},2:{atk:.10,hp:.10},3:{atk:.15,hp:.15}};
const ALLY_BONUS={3:{atk:.05,hp:.05,def:.05},4:{atk:.08,hp:.08,def:.08}};
function teamBonusInfo(us){
  const cnt={};us.forEach(u=>{if(u.rar>=3)cnt[u.fac]=(cnt[u.fac]||0)+1});
  const nn=Object.keys(cnt).length, ally=nn>=3?{n:Math.min(nn,4),b:ALLY_BONUS[Math.min(nn,4)]}:null;
  const facs=Object.entries(cnt).filter(([f,c])=>c>=3&&FAC_BONUS[f]).map(([f,c])=>({f,c,b:FAC_BONUS[f][Math.min(c,5)-3]}));
  const ids=new Set(us.map(u=>u.id).filter(Boolean));
  const n3=us.filter(u=>u.rar===3&&u.id&&GMAP[u.id]).length, vol=n3?{n:n3,b:VOL_BONUS[Math.min(n3,3)]}:null;
  return {facs,bonds:BONDS.filter(B=>bondActive(B,ids)),ids,ally,nn,vol};
}
function applyBonuses(us){
  const info=teamBonusInfo(us);
  us.forEach(u=>{
    let a=0,h=0,d=0,sp=0;const add=v=>{a+=v.atk||0;h+=v.hp||0;d+=v.def||0;sp+=v.spd||0};
    info.facs.forEach(F=>{if(u.fac===F.f&&u.rar>=3){add(F.b);if(F.b.r3&&u.rar===3)add(F.b.r3)}});
    info.bonds.forEach(B=>add(bondFx(B,info.ids)));
    if(info.vol&&u.rar===3&&u.id&&GMAP[u.id])add(info.vol.b);
    if(info.ally&&u.rar>=3)add(info.ally.b);
    u.atk=Math.round(u.atk*(1+a));u.maxhp=u.hp=Math.round(u.maxhp*(1+h));u.def=Math.round(u.def*(1+d));u.spd=Math.round((u.spd+sp)*10)/10;
  });
  return info;
}

function itemsOf(x){
  const a=typeof x==='string'?[x]:Array.isArray(x)?x:[];const o=[],seen=new Set();
  for(const s of a){if(typeof s!=='string')continue;const[k,dd]=s.split(':');const it=IMAP[k];if(!it||seen.has(k))continue;seen.add(k);o.push({it,d:Math.min(ITEM_MAXD,Math.max(0,parseInt(dd)||0))});if(o.length>=ITEM_SLOTS)break}
  return o;
}
function itemFx(it,d,wearer){
  const m=1+ITEM_DSTEP*(d||0),o={};
  const add=f=>{for(const[k,v]of Object.entries(f))o[k]=(o[k]||0)+v*m};
  add(it.fx);if(it.on&&wearer&&(wearer.cls===it.on[0]||wearer.fac===it.on[0]))add(it.on[1]);
  return o;
}

   다른 기기(탭)가 먼저 저장한 것이므로 덮어쓰지 않고 어느 기록을 쓸지 물어봐요. */
let lastPubAt=0, baseRev=0, conflictData=null, saveSt='', saveAt=0, lastCheck=0;
function setSaveSt(st){saveSt=st;if(st==='ok')saveAt=Date.now();paintSaveSt()}
function paintSaveSt(){const n=$('#save-st');if(!n)return;
  n.textContent=MODE!=='shared'?'':saveSt==='saving'?'저장 중…':saveSt==='err'?'저장 재시도 중':saveSt==='conflict'?'⚠ 다른 기기 기록 확인 (누르기)':saveAt?'저장됨 '+new Date(saveAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}):'';
  n.dataset.st=saveSt}
async function flush(){
  clearTimeout(saveT);saveT=null;
  if(saving||!S)return;
  if(conflictData){openConflict();return}
  saving=true;
  try{
    while(dirty){
      dirty=false;
      if(MODE==='shared'){
        setSaveSt('saving');
        const snap=JSON.parse(JSON.stringify(S)), ref=FS.collection('saves').doc(UID);let nr=0;
        await writeRetry(()=>FS.runTransaction(async tx=>{
          const d=await tx.get(ref), sr=d.exists?(Number(d.data().rev)||0):0;
          if(sr>baseRev){const er=new Error('conflict');er.code='save-conflict';er.data=d.data();throw er}
          nr=sr+1;snap.rev=nr;snap.sv=Date.now();tx.set(ref,snap)}));
        baseRev=nr;S.rev=nr;setSaveSt('ok');
        const pub=publicDoc(), key=JSON.stringify(pub);
        if(key!==lastPub){await writeRetry(()=>FS.collection('players').doc(UID).set({...pub,at:Date.now()}));lastPub=key;lastPubAt=Date.now()}
      } else lsSave();
    }
  }catch(e){
    if(e&&e.code==='save-conflict'){dirty=true;conflictData=e.data;saving=false;setSaveSt('conflict');openConflict();return}
    if(e&&e.code==='permission-denied'){toast('저장 권한이 없어요. 로그아웃 후 다시 로그인해 주세요.')}
    else{dirty=true;setSaveSt('err');setTimeout(flush,4000)}
  }
  saving=false;
}
function adoptServer(d,quiet){
  clearTimeout(saveT);saveT=null;dirty=false;conflictData=null;
  S=sanitize(d);baseRev=Number(d.rev)||0;S.rev=baseRev;lastPub='';
  if(MIG_LV){dirty=true;save()}
  closeSheet();setSaveSt('ok');render();migToast();
  if(!quiet)toast('다른 기기에서 저장한 최신 기록을 불러왔어요');
}
// 다른 기기(탭)에서 더 최신 기록이 저장됐을 때: 이 기기에 저장 안 된 변경이 없으면 조용히 불러오고, 있으면 물어봐요
function remoteNewer(d){
  if(typeof REC_SANDBOX!=='undefined'&&REC_SANDBOX)return;
  if(saving||!d)return;
  if((Number(d.rev)||0)<=baseRev)return;
  if(dirty||saveT){conflictData=d;setSaveSt('conflict');openConflict()}
  else adoptServer(d);
}
function openConflict(){
  const d=conflictData;if(!d)return;const o=sanitize(d);MIG_LV=null;
  const when=d.sv?new Date(Number(d.sv)).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  const row=(k,a,b)=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="sub" style="margin:0;width:80px">${k}</span><b class="num" style="flex:1;text-align:center">${a}</b><b class="num" style="flex:1;text-align:center">${b}</b></div>`;
  openSheet(`<div class="sheet-h"><h2 style="margin:0">다른 기기의 최신 기록</h2></div>
   <p class="sub" style="margin:0 0 10px">다른 기기나 다른 탭에서 더 최근에 저장한 기록이 있어요${when?` (${when} 저장)`:''}. 둘 중 하나를 골라 주세요. 고르기 전까지 이 기기는 저장하지 않아요.</p>
   <div style="margin-bottom:12px">${row('','다른 기기','이 기기')}${row('스테이지',o.stage,S.stage)}${row('장수',Object.keys(o.gens).length,Object.keys(S.gens).length)}${row('보물',o.items.length,S.items.length)}${row('금',fmt(o.gold),fmt(S.gold))}${row('군량',fmt(o.food),fmt(S.food))}</div>
   <button type="button" class="btn wide" id="cf-load">다른 기기 기록 불러오기 (추천)</button>
   <button type="button" class="btn ghost wide" id="cf-keep" style="margin-top:8px">이 기기 기록으로 덮어쓰기</button>
   <p class="sub" style="margin:8px 0 0;font-size:11px">덮어쓰면 다른 기기에서 한 진행은 사라져요.</p>`);
  $('#cf-load').onclick=()=>adoptServer(conflictData);
  $('#cf-keep').onclick=()=>{baseRev=Number(conflictData.rev)||0;conflictData=null;dirty=true;closeSheet();flush()};
}

  if(MODE!=='shared'||!UID||!FS||saving||Date.now()-lastCheck<3000)return;lastCheck=Date.now();

}

   ${anon?(isInApp()?`<div class="warn" style="margin:0 0 12px"><b>구글 연동</b><br>지금은 카카오톡 같은 앱 안 브라우저라 구글 연동이 막혀 있어요. 게스트 기록은 처음 시작한 브라우저에만 남아 있어서, 다른 브라우저로 옮기면 새 게스트가 돼요.</div>`:`<button type="button" class="btn wide" id="link-google" style="margin-bottom:6px">구글 계정 연동하기</button><p class="sub">연동하면 지금 기록이 그대로 구글 계정에 묶여서, 다른 기기에서도 구글로 로그인해 이어서 할 수 있어요.</p>`):''}<button type="button" class="btn ghost wide" id="logout">로그아웃</button><h3>처음부터 다시 시작</h3>${resetBlock()}`}`);
  logoutArm=false;bindReset();
  {const nf=$('#name-form');if(nf&&!first)nf.insertAdjacentHTML('afterend',attRateHtml())}
  const lg=$('#link-google');if(lg)lg.onclick=linkGoogle;
  $('#name-form').onsubmit=ev=>{ev.preventDefault();const v=cleanName($('#name-input').value);if(!v){toast('이름을 입력해 주세요');return}MYNAME=v;save();closeSheet();renderView();toast('이름을 저장했어요');if(first)setTimeout(runPopups,300)};
  const lo=$('#logout');
  if(lo)lo.onclick=()=>{
    if(anon&&!logoutArm){logoutArm=true;lo.textContent='한 번 더 누르면 로그아웃 (게스트 기록은 사라져요)';lo.classList.add('red');return}
    flush().finally(()=>AUTH.signOut());
  };
}
document.addEventListener('click',e=>{
  if(e.target.closest('#login-google')){googleLogin();return}
  if(e.target.closest('#login-guest')){AUTH.signInAnonymously().catch(err=>toast(authMsg(err)));return}
  if(e.target.closest('#settings')){openSettings(false);return}
});

const NOTICES=[
 {v:'2.0.4',date:'2026-10-15',title:'유비 \'인덕\' 회복량 조정',items:[

 {v:'2.0.3',date:'2026-10-15',title:'출석 보상 자동 지급 · 진형 20개 · 회복·호위 · 오장원 · 자동 진군',reward:{ap:20},items:[

  '손권이 궁병에서 책사로 바뀌었어요. 전법 강동 수성의 회복량이 12%에서 20%로 올랐어요(책사는 네 번째 행동마다 전법이라 발동 횟수가 줄어든 만큼 보정).',
  '장각의 전법이 태평도로 바뀌었어요: 적 전체 0.4배 피해, 각 20% 확률로 1턴 기절, 아군 전체 체력 10% 회복. 군웅에도 회복 장수가 생겼어요.',
  '전위의 전법이 악래의 호위로 바뀌었어요: 맨 앞 적에게 1.5배 피해, 조조가 있으면 조조를(없으면 체력이 가장 낮은 아군을) 2턴 동안 호위해요. 호위받는 아군이 쓰러질 만큼 피해를 받으면 전위가 대신 맞아요.',
  '마지막 장 오장원을 최상위권에 맞춰 어렵게 바꿨어요. 적 전투력이 제1전 약 18,000에서 제갈량·사마의가 맞서는 마지막 전투 약 30,000까지 올라가요.',
  '자동 진군: 내 진형 전투력이 스테이지 적 전투력의 120% 이상이면 전투 없이 돌파해요. 출정 탭의 \'자동 진군\' 버튼을 누르면 돌파할 수 있는 곳까지 한 번에 깨요(스테이지마다 나팔 3개, 첫 승리 보상은 그대로).']},
 {v:'2.0.2',date:'2026-10-15',title:'시즌제 운영 안내 (11월 1일 시즌 1 시작)',reward:{ap:20},items:[

  '새 아이템: 장수 선택권(원하는 장수 1명, 이미 있으면 돌파 +1) · 보물 선택권(원하는 보물 1개, 이미 있으면 강화 +1). 쿠폰으로 받고 등용 탭에서 써요.',

 {v:'2.0.1',date:'2026-10-15',title:'연습장 추천 편성 · 내 진형과 기능 공유',reward:{ap:20},items:[

 {v:'2.0.0',date:'2026-10-15',title:'v2.0 · 수성전 9곳 · 주간 순위 · 새 장수 4명',reward:{ap:30,food:1000},items:[

 {v:'1.20.2',date:'2026-10-14',title:'수성전 · 진형 배치(돌격진·기본진·수비진)',reward:{ap:20},items:[

 {v:'1.20.1',date:'2026-10-14',title:'추천 편성 개선 · 나라·병종 · 업무 모드',reward:{ap:20},items:[

  '보물 배치도 모의전으로 한 번 더 다듬어요. 보물끼리 장수를 바꿔 보거나 남는 보물로 바꿔 보면서, 치명 확정 전법에 치명 피해, 전법이 강한 장수에 전법 피해처럼 장수와 잘 맞는 조합을 찾아요.',

]},
 {v:'1.20.0',date:'2026-10-14',title:'추천 편성',reward:{ap:20},items:[
  '진형 탭의 \'추천 편성\'으로 가진 장수와 보물 중에서 진형과 보물 배치를 추천받을 수 있어요.',
  '남기고 싶은 장수는 \'고정\'을 누르고, 그 장수의 보물 중 그대로 둘 것도 눌러 고정하세요. 나머지 자리와 보물 칸만 추천으로 채워요.',
  '진영·인연·연합군 효과와 보물 도감까지 넣어 계산하고, 보병은 체력·방어, 기병·궁병은 공격, 책사는 공격·전법 피해를 더 높게 쳐요.',
  '\'레이드용\'을 고르면 후보 진형들을 이번 레이드 보스와 직접 싸워 보고 평균 피해가 가장 큰 진형을 추천해요.',
  '결과를 미리 본 뒤 지금 진형에 적용하거나 새 진형으로 저장할 수 있어요. 다른 장수가 끼던 보물을 옮겨 오면 그 장수에게서는 빠져요.']},
 {v:'1.19.1',date:'2026-10-14',title:'진형 5개 · 전투 기록 상세',reward:{ap:20},items:[
  '진형을 5개까지 만들고 이름을 붙일 수 있어요. 진형 탭 위쪽에서 고르고, 고른 진형으로 출정·레이드·결투 공격을 해요.',
  '防 표시가 붙은 진형이 결투장 방어 진형이에요. 진형 탭에서 \'방어 진형으로 지정\'으로 바꿀 수 있어요.',
  '자리 레벨(Lv)과 장수의 보물은 모든 진형이 함께 써요.',
  '스테이지 출진 창, 레이드, 결투장에서도 쓸 진형을 바로 바꿀 수 있어요.',
  '전투 결과에서 장수 이름을 누르면 아래 기록 창이 그 장수로 바뀌어요. MVP는 이름 옆과 창에 따로 표시돼요.',
  '기록 창의 보물이나 전법을 누르면 설명이 떠요. 보물은 강화 단계별(+0·+10·+25·+50) 수치도 보여 줘요.',
  '연습장 방어 진형에도 \'내 진형에 적용\' 버튼이 생겼어요.']},
 {v:'1.19.0',date:'2026-10-14',title:'자리별 레벨 · 장수별 전투 기록 · 기기 동기화',reward:{ap:20},items:[
  '레벨이 장수가 아니라 진형의 자리(1~5번)에 붙어요. 어떤 장수를 넣어도 그 자리의 레벨로 싸워요. 진형 탭의 각 자리에 있는 Lv 버튼으로 올리거나 초기화할 수 있어요.',
  '바뀌면서 지금 진형 장수의 레벨은 그 자리의 레벨이 되고(빈 자리는 다음으로 높은 장수 레벨), 나머지 장수에 쓴 금은 모두 돌려받았어요.',
  '진형의 각 자리에 ✕ 버튼이 생겨 바로 빈칸으로 만들 수 있어요.',
  '전투 결과의 막대그래프에서 장수 이름을 누르면 그 장수의 전투 기록(일반 공격 피해 · 전법 피해 · 경감한 피해 등)을 볼 수 있어요.',
  '다른 기기(또는 다른 탭)에서 더 최근에 저장한 기록이 있으면 덮어쓰지 않고 어느 기록을 쓸지 물어봐요. 앱으로 돌아오면 최신 기록을 확인하고, 화면을 닫을 때 바로 저장해요. 오른쪽 위에 마지막 저장 시각이 보여요.']},
 {v:'1.18.0',date:'2026-10-14',title:'인연 효과가 진형 전원에게',reward:{ap:20},items:[
  '인연이 발동하면 이제 인연에 속한 장수뿐 아니라 진형의 모든 장수가 효과를 받아요.',
  '모두가 받게 된 만큼 인연 수치는 이전의 40%로 조정했어요. 진형 전체가 받는 효과의 총합은 이전과 비슷해요(예: 도원결의 공격·체력 +15% → +6%, 진형 5명 모두).',
  '인연 목록과 조건, 타국 인연 2배, 오호대장군 4명 강화 등 다른 규칙은 그대로예요.']},
 {v:'1.17.1',date:'2026-10-14',title:'치명 표시와 상한',reward:{ap:20},items:[
  '장수 상세 화면에 치명 확률 · 치명 피해 · 흡혈 · 피해 감소 · 전법 피해가 표시돼요.',
  '치명 피해의 최대치를 300%로 정했어요(기본 150%에 보물·도감의 치명 피해가 그대로 더해져요).',
  '도움말의 치명 · 치명 피해 설명을 예시와 함께 더 쉽게 고쳤어요.']},
 {v:'1.17.0',date:'2026-10-13',title:'군령 → 나팔 · 출정 규칙 · 새 ★3 장수',reward:{ap:30},items:[
  '\'군령\'의 이름이 \'나팔(角)\'로 바뀌었어요. 가지고 있던 수량은 그대로예요.',
  '나팔은 3분마다 1개씩 차고, 최대치는 12시간 동안 모이는 240개로 늘었어요(이전 5분 · 120개).',
  '스테이지 도전은 나팔 3개를 쓰고, 지면 돌려받아요. 이겼을 때 3개를 돌려받던 규칙은 없어졌어요(이긴 경우 실제 사용량은 이전과 같은 3개).',
  '소탕도 1회에 나팔 3개예요(이전 6개). 하루에 할 수 있는 소탕이 약 3배로 늘어난 만큼, 반복(소탕) 보상은 30%로 줄여 하루에 모이는 총량을 이전과 비슷하게 맞췄어요. 첫 승리 보상은 그대로예요.',
  '★3 장수 문빙(위 보병) · 엄안(촉 궁병) · 한당(오 기병)이 추가됐어요. 새 인연: 촉의 노장(엄안·황충), 파군의 의리(엄안·장비), 귀순한 충신(문빙·조조), 강하 공방(문빙·감녕, 타국). 강동의 노장에 한당이 들어가 4명 전원이면 효과가 커져요.']},
 {v:'1.16.0',date:'2026-10-13',title:'중복 환불 조정 · 출정 화면 · 쿠폰함',reward:{ap:20},items:[
  '돌파를 다 채운 장수가 다시 나오면 나팔 대신 금을 드려요(★3 200 · ★4 300 · ★5 1,000). 나팔 환불이 소탕과 맞물려 군량이 끝없이 불어나는 문제가 있었어요.',
  '출정 화면에서 지금 진행 중인 장이 맨 위에 오고, 평정한 장은 높은 단계부터 보여요. 맨 위의 \'최근 평정\' 버튼으로 바로 소탕할 수 있어요.',
  '화면 위 券 버튼에서 쿠폰 목록(이름 · 보상 · 기한)을 보고 바로 받을 수 있어요.']},
 {v:'1.15.0',date:'2026-10-13',title:'★3 한계돌파 · 의용군 · 레벨 50',reward:{ap:20},items:[
  '한계돌파: ★3 장수는 5단계 뒤에도 중복으로 6~10단계(✦)까지 오르고, 단계마다 능력치 +6%예요. 10단계 ★3은 5단계 ★4보다 강해질 수 있어요.',
  '의용군: 진형에 ★3 장수가 1·2·3명 이상이면 그 ★3 장수들의 공격·체력이 +5% · +10% · +15%.',
  '★3이 들어간 인연 9종 추가: 자오곡의 계책, 서량의 마씨, 형주 수비대, 합비 방어전, 칠군 수몰, 강동의 노장, 반하의 일기토, 여포군의 두 장수, 원술의 대장.',
  '장수 레벨 상한이 40에서 50으로 올랐어요. 연습장과 레이드 적도 Lv 50이에요.',
  '전투 결과의 전투 기록에 \'받은 피해\' 탭이 생겼고, MVP 카드에 받은 피해와 남은 체력이 표시돼요.']},
 {v:'1.14.0',date:'2026-10-13',title:'레이드 보스 · 보물 도감 · 연습장',reward:{ap:20},items:[
  '레이드: 결투장 탭 → 레이드. 3일마다 새 적 3명(Lv40 · 돌파 5 · 보물 +50, 체력 20배)이 나타나요. 내 진형으로 10턴 싸워 준 피해가 모두의 게이지에 쌓이고, 하루 3회 도전할 수 있어요.',
  '레이드 보상: 게이지 25%(군량 3,000) · 50%(보물 획득권 10) · 75%(금 30,000) · 100%(보물 획득권 30). 그 회차에 1번 이상 도전한 군주 모두가 받고, 기여 1~3위는 회차가 끝난 뒤 추가 보상을 받아요. 보상은 다음 회차가 끝날 때까지 받을 수 있어요.',
  '보물 도감: 보물마다 +0(보유)·+10·+25·+50에 처음 도달하면 영구 등록되고 모든 장수가 강해져요. 판매해도 등록은 남아요. 세트 16종을 완성하면 추가 효과. 결투장에도 적용돼요. 지금 가진 보물은 자동으로 등록됐어요.',
  '연습장: 결투장 탭 → 연습장. 모든 장수와 보물로 공격덱·NPC 방어덱을 3개씩 따로 저장하고, 전투 보기와 100판 승률로 조합을 시험할 수 있어요. 공격덱의 \'내 진형에 적용\'을 누르면 보유한 장수와 보물을 같은 배치로 내 진형에 옮겨요.',
  '속도가 같은 장수끼리는 이제 매 턴 무작위로 행동 순서를 정해요(이전에는 항상 공격 쪽이 먼저).']},
 {v:'1.13.0',date:'2026-10-13',title:'새 장수 초선·손견·축융 · 쿠폰 · 금화 룰렛',reward:{ap:20},items:[
  '새 장수: ★5 초선(군웅 책사, 미인계), ★5 손견(오 보병, 강동의 호랑이), ★4 축융(군웅 궁병, 비도).',
  '새 인연: 연환지계(초선·여포·동탁), 강동의 손씨(손견·손책·손권), 양인의 결전(손견·화웅, 타국 인연).',
  '진형에 ★5 장수는 2명까지 넣을 수 있어요. 이전 진형에 3명 이상이었다면 앞에서부터 2명만 남아요. 결투장 상대 진형에도 똑같이 적용돼요.',
  '오호대장군의 강화 효과가 5명 전원에서 4명 이상으로 바뀌었어요(★5 제한 때문에 5명 전원을 넣을 수 없어서).',
  '공지(告) 창에서 쿠폰 번호를 입력해 보상을 받을 수 있어요. 쿠폰은 계정마다 한 번씩 쓸 수 있어요.',
  '등용 탭에 금화 룰렛이 생겼어요. 금 1,000으로 돌려 군량 150~5,000을 받고, 하루 20회까지 돌릴 수 있어요.']},
 {v:'1.12.0',date:'2026-10-13',title:'보물 100종 · 3칸 장착 · 보물 돌파',reward:{ap:20,itk:100},items:[
  '보물이 17종에서 100종으로 늘었어요. 방어구(투구·방패), 명마, 장신구(옥새·호부·군기·부채) 등 종류도 다섯 가지가 됐어요.',
  '장수마다 보물을 3개까지 장착할 수 있어요. 명마는 한 장수에게 1개만 장착돼요.',
  '보물 돌파: 같은 보물이 또 나오면 돌파 +1, 최대 +50. 1단계마다 그 보물의 모든 효과 +3%, +50이면 2.5배예요. 금으로 정련해서 올릴 수도 있어요.',
  '새 특수 효과: 치명 확률·치명 피해·흡혈·피해 감소·전법 피해. 일부 보물은 특정 병종이 장착하면 추가 효과가 있어요.',
  '같은 보물을 여러 개 갖고 있었다면 하나로 합쳐지고, 합친 개수만큼 돌파가 올라요. 여러 장수가 같은 보물을 끼고 있었다면 한 장수에게만 남아요.',
  '업데이트 기념으로 보물 획득권 100장을 드려요(보물 100회). 이 공지에서 받아 가세요.']},
 {v:'1.11.0',date:'2026-10-13',title:'궁병의 기병 견제 · 타국 인연 강화',reward:{ap:20},items:[
  '궁병이 기병에게 주는 피해가 +25%에서 +50%로 올랐고, 기병이 궁병에게 주는 피해는 -25%예요. 궁병의 일반 공격은 기병을 먼저 노려요.',
  '기병은 2번째 행동마다 전법을 쓰는 만큼 전법 위력이 75%로 적용돼요.',
  '서로 다른 진영 장수로 이루어진 타국 인연은 효과가 2배예요. 화용도의 의리, 적벽 동맹, 손유 동맹, 백문루의 인연 등 타국 인연 9종을 새로 추가했어요(전체 29종).',
  '촉 진영 보너스를 체력 +10/16/24%로 조정했어요(이전 +12/22/35%).',
  '연합군 보너스 추가: ★3 이상 장수의 나라가 3개국이면 ★3 이상 전원 공격·체력·방어 +5%, 4개국이면 +8%예요. 진형 화면에서 효과를, 도감 인연 탭에서 표를 볼 수 있어요.',
  '돌파 5단계가 끝난 ★4·★5 장수가 다시 나오면 나팔 30개로 돌려드려요(★3은 금 200).']},
 {v:'1.10.0',date:'2026-10-13',title:'새 장수 등애·서성 · 병종별 전법 주기',reward:{ap:20},items:[
  '위에 ★5 보병 등애가 합류했어요. 전법 음평의 결의는 2턴 동안 적의 단일 공격을 자신에게 끌어오는 도발과 방어 강화, 기습 공격을 함께 해요.',
  '오에 ★4 보병 서성이 합류했어요. 전법 의성의 계로 적 전체의 공격력을 낮추고 자신의 방어를 올려요.',
  '새 인연: 발탁의 은혜(사마의·등애), 건업의 수호(손권·서성).',
  '전법 발동 주기가 병종마다 달라졌어요. 기병은 2번째, 보병과 궁병은 3번째, 책사는 4번째 행동마다 전법을 써요.',
  '장수의 돌파 단계가 ◆◇로 표시돼요. 무장 목록, 장수 정보, 진형, 다른 군주 진형에서 볼 수 있어요.',
  '화면 위쪽 ? 버튼으로 능력치, 성장, 전투 규칙, 진형 효과를 설명하는 도움말을 볼 수 있어요.']},
 {v:'1.9.1',date:'2026-10-13',title:'군웅 진영 보너스 강화',items:['★3 장수가 많은 군웅 진영 보너스를 올렸어요. 3·4·5명일 때 방어 +15/25/35%, 공격 +5/10/14%, 체력 +5/10/14%예요.','군웅 진영 보너스가 발동하면 ★3 군웅 장수는 공격과 체력을 3명 +2%, 4명 +4%, 5명 +6% 더 받아요.']},
 {v:'1.9.0',date:'2026-10-13',title:'전투 기록 · 결과 공유 · 보물 잠금',reward:{ap:20},items:[
  '전투가 끝나면 장수별 피해량, 공격 횟수, 회당 피해를 막대그래프로 볼 수 있어요. 아군·적군을 바꿔 볼 수 있고, MVP 장수의 능력치와 전투 기록도 보여줘요.',
  '결투와 연습전이 끝나면 결과를 링크나 이미지로 공유할 수 있어요. 링크를 받은 사람은 같은 전투를 다시 재생해 볼 수 있어요.',

async function sha256hex(x){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
async function redeemCoupon(raw){

    try{const d=await FS.collection('coupons').doc(code).get();
      if(d.exists){const v=d.data()||{},n=(k,mx)=>Math.max(0,Math.min(mx,Math.floor(Number(v[k])||0)));cp={t:String(v.title||'쿠폰').slice(0,40),r:{food:n('food',100000),gold:n('gold',1000000),ap:n('ap',500),itk:n('itk',500),gtk:n('gtk',100),isk:n('isk',100)},until:String(v.until||'')}}}
    catch(e){return {err:'쿠폰을 확인하지 못했어요. 잠시 후 다시 시도해 주세요'}}}
  if(!cp)return {err:'없는 쿠폰 번호예요'};
  if(cp.until&&kstDay()>cp.until)return {err:`기간이 끝난 쿠폰이에요 (${cp.until}까지)`};
  if(S.cpn.includes(h))return {err:'이미 사용한 쿠폰이에요'};
  const r=cp.r;tickAP();S.ap+=r.ap||0;S.food+=r.food||0;S.gold+=r.gold||0;S.itk=(S.itk||0)+(r.itk||0);S.gtk=(S.gtk||0)+(r.gtk||0);S.isk=(S.isk||0)+(r.isk||0);S.cpn.push(h);save();renderTop();renderView();
  return {ok:`${cp.t} · ${rewardText(r)}`};
}

    const res=simulate(mine,foe,(Math.random()*2**31)|0);

const DUEL_REWARD=[1620,900,720], DUEL_REWARD_REST=300, DUEL_KEEP_DAYS=10, DUEL_SETTLE_HOUR=9, DUEL_START='2026-10-13';
const DAY_MS=864e5;
const dayStart=d=>Date.parse(d+'T00:00:00+09:00');
const dayOf=ms=>new Date(ms+9*3600e3).toISOString().slice(0,10);
const settleAt=d=>dayStart(d)+DAY_MS+DUEL_SETTLE_HOUR*3600e3;
const pastDays=n=>Array.from({length:n},(_,i)=>dayOf(Date.now()-(i+1)*DAY_MS));
const duelReward=rank=>rank<=3?DUEL_REWARD[rank-1]:DUEL_REWARD_REST;
const validBattle=b=>b&&typeof b.att==='string'&&typeof b.def==='string'&&typeof b.win==='boolean'&&Number.isFinite(Number(b.at));
function rankDay(bs){
  const m={};const g=id=>m[id]||(m[id]={id,aw:0,al:0,dw:0,dl:0});
  for(const b of bs){if(b.win){g(b.att).aw++;g(b.def).dl++}else{g(b.att).al++;g(b.def).dw++}}
  return Object.values(m).filter(r=>r.aw+r.al>0).map(r=>({...r,score:r.aw*3+r.dw})).sort((a,b)=>b.score-a.score||b.aw-a.aw||(a.aw+a.al)-(b.aw+b.al)||(a.id<b.id?-1:1));
}
function cleanDaily(d){
  const rank=(Array.isArray(d&&d.rank)?d.rank:[]).filter(r=>r&&typeof r.id==='string').slice(0,200).map(r=>({id:r.id,name:cleanName(r.name),score:r.score|0,aw:r.aw|0,al:r.al|0,dw:r.dw|0,dl:r.dl|0}));
  return {day:String(d&&d.day||''),rank,final:true};
}
const DAILY={};
async function loadDaily(d){
  if(DAILY[d])return DAILY[d];
  const ref=FS.collection('daily').doc(d);
  const snap=await ref.get();
  if(snap.exists)return DAILY[d]=cleanDaily(snap.data());
  const q=await FS.collection('battles').where('at','>=',dayStart(d)).where('at','<',dayStart(d)+DAY_MS).limit(1000).get();
  const rank=rankDay(q.docs.map(x=>x.data()).filter(validBattle)).map(r=>{const p=PLAYERS.find(x=>x.id===r.id);return {...r,name:r.id===UID?MYNAME:(p&&p.name)||''}});
  const final=Date.now()>=settleAt(d), v={day:d,rank,final};
  if(final){
    if(rank.length){try{await ref.set({day:d,at:dayStart(d),final:true,rank})}catch(e){try{const s2=await ref.get();if(s2.exists)return DAILY[d]=cleanDaily(s2.data())}catch(_){}}}
    DAILY[d]=v;
  }
  return v;
}
let PENDING=[], settleBusy=false, nextSettleCheck=0;
async function checkSettlement(){
  if(MODE!=='shared'||!FS||settleBusy||!S)return;settleBusy=true;
  try{
    const days=pastDays(DUEL_KEEP_DAYS).filter(d=>d>=DUEL_START&&Date.now()>=settleAt(d)&&!S.duel.done.includes(d)&&!PENDING.some(p=>p.d===d)).reverse();
    for(const d of days){
      const v=await loadDaily(d), i=v.rank.findIndex(r=>r.id===UID);
      if(i<0){S.duel.done.push(d);continue}
      PENDING.push({d,rank:i+1,total:v.rank.length,reward:duelReward(i+1)});

  settleBusy=false;
}

function rlLeft(){return S.rl.day===kstDay()?Math.max(0,RL_DAILY-S.rl.n):RL_DAILY}
function rlRoll(){let r=Math.random()*100;for(let i=0;i<RL.length;i++){r-=RL[i][1];if(r<0)return i}return 0}

   <p class="sub" style="margin:8px 0 0">1회 평균 군량 약 ${fmt(avg)} · 매일 0시(한국 시간)에 횟수가 다시 채워져요.</p></div>`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-rl]');if(!b||b.disabled||rlBusy)return;

/* ---------------- 시즌 · 출석률 (v2.0.2) ----------------
   시즌 1: 2026-11-01 ~ 2027-01-31, 이후 3개월 단위. 그전은 테스트 기간.
   출석률 = 이번 기간 출석 일수 ÷ (기록 시작일 ~ 오늘). 기간이 바뀌면 시즌 시작일부터 다시 세요. */
const md=d=>`${+d.slice(5,7)}/${+d.slice(8,10)}`;
function seasonOf(day){
  if(day<'2026-11-01')return {k:'T',n:'테스트 기간',start:'2026-10-12',end:'2026-10-31'};
  const y=+day.slice(0,4),m=+day.slice(5,7),idx=Math.floor(((y-2026)*12+(m-11))/3),sm=10+idx*3,f=x=>x.toISOString().slice(0,10);
  return {k:'S'+(idx+1),n:'시즌 '+(idx+1),start:f(new Date(Date.UTC(2026+Math.floor(sm/12),sm%12,1))),end:f(new Date(Date.UTC(2026+Math.floor(sm/12),sm%12+3,0)))};
}
function cleanSat(x){if(!x||typeof x!=='object'||typeof x.k!=='string'||typeof x.from!=='string')return null;return {k:x.k.slice(0,4),n:Math.max(0,Math.min(400,x.n|0)),from:x.from.slice(0,10)}}
const ATT_RW={rate:.7,gtk:5,isk:10};let ATT_RW_MSG='';
function attSeason(){const d=kstDay(),se=seasonOf(d);
  if(S.sat&&S.sat.k!==se.k&&S.sat.k!=='T'){const ps=seasonOf(S.sat.from),tot=Math.max(1,dayNum(ps.end)-dayNum(S.sat.from)+1),pr=S.sat.n/tot;
    if(pr>=ATT_RW.rate){S.gtk=(S.gtk||0)+ATT_RW.gtk;S.isk=(S.isk||0)+ATT_RW.isk;ATT_RW_MSG=`${ps.n} 출석률 ${Math.round(pr*100)}% 달성 보상 · 장수 선택권 ${ATT_RW.gtk}장 · 보물 선택권 ${ATT_RW.isk}장`}
    S.satLast={k:S.sat.k,n:S.sat.n,pct:Math.round(pr*100),rw:pr>=ATT_RW.rate?1:0}}
  if(!S.sat||S.sat.k!==se.k){const from=S.sat?se.start:d;S.sat={k:se.k,n:0,from:from>d?d:from};if(S.att&&S.att.day===d)S.sat.n=1}
  return S.sat}
function attStats(a,today){const se=seasonOf(today||kstDay());today=today||kstDay();if(!a||a.k!==se.k)return null;
  const el=Math.max(1,dayNum(today)-dayNum(a.from)+1), tot=Math.max(1,dayNum(se.end)-dayNum(a.from)+1);
  return {se,n:a.n,el,tot,pct:Math.min(100,Math.round(a.n/el*100)),need:Math.max(0,Math.ceil(tot*.7)-a.n)}}
function attRateHtml(){
  const a=attSeason(), st=attStats(a);if(!st)return '';
  return `<div class="stat" style="text-align:left;margin:0 0 10px"><div class="row"><small style="font-size:12px">${st.se.n} 출석률</small><span class="sp"></span><b class="num" style="color:${st.pct>=70?'var(--jade)':'var(--fg)'}">${st.pct}%</b></div>
   <div class="bar"><i style="width:${st.pct}%;background:${st.pct>=70?'var(--jade)':'var(--bronze)'}"></i></div>
   ${S.satLast?`<div class="sub" style="margin:2px 0 0;font-size:12px">지난 ${S.satLast.k==='T'?'테스트 기간':'시즌 '+S.satLast.k.slice(1)} 출석률 ${S.satLast.pct}%${S.satLast.rw?' · 선택권 받음':''}</div>`:''}
   <div class="sub" style="margin:4px 0 0;font-size:12px">${st.n}일 / ${st.el}일 출석 · 기간 ${md(a.from)}~${md(st.se.end)} (${st.tot}일) · ${st.need?`기간 70%까지 ${st.need}일 더`:'기간 70% 달성!'}${st.se.k!=='T'?' · 70% 이상이면 다음 시즌 첫 접속 때 장수 선택권 5장 · 보물 선택권 10장 자동 지급':''}</div></div>`;

// 1) 장수 고르기 (아이템 없이, 같은 레벨로 비교)
function recPickGens(locked,lv,cb,filt){

  const lockedSpecs=locked.map(x=>recSpec(x.g,lv,x.its,cb));
  const indiv={};Object.keys(S.gens).forEach(g=>indiv[g]=recUnitScore(mkUnit(recSpec(g,lv,[],cb),0,0)));
  let pool=Object.keys(S.gens).filter(g=>!lockedG.has(g)&&(!filt||filt(g))).sort((a,b)=>indiv[b]-indiv[a]);

  const seeds=[fill([])];

const CAN_SHARE=typeof FIREBASE_CONFIG!=='undefined';
function battleStats(res){
  const st={};const K=(s,i)=>st[s+'-'+i]||(st[s+'-'+i]={acts:0,sk:0,dmg:0,nd:0,sd:0,mit:0,crit:0,kills:0,heal:0,taken:0,hp:0});
  res.init.forEach(t=>t.forEach(u=>{K(u.side,u.slot).hp=u.hp}));
  for(const e of res.ev){for(const h of e.hits||[]){const t=K(h.s,h.i);if(!h.self){t.taken+=h.d;t.mit+=h.m||0}t.hp=h.hp}for(const h of e.heals||[])K(h.s,h.i).hp=h.hp}
  for(const e of res.ev){
    if(e.skip)continue;
    if(e.tick){for(const h of e.hits||[])if(h.by){const r=K(h.by[0],h.by[1]);r.dmg+=h.d;r.sd+=h.d;if(h.hp===0)r.kills++}continue}
    const r=K(e.s,e.i);r.acts++;if(e.sk)r.sk++;
    for(const h of e.hits||[]){if(h.self)continue;r.dmg+=h.d;if(e.sk)r.sd+=h.d;else r.nd+=h.d;if(h.c)r.crit++;if(h.hp===0)r.kills++}
    for(const h of e.heals||[])r.heal+=h.h;
  }
  return st;
}
let rsSide=0, rsMetric='dmg', rsSel='';
const RS_M={dmg:'피해량',taken:'받은 피해',mit:'경감한 피해',acts:'공격 횟수',dps:'회당 피해'};
function statChart(res,st,sel){
  const us=res.init[rsSide].map(u=>{const r=st[u.side+'-'+u.slot];return {u,r,v:rsMetric==='dps'?(r.acts?Math.round(r.dmg/r.acts):0):r[rsMetric]}}).sort((a,b)=>b.v-a.v);
  const mx=Math.max(1,...us.map(x=>x.v)), mv=mvpOf(res,st,rsSide);
  return us.map(({u,r,v})=>{const k=u.side+'-'+u.slot;return `<button type="button" class="sbar${k===sel?' on':''}" data-rsu="${k}" aria-pressed="${k===sel}" aria-label="${esc(u.name)} 전투 기록 보기"><span class="sn">${mv&&mv.u===u?'<i class="mvpb">MVP</i>':''}${esc(u.name)}</span><span class="st"><i style="width:${v/mx*100}%"></i></span><b class="num">${fmt(v)}</b></button>`}).join('');
}
function mvpOf(res,st,side){
  let best=null;res.init[side].forEach(u=>{const r=st[u.side+'-'+u.slot],sc=r.dmg+r.heal*.6;if(!best||sc>best.sc)best={u,r,sc}});return best;
}

    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();a.remove();
    toast('결과 이미지를 저장했어요. 카카오톡에서 사진으로 보내세요.');
  }catch(e){toast('이미지를 만들지 못했어요. 휴대폰 화면 캡처를 이용해 주세요.')}
}
function openReplayFromHash(){
  const m=location.hash.match(/^#r=([A-Za-z0-9_-]+)$/);if(!m)return false;
  let o;try{o=JSON.parse(b64d(m[1]))}catch(e){return false}
  const A=unpackSpecs(o.a&&o.a.d),B=unpackSpecs(o.b&&o.b.d);if(!A.length||!B.length)return false;
  const res=simulate(A,B,Number(o.s)|0), an=cleanName(o.a&&o.a.n)||'공격측', bn=cleanName(o.b&&o.b.n)||'방어측';
  const note=(o.w===1)!==res.win?`<p class="sub">이 결과는 v${esc(String(o.v||''))}에서 기록됐어요. 지금 버전의 능력치로 다시 재생해서 결과가 다를 수 있어요.</p>`:'';
  const when=o.ts?new Date(Number(o.ts)).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  playBattle(res,`${String(o.t||'결투')} 다시보기`,an,bn,()=>`<p class="sub">${esc(an)} vs ${esc(bn)}${when?` · ${when}`:''}</p>${note}`,{replay:true,share:{title:String(o.t||'결투'),seed:Number(o.s)|0,a:A,b:B,an,bn}});
  return true;
}

/* ---------------- battle playback ---------------- */
let btToken=0;
function playBattle(res,title,allyLab,foeLab,resultHtml,opts){
  const tok=++btToken;
  const units=[res.init[0].map(u=>({...u})),res.init[1].map(u=>({...u}))];
  const SG=opts&&opts.siege, topK=SG?0:1, botK=1-topK;let waveNo=1;
  const buHtml=(k,u)=>{const mk=u.form==='assault'&&u.row===0?'<i class="rk" title="선봉 속도 +12">⚡</i>':u.rd>1?'<i class="rk up" title="받는 피해 증가">▲</i>':u.rd<1?'<i class="rk dn" title="받는 피해 감소">▼</i>':'';
    return `<div class="bu${u.hp<=0?' dead':''}" id="bu-${k}-${u.slot}">${mk}${seal(u,'sm')}<div class="bn">${esc(u.name)}</div><div class="hp"><i style="width:${Math.max(0,u.hp/u.maxhp*100)}%"></i></div></div>`};
  const sideHtml=k=>{const top=k===topK;return (top?[2,1,0]:[0,1,2]).map(r=>{const rs=units[k].filter(u=>(u.row!=null?u.row:Math.min(2,Math.floor(u.slot/2)))===r).sort((a,b)=>a.slot-b.slot);
    return rs.length?`<div class="bt-line"><span class="bt-rl">${ROWN[r]}</span>${rs.map(u=>buHtml(k,u)).join('')}</div>`:''}).join('')};
  const renderSide=k=>{const n=$('#bt-s'+k);if(n)n.innerHTML=sideHtml(k)};
  const castleHtml=SG?`<div class="castle"><b>城</b><div class="cbar"><i id="castle-i" style="width:100%"></i></div><span class="num" id="castle-t">${fmt(SG.max)}</span><span class="chip" id="wave-t">제1파</span></div>`:'';
  const setCastle=v=>{if(!SG)return;const i=$('#castle-i'),t=$('#castle-t');if(i)i.style.width=Math.max(0,v/SG.max*100)+'%';if(t)t.textContent=fmt(Math.max(0,v))};
  const el=$('#battle');
  el.innerHTML=`<div class="bt${SG?' siege':''}"><div class="bt-head"><span class="bt-title">${esc(title)}</span><button type="button" class="btn ghost sm" id="bt-speed">${SG?4:1}배속</button><button type="button" class="btn ghost sm" id="bt-skip">결과 보기</button></div>
  <div class="bt-side">${esc(SG?allyLab:foeLab)}</div><div class="bt-row bt-top ${SG?'bt-ally':'bt-foe'}" id="bt-s${topK}">${sideHtml(topK)}</div>${castleHtml}
  <div class="bt-log"><div class="sk" id="bt-sk"></div><div class="ln" id="bt-ln">${esc(bonusLine(res.bonus&&res.bonus[0])?'아군 효과 · '+bonusLine(res.bonus[0]):'전투 개시')}</div></div>
  <div class="bt-row bt-bot ${SG?'bt-foe':'bt-ally'}" id="bt-s${botK}">${sideHtml(botK)}</div><div class="bt-side" style="text-align:right">${esc(SG?foeLab:allyLab)}</div></div>`;
  el.hidden=false;
  let speed=SG?4:1, idx=0, timer=null;
  const U=(s,i)=>units[s].find(x=>x.slot===i);
  const paint=(s,i)=>{const u=U(s,i),n=$(`#bu-${s}-${i}`);if(!u||!n)return;n.querySelector('.hp i').style.width=(u.hp/u.maxhp*100)+'%';n.classList.toggle('dead',u.hp<=0)};
  const float=(s,i,txt,cls)=>{const n=$(`#bu-${s}-${i}`);if(!n)return;const f=document.createElement('span');f.className='dmg '+cls;f.textContent=txt;n.appendChild(f);setTimeout(()=>f.remove(),800)};
  const apply=(e,anim)=>{
    if(e.spawn){units[1]=e.units.map(u=>({...u}));renderSide(1);waveNo=e.spawn;const w=$('#wave-t');if(w)w.textContent=`제${waveNo}파`;if(anim){$('#bt-sk').textContent=`제${waveNo}파`;$('#bt-ln').textContent='적의 새 무리가 몰려와요 (더 강해졌어요)'}return}
    {const lc=[...(e.hits||[]),...(e.heals||[])].filter(h=>h.ch!=null).pop();if(lc)setCastle(lc.ch)}
    const a=e.tick?null:U(e.s,e.i);
    for(const h of e.hits||[]){const t=U(h.s,h.i);if(!t)continue;t.hp=h.hp;paint(h.s,h.i);if(anim){float(h.s,h.i,'-'+h.d,h.c?'c':(h.self||h.burn)?'b':'');const n=$(`#bu-${h.s}-${h.i}`);if(n){n.classList.remove('hit');void n.offsetWidth;n.classList.add('hit')}}}
    for(const h of e.heals||[]){const t=U(h.s,h.i);if(!t)continue;t.hp=h.hp;paint(h.s,h.i);if(anim&&h.h>0)float(h.s,h.i,'+'+h.h,'h')}
    if(anim)for(const st of e.stuns||[])float(st.s,st.i,'기절','s');
    if(anim){
      document.querySelectorAll('.bu.act').forEach(n=>n.classList.remove('act'));
      if(a){const an=$(`#bu-${e.s}-${e.i}`);an&&an.classList.add('act')}
      $('#bt-sk').textContent=e.sk||'';
      let ln;
      if(e.tick)ln='화상 피해';
      else if(e.skip)ln=`${a.name} 기절로 행동하지 못함`;
      else{const hs=(e.hits||[]).filter(h=>!h.self),tot=hs.reduce((x,h)=>x+h.d,0),uniq=new Set(hs.map(h=>h.s+'-'+h.i)).size;
        const tgt=uniq>1?`적 ${uniq}명`:hs[0]?U(hs[0].s,hs[0].i).name:'';
        ln=hs.length?`${a.name} → ${tgt} ${fmt(tot)} 피해${hs.length>uniq?` (${hs.length}회)`:''}${hs.some(h=>h.c)?' · 치명타':''}`:a.name}
      if(e.notes&&e.notes.length)ln+=' · '+e.notes.join(' · ');
      $('#bt-ln').textContent=ln;
    }
  };
  const finish=()=>{
    clearTimeout(timer);
    while(idx<res.ev.length)apply(res.ev[idx++],false);
    document.querySelectorAll('.bu.act').forEach(n=>n.classList.remove('act'));
    const box=document.createElement('div');box.className='bt-res';
    const stt=battleStats(res), sh=opts&&opts.share, rp=opts&&opts.replay;
    rsSide=SG?0:rp?(res.win?0:1):0;{const m0=mvpOf(res,stt,rsSide);rsSel=m0?m0.u.side+'-'+m0.u.slot:''}
    const vd=opts&&opts.verdict, winLab=vd?vd.lab:rp?`${res.win?allyLab:foeLab} 승리`:(res.win?'승리':'패배');
    box.innerHTML=`<div class="res-card" id="res-card"><div class="stamp ${res.win||rp||vd?'w':'l'}">${vd?vd.stamp:rp?'戰':res.win?'勝':'敗'}</div><h2 style="margin:0">${esc(winLab)}</h2>${resultHtml()}
     <div class="res-sec"><h3>전투 기록</h3>
      <div class="chips no-cap" role="group">${SG?'':`<button type="button" data-rss="0" aria-pressed="${rsSide===0}">${esc(allyLab)}</button><button type="button" data-rss="1" aria-pressed="${rsSide===1}">${esc(foeLab)}</button>`}<span class="sp"></span>${Object.entries(RS_M).map(([k,v])=>`<button type="button" data-rsm="${k}" aria-pressed="${rsMetric===k}">${v}</button>`).join('')}</div>
      <div class="sub" id="rs-cap" style="margin:0 0 4px">${esc(rsSide?foeLab:allyLab)} · ${RS_M[rsMetric]}</div><div class="sub no-cap" style="margin:0 0 4px;font-size:11px">장수 이름을 누르면 아래 기록 창이 그 장수로 바뀌어요.</div><div id="rs-chart">${statChart(res,stt,rsSel)}</div></div>
     <div class="mvpline" id="rs-mvpl"></div><div id="rs-unit">${mvpHtml(mvpOf(res,stt,rsSide),'MVP')}</div></div>
     ${sh&&CAN_SHARE?`<div class="share-row"><button type="button" class="btn ghost" id="sh-link">결과 링크 공유</button><button type="button" class="btn ghost" id="sh-img">이미지로 공유</button></div><div id="share-fallback" hidden style="width:100%;max-width:440px"><p class="sub" style="margin:0 0 4px">아래 내용을 길게 눌러 복사한 뒤 카카오톡에 붙여넣으세요.</p><textarea readonly></textarea></div>`:''}
     <button type="button" class="btn" id="bt-close" style="min-width:160px">${rp?'게임 하러 가기':'확인'}</button>`;
    $('.bt').appendChild(box);
    const showUnit=key=>{const u=unitByKey(res,key);if(!u)return;rsSel=key;const m=mvpOf(res,stt,u.side);$('#rs-unit').innerHTML=mvpHtml({u,r:stt[key]},m&&m.u===u?'MVP':'');
      const mm=mvpOf(res,stt,rsSide);$('#rs-mvpl').innerHTML=mm?`<span class="mvpb">MVP</span> <b>${esc(mm.u.name)}</b> · 총 피해 ${fmt(mm.r.dmg)}${mm.u.side+'-'+mm.u.slot!==key?` <button type="button" class="btn ghost sm" data-rsu="${mm.u.side}-${mm.u.slot}">MVP 보기</button>`:''}`:'';
      $('#rs-chart').innerHTML=statChart(res,stt,rsSel)};
    const redraw=()=>{$('#rs-chart').innerHTML=statChart(res,stt,rsSel);$('#rs-cap').textContent=`${rsSide?foeLab:allyLab} · ${RS_M[rsMetric]}`;box.querySelectorAll('[data-rss]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.rss===rsSide)));box.querySelectorAll('[data-rsm]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.rsm===rsMetric)))};
    box.querySelectorAll('[data-rss]').forEach(b=>b.onclick=()=>{rsSide=+b.dataset.rss;const m=mvpOf(res,stt,rsSide);redraw();if(m)showUnit(m.u.side+'-'+m.u.slot)});
    box.querySelectorAll('[data-rsm]').forEach(b=>b.onclick=()=>{rsMetric=b.dataset.rsm;redraw()});
    showUnit(rsSel);
    box.addEventListener('click',e=>{
      const b=e.target.closest('[data-rsu]');if(b){showUnit(b.dataset.rsu);return}
      const it=e.target.closest('[data-rsi]');if(it){const[k,j]=it.dataset.rsi.split(':'),u=unitByKey(res,k),x=u&&u.items[+j];if(x&&IMAP[x.k])openInfoPop(itemInfoHtml(IMAP[x.k],x.d||0,u));return}
      const sk=e.target.closest('[data-rssk]');if(sk){const u=unitByKey(res,sk.dataset.rssk);if(u)openInfoPop(skillInfoHtml(u))}
    });
    if(sh&&CAN_SHARE){$('#sh-link').onclick=()=>shareLink(sh,res.win);$('#sh-img').onclick=()=>shareImage($('#res-card'),sh)}
    $('#bt-close').onclick=()=>{el.hidden=true;el.innerHTML='';if(rp){history.replaceState(null,'',location.pathname+location.search);if(typeof showLogin==='function'&&!S&&MODE!=='local')showLogin()}renderTop();renderView()};
    $('#bt-close').focus();
  };
  const step=()=>{if(tok!==btToken)return;if(idx>=res.ev.length){timer=setTimeout(finish,500);return}apply(res.ev[idx++],true);timer=setTimeout(step,560/speed)};
  $('#bt-speed').onclick=()=>{speed=speed===1?2:speed===2?4:speed===4?8:1;$('#bt-speed').textContent=speed+'배속'};
  $('#bt-skip').onclick=finish;
  timer=setTimeout(step,500);
}

/* ---------------- sheet ---------------- */
function openSheet(html){const s=$('#sheet');s.innerHTML=`<div class="sheet-body" role="dialog" aria-modal="true">${html}</div>`;s.hidden=false;const f=s.querySelector('button');f&&f.focus({preventScroll:true})}
function closeSheet(){const s=$('#sheet');s.hidden=true;s.innerHTML=''}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'||e.target.closest('[data-close]'))closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

boot();
</script>
