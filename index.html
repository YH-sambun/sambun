<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1716">
<meta name="description" content="연합 삼국지 · 창천토벌 — 장수를 모으고 진형을 짜서 친구들과 겨루는 삼국지 게임">
<title>연합 삼국지 · 창천토벌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  /* Layout: phone-first command tent — bronze seals on patina lacquer, one scrolling column, tab bar at the foot */
  --bg:#0e1716; --panel:#152220; --panel2:#1c2d2a; --line:#2a3f3a;
  --fg:#ede5d1; --mute:#93a39b; --ink:#16120a;
  --bronze:#d2aa55; --bronze-d:#7d6330; --cinnabar:#d0503a; --jade:#5ab596;
  --wei:#6197d8; --shu:#5ab596; --wu:#db6a52; --qun:#ab8ed3;
  --r2:#6f7f7a; --r3:#9fb0aa; --r4:#ad90e6; --r5:#e9c66c;
  --display:"Song Myung","Nanum Myeongjo","Batang",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(210,170,85,.10),transparent 60%);}
button{font:inherit;color:inherit;cursor:pointer}
.sc{display:none}
/* 업무 모드: 픽셀아트·한자 장식을 숨기고 밝은 회색 화면으로 */
html.work{--bg:#f5f5f5;--panel:#ffffff;--panel2:#efefef;--line:#dadada;--fg:#222222;--mute:#6e6e6e;--ink:#ffffff;--bronze:#555555;--bronze-d:#bdbdbd;--cinnabar:#555555;--jade:#8a8a8a;
  --wei:#c9d3df;--shu:#c9d3df;--wu:#c9d3df;--qun:#c9d3df;--r2:#c3c8ce;--r3:#c3c8ce;--r4:#aab2bd;--r5:#8f99a6;--display:var(--body);color-scheme:light}
html.work body{background-image:none;font-size:14px}
html.work .px{display:none!important}
html.work .sc{display:inline;font-family:var(--body);font-size:13px;font-weight:700;color:var(--fg);line-height:1}
html.work .seal{background:var(--panel2)!important;box-shadow:0 0 0 1px var(--line)!important}
html.work .itm{background:var(--panel2)!important;border-color:var(--line)!important}
html.work .bk-deco,html.work .tab b,html.work .big,html.work .stamp,html.work .lg-hz,html.work .empty-state b{display:none!important}
html.work .stars{color:var(--mute)!important;letter-spacing:0}
html.work .dup b{font-weight:600;color:var(--mute)}
html.work .bu.hit,html.work .dmg{animation:none!important}
html.work #work-btn{background:#555;color:#fff}
/* 남은 색(고정 색 버튼·막대·뱃지)까지 흑백으로 */
html.work #app,html.work #sheet,html.work #battle,html.work #toast{filter:grayscale(1)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand-hz{font-family:var(--display);font-size:22px;color:var(--bronze);letter-spacing:.04em;white-space:nowrap}
.brand-ko{font-size:12px;color:var(--mute);letter-spacing:.2em}
.res{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.coin{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-weight:700;font-variant-numeric:tabular-nums}
.sl{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-family:var(--display);font-size:13px;color:var(--ink);font-weight:400}
.sl.gold{background:var(--bronze)} .sl.food{background:var(--jade)}

.claim{margin:0 16px 8px;display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.claim .meter{flex:1;min-width:0}
.claim .lab{font-size:12px;color:var(--mute)}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--jade);border-radius:3px;transition:width .4s}
.banner{margin:0 16px 8px;font-size:12px;color:var(--mute);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}

main#view{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 24px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--panel)}
.tab{background:none;border:0;padding:8px 0 10px;min-height:56px;justify-content:center;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute)}
.tab b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1}
.tab span{font-size:12px}
.tab[aria-current="true"]{color:var(--bronze)}

h2{font-family:var(--display);font-weight:400;font-size:22px;margin:8px 0 4px;text-wrap:balance}
h3{font-size:14px;margin:16px 0 8px;color:var(--mute);letter-spacing:.06em;font-weight:500}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

.btn{background:var(--bronze);color:var(--ink);font-weight:700;border:0;border-radius:8px;padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.red{background:var(--cinnabar);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:7px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* seals */
.seal{--fac:var(--qun);--rc:var(--r3);width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:24px;color:var(--ink);background:var(--fac);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--rc)}
.seal.lg{width:72px;height:72px;font-size:40px}
.seal.sm{width:34px;height:34px;font-size:18px}
.f-wei{--fac:var(--wei)} .f-shu{--fac:var(--shu)} .f-wu{--fac:var(--wu)} .f-qun{--fac:var(--qun)}
.r2{--rc:var(--r2)} .r3{--rc:var(--r3)} .r4{--rc:var(--r4)} .r5{--rc:var(--r5)}
.seal.r5{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--r5),0 0 14px rgba(233,198,108,.45)}
.stars{color:var(--rc);font-size:12px;letter-spacing:-1px}
.cls{font-family:var(--display);font-size:13px;color:var(--mute)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.gc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.gc .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gc .meta{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.gc.in-deck{border-color:var(--bronze-d)}
.chip{font-size:11px;border:1px solid var(--bronze-d);color:var(--bronze);border-radius:999px;padding:0 6px}

.exmap{display:flex;flex-direction:column;gap:6px;margin:6px 0 2px}
.exrow{display:flex;gap:6px;align-items:stretch}
.exrn{width:16px;flex:none;align-self:center;color:var(--mute);font-size:12px;text-align:center}
.exn{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 9px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--mute);opacity:.45;font:inherit}
.exn b{font-size:17px;line-height:1.1;color:var(--ec)}.exn small{font-size:12px}
.exn .exto{position:absolute;bottom:0;left:0;right:0;font-style:normal;font-size:9px;line-height:1;color:var(--mute);letter-spacing:2px}
.exn.can{opacity:1;border:2px solid var(--ec);color:var(--fg);cursor:pointer;animation:exp 1.6s ease-in-out infinite}
@keyframes exp{50%{box-shadow:0 0 10px -2px var(--ec)}}
@media (prefers-reduced-motion:reduce){.exn.can{animation:none}}
.exn.past{opacity:.75;background:var(--panel);border-style:dashed;border-color:var(--ec);color:var(--fg)}.exn.cur{outline:2px solid var(--bronze);outline-offset:1px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;margin:4px 0 12px}
.seg button{flex:1;background:none;border:0;border-radius:7px;padding:7px 0;color:var(--mute);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg)}
.seg-top{margin-bottom:8px}.seg-top button{font-weight:700}.seg-top button[aria-pressed="true"]{background:var(--bronze);color:var(--ink)}

/* stage map */
.chap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.chap.locked{opacity:.5}
.chap-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.chap-h .hz{font-family:var(--display);font-size:24px;color:var(--bronze)}
.chap-h .ko{font-weight:700}
.chap-h .pg{margin-left:auto;font-size:12px;color:var(--mute)}
.nodes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;position:relative}
.node{aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-family:var(--display);font-size:18px;color:var(--mute);padding:0}
.node.done{background:var(--bronze-d);border-color:var(--bronze);color:var(--fg)}
.node.next{border-color:var(--cinnabar);color:var(--fg);box-shadow:0 0 0 4px rgba(208,80,58,.18);animation:pulse 1.8s ease-in-out infinite}
.node.boss{border-style:double;border-width:4px}
.node:disabled{cursor:not-allowed}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(208,80,58,.05)}}

/* deck */
.slot{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.slot .pos{width:40px;flex:none;text-align:center;font-family:var(--display);color:var(--bronze);font-size:15px;line-height:1.1}
.slot .pos small{display:block;font-family:var(--body);font-size:11px;color:var(--mute)}
.slot .info{flex:1;min-width:0}
.slot .info b{display:block}
.slot .info span{font-size:12px;color:var(--mute)}
.slot.empty{border-style:dashed;color:var(--mute)}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;width:30px;height:24px;font-size:12px;padding:0}
.power{font-family:var(--display);font-size:28px;color:var(--bronze);line-height:1}
.legend{font-size:12px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
.legend b{color:var(--fg);font-weight:500}

/* gacha */
.banner-card{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:12px}
.banner-card .big{font-family:var(--display);font-size:56px;line-height:1;color:var(--bronze);opacity:.16;position:absolute;right:10px;top:4px;pointer-events:none}
.banner-card h2{margin-top:0}
.rates{display:flex;gap:12px;font-size:12px;margin:6px 0 14px;flex-wrap:wrap}
.rates span{color:var(--rc)}
.reveal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (min-width:768px){#app,.sheet-body,.bt{max-width:680px}body{font-size:16px}}
@media (max-width:380px){.reveal{grid-template-columns:repeat(4,1fr)}}
.reveal.six{grid-template-columns:repeat(6,1fr);gap:4px}@media (max-width:380px){.reveal.six{grid-template-columns:repeat(3,1fr);gap:8px}}
.rv{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;animation:pop .45s both;min-width:0}
.rv .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rv .tag{font-size:11px;color:var(--bronze)}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
/* 대량 소환 · 천장 · ★5 연출 (v3.4.0) */
.pity{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin:8px 0 0}.pity .bar{flex:1;margin:0}.pity b{color:var(--fg)}
.pity-hit{margin:0 0 10px;padding:8px 10px;border:1px solid var(--r5);border-radius:8px;color:var(--r5);font-size:13px;font-weight:700;text-align:center}
.pullsum{display:flex;justify-content:center;gap:16px;font-size:15px}.pullsum .r5{color:var(--r5)}.pullsum .r4{color:var(--r4)}.pullsum .r3{color:var(--r3)}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}@media (max-width:380px){.pgrid{grid-template-columns:repeat(5,1fr)}}
.pt{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;text-align:center;min-width:0}
.pt span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pt small{font-size:10px;color:var(--bronze);white-space:nowrap}
.pt .cnt{position:absolute;right:0;top:0;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 3px;font-size:10px;line-height:14px}
details.p3{margin-top:12px}details.p3 summary{cursor:pointer;font-size:14px;font-weight:700;margin-bottom:6px}
.rv.x5{position:relative;padding:6px 3px;border-radius:10px;overflow:hidden;isolation:isolate}
.rv.x5::before{content:'';position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 55%,var(--r5) 75%,#fff6d0 82%,transparent 92%);animation:r5spin 2.4s linear infinite;z-index:-2}
.rv.x5::after{content:'';position:absolute;inset:2px;border-radius:8px;background:radial-gradient(circle at 50% 30%,rgba(233,198,108,.4),var(--panel) 72%);z-index:-1}
.rv.x5 .seal,.rv.x5 .itm{animation:r5silh 1.2s ease-out both}.rv.x5 .nm{color:var(--r5)}
.rv.x5 .spk{position:absolute;width:4px;height:4px;background:#fff6d0;border-radius:50%;box-shadow:0 0 6px 2px rgba(233,198,108,.8);animation:r5tw 1.6s ease-in-out infinite;z-index:1}
.rv.x5 .spk:nth-child(1){left:12%;top:14%}.rv.x5 .spk:nth-child(2){right:14%;top:32%;animation-delay:.5s}.rv.x5 .spk:nth-child(3){left:22%;bottom:22%;animation-delay:1s}
@keyframes r5spin{to{transform:rotate(360deg)}}
@keyframes r5silh{0%{filter:brightness(0);transform:scale(.8)}55%{filter:brightness(0) drop-shadow(0 0 8px #e9c66c);transform:scale(1.08)}100%{filter:none;transform:none}}
@keyframes r5tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.r5fx{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,6,6,.88);overflow:hidden;cursor:pointer;animation:r5in .2s ease-out}
.r5-rays{position:absolute;left:50%;top:50%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;background:repeating-conic-gradient(rgba(233,198,108,.28) 0 6deg,transparent 6deg 18deg);animation:r5spin 6s linear infinite,r5ray 1.5s ease-out both}
.r5-flash{position:absolute;inset:0;background:radial-gradient(circle,#fff6d0 0,rgba(233,198,108,.7) 18%,transparent 55%);animation:r5flash 1.5s ease-out both}
.r5-stamp{position:relative;font:900 120px/1 var(--display);color:#e9c66c;text-shadow:0 0 24px rgba(233,198,108,.9),0 0 60px rgba(233,198,108,.6);animation:r5stamp .7s cubic-bezier(.2,1.6,.4,1) .15s both}
.r5-txt{position:relative;margin-top:14px;color:#fff6d0;font-size:18px;font-weight:700;letter-spacing:.1em;text-align:center;animation:r5in .4s ease-out .5s both}.r5-txt small{display:block;font-size:11px;font-weight:400;opacity:.6;letter-spacing:0;margin-top:6px}
@keyframes r5in{from{opacity:0}to{opacity:1}}
@keyframes r5ray{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes r5flash{0%{opacity:0}12%{opacity:1}100%{opacity:.25}}
@keyframes r5stamp{from{opacity:0;transform:scale(3) rotate(-14deg)}to{opacity:1;transform:rotate(-6deg)}}
html.work .rv.x5::before,html.work .rv.x5::after,html.work .rv.x5 .spk{display:none}html.work .rv.x5{border:1px solid var(--r5);overflow:visible}html.work .rv.x5 .seal,html.work .rv.x5 .itm{animation:none}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.li .info{flex:1;min-width:0}
.li .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .info span{font-size:12px;color:var(--mute)}
.li.me{border-color:var(--bronze-d)}
.rank{width:22px;text-align:center;font-family:var(--display);color:var(--bronze);font-size:18px;flex:none}
.av{width:34px;height:34px;border-radius:50%;flex:none;background:var(--panel2);object-fit:cover}
.itm{width:40px;height:40px;flex:none;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:22px;background:var(--panel2);border:1.5px solid var(--rc);color:var(--rc)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:var(--panel2);border-radius:10px;padding:8px;text-align:center}
.stat small{display:block;font-size:12px;color:var(--mute)}
.stat b{font-variant-numeric:tabular-nums}
.recbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.empty-state{text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px;padding:20px 16px;font-size:13px}
.empty-state b{display:block;font-family:var(--display);font-weight:400;font-size:28px;color:var(--bronze);margin-bottom:6px}

/* sheet */
#sheet{position:fixed;inset:0;background:rgba(4,8,8,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet-body{width:100%;max-width:540px;max-height:86%;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.sheet-h .x{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:50%;width:40px;height:40px;padding:0;font-size:16px;flex:none}

/* battle */
#battle{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bt{width:100%;max-width:540px;display:flex;flex-direction:column;padding:12px 16px;gap:12px;position:relative;
  background-image:radial-gradient(90% 40% at 50% 50%,rgba(208,80,58,.08),transparent 70%)}
.bt-head{display:flex;align-items:center;gap:8px}
.bt-title{font-family:var(--display);font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-side{font-size:12px;color:var(--mute);letter-spacing:.2em}
.bt-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bu{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;transition:opacity .3s,transform .15s}
.bu .bn{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bu .hp{width:100%;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bu .hp i{display:block;height:100%;background:var(--jade);transition:width .25s}
.bt-foe .bu .hp i{background:var(--cinnabar)}
.bu.dead{opacity:.28;filter:grayscale(1)}
.bu.act{transform:translateY(-4px);border-color:var(--bronze)}
.bt-foe .bu.act{transform:translateY(4px)}

// 서로 다른 진영 장수로 이루어진 인연(타국 인연)은 효과가 CROSS_MUL배
const CROSS_MUL=2;
BONDS.forEach(B=>{B.cross=new Set(B.ids.map(id=>GMAP[id].fac)).size>1;if(B.cross){const sc=o=>{if(!o)return;for(const k of Object.keys(o))o[k]=k==='spd'?Math.round(o[k]*CROSS_MUL):Math.round(o[k]*CROSS_MUL*1000)/1000};B.base={fx:{...B.fx},full:B.full?{...B.full}:null};sc(B.fx);sc(B.full)}});
// 인연 효과는 진형 전원에게 적용돼요(v1.18.0~). 전원 적용으로 바뀐 만큼, 진형 전체가 받는 효과의 총합이 이전과 비슷하도록 수치를 40%로 조정
const BOND_TEAM=.4;
BONDS.forEach(B=>{const sc=o=>{if(!o)return;for(const k of Object.keys(o))o[k]=k==='spd'?Math.max(1,Math.round(o[k]*BOND_TEAM)):Math.max(.01,Math.round(o[k]*BOND_TEAM*100)/100)};sc(B.fx);sc(B.full);if(B.base){sc(B.base.fx);sc(B.base.full)}});
// ★5 인연(v3.0.1): ★5 장수가 있고 ★3 장수가 없는 인연은 효과 ×1.15 (오호대장군 제외)
const BOND5_MUL=1.15;
BONDS.forEach(B=>{const rs=B.ids.map(i=>GMAP[i].rar);if(B.s5x||!rs.includes(5)||rs.includes(3))return;B.s5=1;const sc=o=>{if(!o)return;for(const k of Object.keys(o))o[k]=k==='spd'?Math.round(o[k]*BOND5_MUL):Math.round(o[k]*BOND5_MUL*100)/100};sc(B.fx);sc(B.full);if(B.base){sc(B.base.fx);sc(B.base.full)}});
function fxStr(v){const o=[];if(v.atk)o.push(`공격 +${Math.round(v.atk*100)}%`);if(v.hp)o.push(`체력 +${Math.round(v.hp*100)}%`);if(v.def)o.push(`방어 +${Math.round(v.def*100)}%`);if(v.spd)o.push(`속도 +${v.spd}`);return o.join(' · ')}
function facStr(v){return fxStr(v)+(v.r3?` · ★3 장수 추가 ${fxStr(v.r3)}`:'')}
function bondActive(B,ids){const have=B.ids.filter(x=>ids.has(x)).length;return have>=(B.min||B.ids.length)}
function bondFx(B,ids){return B.full&&B.ids.filter(x=>ids.has(x)).length>=(B.fullMin||B.ids.length)?B.full:B.fx}
// 연합군: ★3 이상 장수의 나라가 3개국 이상이면 진형 전원(★3 이상)에게 적용
const VOL_BONUS={1:{atk:.04,hp:.04},2:{atk:.07,hp:.07},3:{atk:.10,hp:.10}};
const ALLY_BONUS={3:{atk:.05,hp:.05,def:.05},4:{atk:.08,hp:.08,def:.08}};
function teamBonusInfo(us){
  const cnt={};us.forEach(u=>{if(u.rar>=3)cnt[u.fac]=(cnt[u.fac]||0)+1});
  const nn=Object.keys(cnt).length, ally=nn>=3?{n:Math.min(nn,4),b:ALLY_BONUS[Math.min(nn,4)]}:null;
  const facs=Object.entries(cnt).filter(([f,c])=>c>=3&&FAC_BONUS[f]).map(([f,c])=>({f,c,b:FAC_BONUS[f][Math.min(c,5)-3]}));
  const ids=new Set(us.map(u=>u.id).filter(Boolean));
  const n3=us.filter(u=>u.rar===3&&u.id&&GMAP[u.id]).length, vol=n3?{n:n3,b:VOL_BONUS[Math.min(n3,3)]}:null;
  return {facs,bonds:BONDS.filter(B=>bondActive(B,ids)),ids,ally,nn,vol};
}
function applyBonuses(us){
  const info=teamBonusInfo(us);
  us.forEach(u=>{
    let a=0,h=0,d=0,sp=0;const add=v=>{a+=v.atk||0;h+=v.hp||0;d+=v.def||0;sp+=v.spd||0};
    info.facs.forEach(F=>{if(u.fac===F.f&&u.rar>=3){add(F.b);if(F.b.r3&&u.rar===3)add(F.b.r3)}});
    info.bonds.forEach(B=>add(bondFx(B,info.ids)));
    if(info.vol&&u.rar===3&&u.id&&GMAP[u.id])add(info.vol.b);
    if(info.ally&&u.rar>=3)add(info.ally.b);
    u.atk=Math.round(u.atk*(1+a));u.maxhp=u.hp=Math.round(u.maxhp*(1+h));u.def=Math.round(u.def*(1+d));u.spd=Math.round((u.spd+sp)*10)/10;
  });
  return info;
}

  '조정 뒤 모의전(보물 +50): 보병 44% · 기병 43% · 궁병 51% · 책사 54%. 기병은 보물보다 전법 구조 쪽 문제라 다음에 따로 봐요.',
  '업데이트 기념으로 나팔 30개를 드려요. 공지를 확인하면 받아요.']},
 {v:'3.4.0',date:'2026-10-15',title:'병종별 보물 · 천장 · 대량 소환',reward:{ap:30},items:[
  '병종마다 쓸 수 있는 무기가 정해졌어요. 보병: 검·도끼·창·극 / 기병: 창·극·언월도·검 / 궁병: 활·검 / 책사: 부채·여의. 서책은 책사만 장착할 수 있어요. 방어구·명마·장신구는 지금처럼 모든 병종이 써요.',
  '무기도 명마처럼 장수당 1개만 장착할 수 있어요. 장착 화면 위에 그 장수가 쓸 수 있는 무기가 나오고, 못 끼는 보물은 이유와 함께 아래로 내려가요.',
  '부채(학우선·백우선·깃털부채)는 장신구에서 책사 전용 무기로 바뀌었어요. 효과는 그대로예요.',
  '새 보물 8종: ★5 패왕궁·원융노(활), 공작선(부채), 백옥여의(여의) · ★4 청우선, 철여의 · ★3 파초선, 죽여의. 보물 도감 세트 \'책사의 채비\', \'명궁의 신궁\'도 추가했어요. 예전 세트의 조건은 그대로예요.',
  '규칙에 맞지 않게 끼어 있던 보물은 모든 진형(방어 진형 포함)에서 자동으로 빠졌어요. 보물과 강화 단계, 도감 등록은 그대로예요. 추천 편성 · 연무장 · 덱코드 · 적 진형도 같은 규칙을 따라요.',
  '천장: 장수 등용과 보물 획득을 각각 누적 100회 할 때마다 장수 선택권·보물 선택권을 1장 드려요. ★5가 나와도 횟수는 이어지고, 등용 화면에서 진행도를 볼 수 있어요.',
  '대량 소환: 등용 화면의 [대량]에서 한 번에 최대 300회까지 뽑아요. 슬라이더나 빠른 버튼(10·30·50·100회 · 최대 · 획득권 모두)으로 고르고, 획득권을 먼저 쓴 뒤 모자란 만큼 군량으로 뽑아요. 10회마다 ★4 이상 보장이에요.',
  '11회 이상 뽑으면 결과를 요약해서 보여 줘요. ★5는 카드로 크게, ★4·★3은 같은 것끼리 묶어 개수와 함께 보여 주고, [n회 더] 버튼으로 바로 다시 뽑을 수 있어요.',
  '★5 장수나 보물이 나오면 금빛 섬광과 天 도장 연출이 나온 뒤 결과가 열려요(누르면 건너뛰기). ★5 카드는 금빛 테두리가 돌고 실루엣에서 드러나요. 업무 모드와 동작 줄이기 설정에서는 연출 없이 바로 결과가 보여요.',
  '업데이트 기념으로 나팔 30개를 드려요. 공지를 확인하면 받아요.']},
 {v:'3.3.0',date:'2026-10-15',title:'전투 결과창 개편 · 전투 연출',reward:{ap:30},items:[
  '전투 결과창이 처음 열릴 때 勝·敗 도장, 전투 요약, 보상, 확인 버튼이 한 화면에 보여요. 위로 올리면 전투 기록·장수 상세·공유 버튼이 나와요.',
  '결과창에 전투 요약이 생겼어요. 진행한 턴 수와 양쪽 생존 인원, 양쪽이 준 총 피해 비교 막대, 아군 장수별 생존·남은 체력을 한눈에 볼 수 있어요.',
  '보상 숫자가 0부터 올라가며 표시되고, 확인 버튼은 스크롤해도 화면 아래에 붙어 있어요. 전투 기록 제목을 누르면 접고 펼 수 있어요.',
  '장수 상세 아래의 설명 문구를 없앴어요. 경감한 피해·화상 피해 설명은 도움말 \'전투 결과\'에서 볼 수 있어요.',
  '전투 연출이 생겼어요. 공격할 때 장수가 적 쪽으로 돌진하고, 전법은 이름이 크게 찍히며 시전 장수가 빛나요. 치명타는 화면이 살짝 흔들리고, 회복·화상·기절은 색으로 번쩍여요. 쓰러진 장수는 기울며 가라앉아요.',
  '마지막 일격 뒤 잠깐 멈췄다가 승리하면 주홍 먹이 번지고, 패배하면 화면이 빛을 잃은 뒤 결과창으로 넘어가요. 勝 도장이 찍힐 때 먹물이 튀어요.',
  '4배속·8배속에서는 돌진과 흔들림을 빼고 맞을 때 번쩍임만 보여 줘서 빠른 전투도 깔끔해요.',
  '전투 중 가운데에 양쪽이 준 총 피해 비교 막대가 실시간으로 나와요. 위의 [그래프] 버튼을 누르면 장수별 피해 막대가 겹쳐 보이고, 다시 누르면 닫혀요(마지막 상태를 기억해요).',
  '내 정보(설정)에 \'전투 화면 흔들림 끄기\'를 추가했어요. 기기의 동작 줄이기 설정을 켜면 모든 연출이 꺼져요.',
  '업데이트 기념으로 나팔 30개를 드려요. 공지를 확인하면 받아요.']},
 {v:'3.2.4',date:'2026-10-15',title:'홈 화면 앱 자동 업데이트',reward:{ap:30,gpk:10},items:[
  '홈 화면에 추가한 앱처럼 새로고침 버튼이 없는 곳에서도 새 버전을 받을 수 있어요. 앱을 열거나 다른 앱에 갔다 돌아올 때 새 버전을 확인하고, 있으면 화면 위에 [지금 업데이트] 안내가 떠요.',
  '[지금 업데이트]를 누르면 진행 상황을 먼저 저장한 뒤 새 버전을 불러와요.',
  '맨 위의 버전 글자(v3.2.4)를 누르면 언제든 새로고침돼요.',

 {v:'3.2.3',date:'2026-10-15',title:'전투 화면 편의 개선',reward:{ap:30},items:[
  '진형 화면에서 장수의 전법 설명이 두 줄에서 잘리지 않고 끝까지 보여요. 모바일에서도 긴 전법 설명을 모두 읽을 수 있어요.',
  '전투 배속 버튼을 누르면 4배속 → 8배속 → 1배속 → 2배속 순서로 바뀌어요. 마지막으로 고른 배속을 기억해서 다음 전투도 그 배속으로 시작해요(처음은 4배속).',
  '전투에서 지면 결과 화면 위에 패배 원인이 최대 3줄로 나와요. 진형 상성, 판정패 여부, 피해를 가장 많이 낸 적, 가장 먼저 쓰러진 아군, 적 체력 대비 준 피해 중 해당하는 내용을 알려 줘요.',
  '도움말에 \'전투 결과\' 항목을 추가해 MVP 선정 기준을 적었어요. 준 피해 + 회복량 × 0.6 점수가 가장 높은 장수가 MVP예요.',
  '업데이트 기념으로 나팔 30개를 드려요. 공지를 확인하면 받아요.']},
 {v:'3.2.2',date:'2026-10-15',title:'진형 편성 화면 개선',reward:{ap:30},items:[
  '둔영 진형 화면의 자리가 선봉·중견·후위 묶음으로 나뉘어 보여요. 묶음 제목에 그 줄의 인원과 효과가 나오고, 배치를 바꾸면 바로 바뀌어요.',
  '▲▼ 대신 ⇄ 버튼으로 자리를 맞바꿔요. ⇄를 누른 뒤 다른 자리를 누르면 두 장수가 자리를 바꾸고, 빈 자리를 누르면 그 자리로 옮겨요.',
  '이름 바꾸기·방어 진형 지정·복제·삭제·연무장으로 보내기·덱코드 버튼을 [⋯ 진형 관리] 하나로 모았어요.',
  '진형 자리 목록과 장수 고르기 창에 장수마다 전법 이름과 설명이 한 줄로 나와요.',
  '추천 편성에서 배치를 고르면 자리 이름(선봉·중견·후위)도 그 배치에 맞게 바뀌어요.',
  '전투 결과 화면의 勝·敗 도장을 작게 줄여 제목 옆에 붙였어요. 결과 내용이 스크롤 없이 바로 보여요.',
  '업데이트 기념으로 나팔 30개를 드려요. 공지를 확인하면 받아요.']},
 {v:'3.2.1',date:'2026-10-15',title:'원정군 모병 추천 · 다시하기',items:[
  '원정군 모병에서 후보마다 지금 원정군과 함께 발동하는 인연·진영·연합군 효과를 보여 주고, 새로 발동하는 후보에는 추천 표시가 붙어요. 1명만 더 있으면 발동하는 인연도 알려 줘요.',
  '모병 화면 아래에서 지금 원정군(체력·쓰러짐)과 발동 중인 인연을 볼 수 있어요.',
  '[원정 그만두기]에서 \'보상 받고 그만두기\'와 \'처음부터 다시하기\' 중에 고를 수 있어요. 다시하기는 보상 없이 새 지도·새 시작 장수로 1막 1줄부터 시작하고, 무료이며 횟수 제한이 없어요(오늘 원정 횟수는 그대로).']},
 {v:'3.2.0',date:'2026-10-15',title:'덱코드',items:[
  '둔영의 [덱코드]로 지금 진형을 코드로 복사해 친구에게 보낼 수 있어요. 카카오톡에 그대로 붙여 넣으면 돼요.',
  '받은 덱코드를 붙여 넣으면 지금 진형에 덮어쓰거나, 새 진형으로 저장하거나, 연무장 공격덱·방어덱으로 불러올 수 있어요.',
  '덱코드에는 장수 6자리, 배치, 진형 이름, 보물 종류가 들어가요. 자리 레벨·돌파·보물 강화 수치는 들어가지 않아요. 복사할 때 \'보물 포함\'을 끄면 보물은 빼고 보내요.',
  '내 진형으로 불러오면 가진 장수와 보물만 같은 자리에 들어가고, 없는 장수는 빈 자리로 남아요. 연무장으로 불러오면 모든 장수와 보물이 그대로 들어가요(레벨·강화는 그 연무장 덱 설정).',
  '연무장 덱에서도 [덱코드]로 복사하거나 불러올 수 있어요. 친구 덱을 방어덱에 넣고 추천 편성으로 이기는 진형을 찾아보세요.',
  '연무장의 [내 진형에 적용]에서 \'새 진형으로 저장\'도 고를 수 있어요.',
  '★5 3명 제한은 덱코드로 불러올 때도 그대로예요.']},
 {v:'3.1.0',date:'2026-10-15',title:'니니야 잠좀자라',reward:{gold:50000},items:[
  '추천 편성에서 병종을 1종만 골라도 추천받을 수 있어요. 궁병만, 책사만처럼 한 병종 위주의 진형을 찾아 줘요.',
  '고른 조건에 맞는 장수가 빈 자리보다 적으면, 맞는 장수를 모두 넣고 남는 자리는 다른 병종 장수 중 가장 잘 맞는 장수로 채워요(나라 조건을 함께 골랐다면 되도록 그 나라 장수로). 몇 자리를 다른 장수로 채웠는지 추천 화면과 결과에 보여 줘요.',
  '추천 편성에서 배치를 고정할 수 있어요. 자동이면 배치 6종을 모두 비교하고, 하나를 고르면 그 배치 안에서 장수와 자리만 추천해요.',
  '보물을 진형마다 따로 끼워요. 같은 보물을 여러 진형(방어 진형 포함)에서 함께 쓸 수 있고, 한 진형 안에서는 한 번씩만 쓸 수 있어요. 지금 낀 보물은 모든 진형에 그대로 복사해 뒀어요.',
  '다른 진형이나 추천 편성에서 보물을 바꿔도 방어 진형의 보물은 빠지지 않아요.',
  '야전과 연습 대전에서 상대가 낀 보물은 보이지 않아요(진형 보기, 전투 결과). 내 보물은 전투 결과에서 나만 볼 수 있고, 결과 공유 링크와 결과 이미지에는 양쪽 보물이 모두 나오지 않아요. 전투력과 장수·배치는 지금처럼 보여요.',
  '보물 판매와 일괄 판매, 보물 잠금을 없앴어요. 보물은 도감에 계속 쌓여요.',
  '★5 3명 제한, 고정 장수·보물은 그대로예요.']},
 {v:'3.0.3',date:'2026-10-15',title:'월급루팡 만세!',items:[
  '무장 탭과 도감 탭을 합쳤어요. 무장 탭 맨 위에서 보유무장과 도감을 골라 볼 수 있어요.',
  '보유무장은 예전 무장 탭(장수 · 보물), 도감은 예전 도감 탭(장수 · 보물 · 인연) 그대로예요. 아래 탭은 5개가 됐어요.',
  '업무 모드에서 등급 별(★)이 R5 · R4 · R3 같은 글자로 바뀌어요.',
  '업무 모드에서 돌파 ◆◇ 표시가 3/5처럼 숫자로 바뀌어요. ★3 장수의 한계돌파는 7/10처럼 하나로 합쳐 보여요.']},
 {v:'3.0.2',date:'2026-10-15',title:'선택권 보유 필터',items:[
  '장수 선택권 · 보물 선택권 고르기 화면에 보유 필터(전체 · 미보유 · 보유)가 생겼어요. 아직 없는 장수나 보물만 골라 볼 수 있어요.']},
 {v:'3.0.1',date:'2026-10-15',title:'등급 조정 · 밸런스 패치',reward:{gtk:5,itk:20},items:[
  '★5로 승급: 동탁 · 장각 · 황충 · 태사자. ★5는 17명이 되고, 처음으로 궁병 ★5가 생겼어요. ★5 등용 확률(3%)은 그대로예요.',
  '★4로 승급: 위연 · 엄안 · 고순 · 진궁 · 주태. 한계돌파(6~10단계)였다면 5단계로 맞추고 넘친 단계마다 금 200을 돌려드려요.',
  '진형에 ★5가 4명 이상이 되면 4번째 ★5부터 빈자리가 돼요. 둔영에서 진형을 확인해 주세요.',
  '회복 하향: 순욱 아군 전체 15%→7%, 장각 10%→5%, 손권 12%→4%(방어 +20%→+15%), 유비 8%→5%, 하후돈 자신 25%→6%, 주태 25%→18%, 이전 15%→5%, 간옹 15%→10%, 제갈근 20%→12%, 유순 15%→8%. 6인 진형에서 전체 회복이 6명 모두에게 들어가 너무 강했어요.',
  '그 밖의 하향: 장료 0.6배→0.45배(공격 감소 -20%→-10%), 육손 0.45배→0.4배(화상 9%→7%), 공손찬 1.2배→1.0배, 하후돈 2.4배→2.0배.',
  '★5 상향: 등애 2.0배+자신 회복 15%, 관우 5회 1.0배, 손책 4.2배, 손견 3.8배, 여포 1.2배, 조조 0.7배(공격 +25%), 사마의 0.65배, 초선 0.7배(기절 50%), 황충 3.6배, 태사자 3.6배(기절 60%).',
  '★4 상향: 허저 4.2배(방어 감소 없앰, 자신 회복 12%), 전위 3.0배(아군 방어 +30%, 대신 맞는 피해 -50%), 곽가 5.0배(방어 40% 무시), 위연 6.0배, 손상향 4회 1.4배, 학소 1.6배+자신 회복 10%, 하후연 1.2배, 축융 0.9배, 한수 2.0배(전법 피해 감소 40%), 고순 3.0배, 서성 2.2배, 엄안 2.6배, 진궁 0.65배, 법정 2.6배, 방통 0.5배.',
  '★3 상향: 능통 2.6배, 요화 2.4배, 주창 2.0배, 악진 2.4배, 한당 1.3배, 마대 2.8배, 원술 아군 공격 +35%(자기 방어 감소 -10%).',
  '진영 보너스(3·4·5명 이상): 군웅 방어 12/20/28%, 공격·체력 4/8/11%, ★3 추가 1/2/3% · 촉 체력 8/13/19% · 위 공격 그대로 + 방어 4/7/10% · 오 공격 7/12/18%(속도 그대로).',
  '의용군(★3 1·2·3명)이 공격·체력 +5/10/15%에서 +4/7/10%로 바뀌었어요. ★5가 있고 ★3이 없는 인연은 효과가 1.15배가 됐어요. 오호대장군 4명 이상 효과는 공격 +10%에서 +8%로 낮췄어요.',
  '같은 나라 안에서 ★5 인연 덱이 ★3 위주 덱보다 강하도록 맞췄어요. ★3은 키우기 쉽고 인연을 채우는 역할이에요.',
  '패치 기념으로 장수 선택권 5장과 보물 획득권 20장을 드려요.']},
 {v:'3.0.0',date:'2026-10-15',title:'대격변 · 6인 진형 · 진형 상성',reward:{gold:100000,gtk:5},items:[
  '진형이 5명에서 6명으로 늘었어요. ★5 장수는 진형마다 3명까지 넣을 수 있어요.',
  '새로 생긴 6번째 자리는 지금 자리 중 가장 낮은 레벨로 무료로 열려요. 기존 진형의 6번째 칸은 비어 있으니 장수를 넣어 주세요.',
  '배치가 6가지로 바뀌었어요: 추행진(1·3·2), 학익진(1·2·3), 어린진(1·4·1), 방원진(2·2·2), 안행진(2·1·3), 봉시진(2·3·1). 배치마다 줄 효과가 달라요.',
  '기존 배치는 자동으로 옮겨져요: 돌격진 → 방원진, 기본진 → 안행진, 수비진 → 학익진. 기존 5명의 줄은 그대로이고 6번째 자리는 후위예요.',
  '배치끼리 상성이 생겼어요. 상성에서 이긴 쪽은 전원 공격 +10%. 둔영의 [상성 ?] 버튼으로 상성표를 볼 수 있어요.',
  '스테이지·천명탑·수성전·원정군·연습전 적도 6명이 되고 배치가 정해져 있어요. 스테이지 화면에서 적 배치와 상성을 미리 볼 수 있어요. 원정군은 둔영에서 고른 진형의 배치를 따라요.',
  '야전 방어 진형은 주인이 접속해 다시 저장할 때까지 5명으로 싸울 수 있어요. 앱을 최신 버전으로 새로고침해 주세요(이전 버전에서는 상대의 6번째 장수가 보이지 않아요).',
  '대격변 기념으로 금 100,000과 장수 선택권 5장을 드려요.']},
 {v:'2.1.2',date:'2026-10-15',title:'메뉴 정리 · 화면 개선',reward:{ap:20},items:[
  '야전 탭 이름이 \'전장\'으로 바뀌었어요. 전장 안에 야전·토벌전·수성전·천명탑·원정군이 있어요.',
  '연무장이 둔영 탭으로 옮겨졌어요. 둔영 위쪽에서 진영(내 진형 편성)과 연무장을 오가며 쓸 수 있어요. 기능과 저장된 덱은 그대로예요.',
  '작은 글씨를 한 단계씩 키워 읽기 쉽게 했어요.',
  '태블릿·PC처럼 넓은 화면에서는 화면 폭을 넓혀 보여 줘요.',
  '창 닫기(✕) 버튼과 아래쪽 탭 버튼을 누르기 쉽게 키웠어요.',
  '야전·토벌전·수성전 전투 화면에 \'중도포기\' 버튼이 생겼어요. 결과가 나오기 전에 그만두면 도전 횟수와 보상, 기록이 남지 않아요. 같은 날 같은 차례의 도전은 다시 해도 같은 진형이면 같은 결과가 나와요.',
  '육손의 전법 \'화소연영\' 화상 피해를 매 턴 공격의 12%에서 9%로 낮췄어요. ★5 주유(10%)보다 화상이 강했던 점을 바로잡았어요.',
  '손권의 전법 \'강동 수성\' 회복량을 아군 전체 20%에서 12%로 낮췄어요. 방어 +20%(2턴)는 그대로예요. ★5 순욱(15%)보다 많이 회복해 책사 중 승률이 가장 높았어요.']},
 {v:'2.1.1',date:'2026-10-15',title:'새 장수 5명 · 해제 · 전법 피해 감소',reward:{ap:20},items:[
  '새 장수 5명이 등용에 추가됐어요: ★5 순욱(위·책사), ★4 법정(촉·책사), ★4 한수(군웅·보병), ★3 간옹(촉·책사), ★3 우번(오·책사). 법정·한수·간옹·우번은 원정군의 시작 장수와 모병 후보로도 나와요.',
  '순욱 \'왕좌지재\': 아군 전체 체력 15% 회복, 아군 전체의 해로운 효과(공격·방어 감소, 화상, 기절)를 해제해요. 해제는 새 전법 효과예요.',
  '한수 \'관서 연합\': 맨 앞 적에게 1.5배 피해, 2턴 동안 아군 전체가 받는 전법 피해 -30%. 전법 피해 감소는 새 전법 효과로, 일반 공격과 화상 피해는 줄지 않고 여러 번 겹쳐도 최대 50%예요.',
  '법정 \'정군산의 계책\': 공격력이 가장 높은 적에게 2.2배 치명타 확정, 아군 전체 공격 2턴 +10%. 간옹 \'성도 설득\': 적 전체 공격 2턴 -15%, 체력이 가장 낮은 아군 15% 회복. 우번 \'역경의 점복\': 적 전체 0.4배 피해, 각 25% 확률로 1턴 기절.',
  '새 인연 5개: 빈 찬합(순욱·조조), 정군산(법정·황충), 관서 연합군(한수·마초), 죽마고우(간옹·유비), 강동의 직언(우번·손책).',
  '장수 고르기·무장·도감의 전법 종류 필터에 \'해제\'와 \'전법 피해 감소\'가 생겼어요.']},
 {v:'2.1.0',date:'2026-10-15',title:'원정군',reward:{ap:20},items:[
  '야전 탭에 \'원정군\'이 생겼어요. 무작위 ★3 장수 3명으로 황건적의 난 → 반동탁 연합 → 적벽대전 3막을 돌파하는 도전이에요. 하루 2회까지 출발할 수 있어요.',
  '막마다 7줄짜리 갈래길 지도가 있어요. 전투·정예·주막·모병 중 갈 곳을 골라 가고, 7줄에서 보스(장각 · 화웅·여포·동탁 · 주유와 오의 장수들)와 싸워요. 같은 주에는 모두 같은 지도·적·시작 장수예요.',
  '체력은 전투가 끝나도 그대로 이어져요. 주막에서 체력 50%를 회복하고 쓰러진 장수는 체력 30%로 돌아와요. 보스를 이기면 전원 완전 회복이에요. 모병에서는 장수 3명 중 1명을 영입해 최대 5명까지 데려갈 수 있어요.',
  '레벨은 1막 20 · 2막 30 · 3막 40으로 고정이고 돌파·보물은 없어요. 내 장수 성장과 상관없이 모두 같은 조건이에요. 전투를 이기면 천명의 탑과 같은 천명 3개 중 하나를 골라 쌓아요. 정예는 희귀 이상, 보스는 전설 천명이 나와요.',
  '보상: 진행한 칸에 비례해 금을 받아요(정복 = 시간당 금 생산량 12시간분). 3막 보스까지 이기면 보물 선택권 1장을 받아요. 이번 주 최고 기록은 순위로 보여요.']},
 {v:'2.0.5',date:'2026-10-15',title:'천명의 탑 · 전위 리워크',reward:{ap:20},items:[
  '야전 탭에 \'천명탑\'이 생겼어요. 내 진형으로 30층까지 올라가는 도전이에요. 한 번 지면 그 도전은 끝나요. 하루 3회까지 도전할 수 있어요.',
  '층을 깰 때마다 천명 3개 중 하나를 골라 쌓아요. 천명은 26종이고 일반 60% · 희귀 32% · 전설 8% 확률로 나와요. 병종 천명은 그 병종이 2명 이상일 때만 나와요.',
  '적은 도전을 시작할 때 내 진형 전투력에 맞춰져요. 1층은 내 전투력의 60%이고, 한 층 오를 때마다 8%씩 강해져요. 5층마다 보스(장각·동탁·여포·원소·사마의·조조)가 나와요. 같은 주에는 모두 같은 장수와 싸워요.',
  '보상: 깬 층에 비례해 금을 받아요(30층 = 시간당 금 생산량 8시간분). 30층을 돌파하면 장수 등용권 10장을 받아요. 이번 주 최고 층은 순위로 보여요.',
  '전위 \'악래의 호위\' 리워크: 전법은 맨 앞 적 1.8배 피해 + 아군 전체 방어 2턴 +20% + 자신 체력 15% 회복이에요. 새 특성으로 전투마다 2번(조조가 있으면 3번), 아군이 쓰러질 피해를 받으면 전위가 대신 맞아요. 이때 받는 피해는 30% 줄어요. 같은 전투력 상대 기준 승률 기여가 ★4 보병 중 최하위에서 우금·허저 수준으로 올라와요.']},
 {v:'2.0.4',date:'2026-10-15',title:'이름 변경 · 장수 고르기 필터 · 금화 룰렛 개편 · 유비 조정',items:[
  '메뉴 이름이 바뀌었어요: 둔영 탭 → 둔영, 토벌전 → 토벌전, 야전 → 야전, 연무장 → 연무장. 기능과 기록은 그대로예요.',
  '둔영의 자리 편성과 연무장 장수 고르기에 이름 검색, 나라·병종·등급·전법 종류 필터, 정렬(전투력·등급·공격·방어·체력·속도·이름)이 생겼어요.',
  '무장 탭에 이름 검색, 전법 종류(아군 회복·아군 강화·자신 강화·회복·적 약화·도발·호위·기절·화상·광역·연속·단일), 상태(편성 중·미편성·돌파 최대·돌파 남음) 필터와 공격·방어·체력·속도·이름 정렬이 생겼어요. 보물도 이름 검색과 장착 여부로 거를 수 있어요.',
  '도감에 이름 검색, 병종·등급·전법 종류·보유 여부 필터와 이름 정렬이 생겼어요.',
  '금화 룰렛을 새로 꾸몄어요. 1회 금 1,000으로 금 · 군량 · 나팔 · 보물 획득권 · 장수 등용권 · 장수 선택권(희귀) · 보물 선택권(매우 희귀) 중 하나를 받아요. 하루 20회는 그대로예요.',
  '새 재화 장수 등용권: 장수 등용 1회에 군량 대신 먼저 쓰여요.',
  '유비의 전법 \'인덕\' 회복량을 아군 전체 15%에서 8%로 낮췄어요. 공격 +10% 효과는 그대로예요. 보병은 3번 행동마다 전법을 써서 책사보다 자주 회복해, 같은 ★4 회복 장수인 손권보다 한 판 회복량이 약 2배였고 수성전에서는 성 체력의 80%가량을 되돌려 놓았어요.']},
 {v:'2.0.3',date:'2026-10-15',title:'출석 보상 자동 지급 · 진형 20개 · 회복·호위 · 오장원 · 자동 진군',reward:{ap:20},items:[
  '시즌 출석률 70% 이상이면, 다음 시즌 첫 접속 때 장수 선택권 5장과 보물 선택권 10장이 자동으로 들어와요. 쿠폰을 입력할 필요가 없어요(테스트 기간은 제외).',
  '진형을 20개까지 만들 수 있어요. 진형이 많으면 진형 목록을 옆으로 밀어서 볼 수 있어요.',
  '손권이 궁병에서 책사로 바뀌었어요. 전법 강동 수성의 회복량이 12%에서 20%로 올랐어요(책사는 네 번째 행동마다 전법이라 발동 횟수가 줄어든 만큼 보정).',
  '장각의 전법이 태평도로 바뀌었어요: 적 전체 0.4배 피해, 각 20% 확률로 1턴 기절, 아군 전체 체력 10% 회복. 군웅에도 회복 장수가 생겼어요.',
  '전위의 전법이 악래의 호위로 바뀌었어요: 맨 앞 적에게 1.5배 피해, 조조가 있으면 조조를(없으면 체력이 가장 낮은 아군을) 2턴 동안 호위해요. 호위받는 아군이 쓰러질 만큼 피해를 받으면 전위가 대신 맞아요.',
  '마지막 장 오장원을 최상위권에 맞춰 어렵게 바꿨어요. 적 전투력이 제1전 약 18,000에서 제갈량·사마의가 맞서는 마지막 전투 약 30,000까지 올라가요.',
  '자동 진군: 내 진형 전투력이 스테이지 적 전투력의 120% 이상이면 전투 없이 돌파해요. 출정 탭의 \'자동 진군\' 버튼을 누르면 돌파할 수 있는 곳까지 한 번에 깨요(스테이지마다 나팔 3개, 첫 승리 보상은 그대로).']},
 {v:'2.0.2',date:'2026-10-15',title:'시즌제 운영 안내 (11월 1일 시즌 1 시작)',reward:{ap:20},items:[
  '10월 31일 23:59까지는 테스트 기간이에요.',
  '11월 1일 새 빌드와 함께 시즌 1이 시작돼요. 시즌은 3개월 단위예요(시즌 1: 11월~1월, 시즌 2: 2월~4월 …).',
  '11월 1일에 한 번 초기화해요. 초기화: 장수 · 보물 · 자리 레벨 · 스테이지 · 재화. 그대로 남는 것: 진형 이름·배치, 연습장 덱, 계정 연동, 출석 일수.',
  '시즌 1 시작 재화는 쿠폰으로 넉넉히 드려요. 시즌 중에도 쿠폰을 주기적으로 배포할게요.',
  '시즌이 끝나면 그 시즌 동안 얻은 금 · 군량 · 보물 획득권의 70%를 돌려드려요. 약 4주면 원래 수준을 되찾을 수 있는 양이에요.',
  '명예의 전당: 최고 전투력, 레이드 누적 기여, 결투장 승수, 수성전 주간 1위 횟수, 보물 진척도는 시즌이 바뀌어도 기록으로 남아요.',
  '시즌 출석률 70% 이상인 군주에게는 시즌이 끝나면 장수 선택권 5장과 보물 선택권 10장을 드려요.',
  '새 아이템: 장수 선택권(원하는 장수 1명, 이미 있으면 돌파 +1) · 보물 선택권(원하는 보물 1개, 이미 있으면 강화 +1). 쿠폰으로 받고 등용 탭에서 써요.',
  '열심히 한 군주는 운영자 판단으로 회식에 초대해요. 안 오면 손해예요!',
  '출석률은 지금부터 기록돼요. 공지·출석 창과 내 정보에서 이번 기간 출석률을 볼 수 있어요(테스트 기간은 오늘부터 계산).',
  '3일 이상 접속하지 않은 군주는 결투장 군주 목록에 \'○일 미접속\'으로 표시돼요. 군주를 누르면 출석률과 마지막 접속도 보여요.',
  '명예의 전당과 시즌 환불은 11월 1일 시즌 빌드에서 시작돼요.']},
 {v:'2.0.1',date:'2026-10-15',title:'연습장 추천 편성 · 내 진형과 기능 공유',reward:{ap:20},items:[
  '연습장 공격덱·방어덱에도 \'추천 편성\'이 생겼어요. 모든 장수와 모든 보물(덱의 강화 단계) 중에서 고르고, 고정 장수·보물, 나라·병종 조건, 배치 추천까지 내 진형과 똑같이 써요.',
  '연습장 추천의 기본은 \'상대 덱 맞춤\'이에요. 공격덱은 반대편 방어덱을 가장 잘 이기는 덱을, 방어덱은 공격덱을 가장 잘 막아 내는 덱을 찾아요. 결투장용·레이드용도 고를 수 있어요.',
  '내 진형의 추천 편성에도 \'연습장 방어덱 상대\'가 생겼어요. 연습장에 상대 덱을 꾸며 두면 그 덱을 이기는 내 진형을 추천받을 수 있어요.',
  '연습장 덱마다 레벨(Lv 10~50)을 고를 수 있고, 덱 이름도 바꿀 수 있어요.',
  '진형 탭의 \'연습장으로\' 버튼으로 지금 진형을 연습장 공격덱에 보내요. 배치와 함께 레벨·보물 강화도 가장 가까운 연습장 단계로 맞춰요.',
  '진형 자리에 장수를 넣을 때 나라·병종으로 거를 수 있어요.']},
 {v:'2.0.0',date:'2026-10-15',title:'v2.0 · 수성전 9곳 · 주간 순위 · 새 장수 4명',reward:{ap:30,food:1000},items:[
  '수성전 성이 9곳으로 늘었어요: 합비·소패·진창·번성·강릉·사수관·낙성·하비·역경. 매주 월요일 0시에 3곳이 열리고, 같은 성은 2주 연속 나오지 않아요.',
  '성마다 그 주의 적 성향(무작위·보병·기병·궁병·책사 위주)이 정해져요. 수성전 화면에서 다음 주에 열릴 성과 적 성향을 미리 볼 수 있어요.',
  '성마다 보상이 달라요: 금(합비·강릉·하비), 군량(소패·번성), 금+군량(진창·낙성), 보물 획득권(사수관·역경). 어려운 성일수록 1턴 보상이 조금 더 많아요.',
  '하루 도전은 성마다 5판이에요(열리는 성이 3곳이라 하루 최대 15판).',
  '주간 순위가 생겼어요. 성마다 이번 주 최고 기록(버틴 턴 → 남은 성 체력 순)으로 줄 세우고, 군주를 누르면 수비 진형과 보물을 볼 수 있어요. 기록을 깰 때만 저장돼요.',
  '수성 명장: 그 성을 지켰던 장수(합비 장료, 소패 유비, 진창 학소, 번성·강릉 조인, 사수관 화웅, 낙성 유순, 하비 여포·진궁·고순, 역경 공손찬)가 진형에 있으면 성 체력 +10%.',
  '새 장수 7명: 학소(★4 위·보병), 공손찬(★4 군웅·기병), 손상향(★4 오·궁병), 조인(★3 위·기병), 제갈근(★3 오·책사), 주창(★3 촉·보병), 유순(★3 군웅·보병). 새 인연 12개도 생겼어요. 나라별 장수 수는 촉 14 · 위 15 · 오 15 · 군웅 15명이에요.']},
 {v:'1.20.2',date:'2026-10-14',title:'수성전 · 진형 배치(돌격진·기본진·수비진)',reward:{ap:20},items:[
  '결투장 탭에 수성전이 생겼어요. 합비(손권)와 소패(여포)를 지켜요. 적이 내 장수를 때린 피해는 성 체력(내 진형 전투력 × 4)에서 빠지고, 내 장수는 쓰러지지 않아요.',
  '적 무리를 모두 물리치면 다음 무리가 1.35배 강해져서 몰려와요. 성이 무너질 때까지 버틴 턴만큼 합비는 금, 소패는 군량을 받아요(최대 150턴).',
  '재도전 대기는 버틴 턴에 비례해요(1턴 10분 ~ 100턴 이상 2시간). 성마다 하루 8판까지예요.',
  '진형마다 배치를 고를 수 있어요. 돌격진(선봉 2·중견 2·후위 1): 선봉 속도 +12, 후위가 받는 피해 +15%. 기본진(2·1·2): 효과 없음. 수비진(1·2·2): 선봉이 받는 피해 +15%, 후위가 받는 피해 −10%.',
  '보병·기병의 일반 공격과 \'맨 앞 적\' 전법은 이제 가장 앞줄 장수 중 한 명을 노리고, \'맨 뒤 적\' 전법은 가장 뒷줄 장수 중 한 명을 노려요.',
  '전투 화면에서 선봉·중견·후위가 줄로 나뉘어 보여요. ⚡는 속도가 오른 선봉, ▲는 받는 피해가 늘어난 장수, ▼는 줄어든 장수예요.',
  '결투장 방어 진형, 연습장, 레이드, 결과 공유 링크, 추천 편성(배치까지 추천)에도 적용돼요.']},
 {v:'1.20.1',date:'2026-10-14',title:'추천 편성 개선 · 나라·병종 · 업무 모드',reward:{ap:20},items:[
  '추천 편성이 전투력 점수 대신 실제 전투 계산으로 진형을 골라요. 결투장용은 결투장 상위 군주들의 방어 진형과 대표 진형들을 상대로 모의전을 치러 승률이 가장 높은 조합과 자리 순서를 찾아요.',
  '전투력 점수는 전법·속도·자리 효과를 반영하지 못해 ★3 군웅 진형을 너무 높게 쳤어요. 실제 전투에서는 그 진형이 ★4·★5 진형에게 거의 이기지 못했어요.',
  '자리 순서도 모의전으로 정해요. 같은 장수라도 순서에 따라 승률이 크게 달라져요.',
  '오른쪽 위 ◐ 버튼(PC는 ` 키)으로 업무 모드를 켜면 픽셀아트와 한자 장식이 사라지고 흰색·회색만 쓰는 화면으로 바뀌어요. 이 기기에만 기억돼요.',
  '추천 편성에서 나라(여러 개 가능)와 병종(2종 이상)을 골라 그 안에서만 추천받을 수 있어요. 고정한 장수는 조건과 상관없이 그대로 남아요.',
  '보물 배치도 모의전으로 한 번 더 다듬어요. 보물끼리 장수를 바꿔 보거나 남는 보물로 바꿔 보면서, 치명 확정 전법에 치명 피해, 전법이 강한 장수에 전법 피해처럼 장수와 잘 맞는 조합을 찾아요.',
  '추천은 지금 가진 보물의 강화 단계와 병종·나라 전용 효과를 그대로 반영해요.'
]},
 {v:'1.20.0',date:'2026-10-14',title:'추천 편성',reward:{ap:20},items:[
  '진형 탭의 \'추천 편성\'으로 가진 장수와 보물 중에서 진형과 보물 배치를 추천받을 수 있어요.',
  '남기고 싶은 장수는 \'고정\'을 누르고, 그 장수의 보물 중 그대로 둘 것도 눌러 고정하세요. 나머지 자리와 보물 칸만 추천으로 채워요.',
  '진영·인연·연합군 효과와 보물 도감까지 넣어 계산하고, 보병은 체력·방어, 기병·궁병은 공격, 책사는 공격·전법 피해를 더 높게 쳐요.',
  '\'레이드용\'을 고르면 후보 진형들을 이번 레이드 보스와 직접 싸워 보고 평균 피해가 가장 큰 진형을 추천해요.',
  '결과를 미리 본 뒤 지금 진형에 적용하거나 새 진형으로 저장할 수 있어요. 다른 장수가 끼던 보물을 옮겨 오면 그 장수에게서는 빠져요.']},
 {v:'1.19.1',date:'2026-10-14',title:'진형 5개 · 전투 기록 상세',reward:{ap:20},items:[
  '진형을 5개까지 만들고 이름을 붙일 수 있어요. 진형 탭 위쪽에서 고르고, 고른 진형으로 출정·레이드·결투 공격을 해요.',
  '防 표시가 붙은 진형이 결투장 방어 진형이에요. 진형 탭에서 \'방어 진형으로 지정\'으로 바꿀 수 있어요.',
  '자리 레벨(Lv)과 장수의 보물은 모든 진형이 함께 써요.',
  '스테이지 출진 창, 레이드, 결투장에서도 쓸 진형을 바로 바꿀 수 있어요.',
  '전투 결과에서 장수 이름을 누르면 아래 기록 창이 그 장수로 바뀌어요. MVP는 이름 옆과 창에 따로 표시돼요.',
  '기록 창의 보물이나 전법을 누르면 설명이 떠요. 보물은 강화 단계별(+0·+10·+25·+50) 수치도 보여 줘요.',
  '연습장 방어 진형에도 \'내 진형에 적용\' 버튼이 생겼어요.']},
 {v:'1.19.0',date:'2026-10-14',title:'자리별 레벨 · 장수별 전투 기록 · 기기 동기화',reward:{ap:20},items:[
  '레벨이 장수가 아니라 진형의 자리(1~5번)에 붙어요. 어떤 장수를 넣어도 그 자리의 레벨로 싸워요. 진형 탭의 각 자리에 있는 Lv 버튼으로 올리거나 초기화할 수 있어요.',
  '바뀌면서 지금 진형 장수의 레벨은 그 자리의 레벨이 되고(빈 자리는 다음으로 높은 장수 레벨), 나머지 장수에 쓴 금은 모두 돌려받았어요.',
  '진형의 각 자리에 ✕ 버튼이 생겨 바로 빈칸으로 만들 수 있어요.',
  '전투 결과의 막대그래프에서 장수 이름을 누르면 그 장수의 전투 기록(일반 공격 피해 · 전법 피해 · 경감한 피해 등)을 볼 수 있어요.',
  '다른 기기(또는 다른 탭)에서 더 최근에 저장한 기록이 있으면 덮어쓰지 않고 어느 기록을 쓸지 물어봐요. 앱으로 돌아오면 최신 기록을 확인하고, 화면을 닫을 때 바로 저장해요. 오른쪽 위에 마지막 저장 시각이 보여요.']},
 {v:'1.18.0',date:'2026-10-14',title:'인연 효과가 진형 전원에게',reward:{ap:20},items:[
  '인연이 발동하면 이제 인연에 속한 장수뿐 아니라 진형의 모든 장수가 효과를 받아요.',
  '모두가 받게 된 만큼 인연 수치는 이전의 40%로 조정했어요. 진형 전체가 받는 효과의 총합은 이전과 비슷해요(예: 도원결의 공격·체력 +15% → +6%, 진형 5명 모두).',
  '인연 목록과 조건, 타국 인연 2배, 오호대장군 4명 강화 등 다른 규칙은 그대로예요.']},
 {v:'1.17.1',date:'2026-10-14',title:'치명 표시와 상한',reward:{ap:20},items:[

  '치명 피해의 최대치를 300%로 정했어요(기본 150%에 보물·도감의 치명 피해가 그대로 더해져요).',
  '도움말의 치명 · 치명 피해 설명을 예시와 함께 더 쉽게 고쳤어요.']},
 {v:'1.17.0',date:'2026-10-13',title:'군령 → 나팔 · 출정 규칙 · 새 ★3 장수',reward:{ap:30},items:[
  '\'군령\'의 이름이 \'나팔(角)\'로 바뀌었어요. 가지고 있던 수량은 그대로예요.',
  '나팔은 3분마다 1개씩 차고, 최대치는 12시간 동안 모이는 240개로 늘었어요(이전 5분 · 120개).',
  '스테이지 도전은 나팔 3개를 쓰고, 지면 돌려받아요. 이겼을 때 3개를 돌려받던 규칙은 없어졌어요(이긴 경우 실제 사용량은 이전과 같은 3개).',
  '소탕도 1회에 나팔 3개예요(이전 6개). 하루에 할 수 있는 소탕이 약 3배로 늘어난 만큼, 반복(소탕) 보상은 30%로 줄여 하루에 모이는 총량을 이전과 비슷하게 맞췄어요. 첫 승리 보상은 그대로예요.',
  '★3 장수 문빙(위 보병) · 엄안(촉 궁병) · 한당(오 기병)이 추가됐어요. 새 인연: 촉의 노장(엄안·황충), 파군의 의리(엄안·장비), 귀순한 충신(문빙·조조), 강하 공방(문빙·감녕, 타국). 강동의 노장에 한당이 들어가 4명 전원이면 효과가 커져요.']},
 {v:'1.16.0',date:'2026-10-13',title:'중복 환불 조정 · 출정 화면 · 쿠폰함',reward:{ap:20},items:[
  '돌파를 다 채운 장수가 다시 나오면 나팔 대신 금을 드려요(★3 200 · ★4 300 · ★5 1,000). 나팔 환불이 소탕과 맞물려 군량이 끝없이 불어나는 문제가 있었어요.',
  '출정 화면에서 지금 진행 중인 장이 맨 위에 오고, 평정한 장은 높은 단계부터 보여요. 맨 위의 \'최근 평정\' 버튼으로 바로 소탕할 수 있어요.',
  '화면 위 券 버튼에서 쿠폰 목록(이름 · 보상 · 기한)을 보고 바로 받을 수 있어요.']},
 {v:'1.15.0',date:'2026-10-13',title:'★3 한계돌파 · 의용군 · 레벨 50',reward:{ap:20},items:[
  '한계돌파: ★3 장수는 5단계 뒤에도 중복으로 6~10단계(✦)까지 오르고, 단계마다 능력치 +6%예요. 10단계 ★3은 5단계 ★4보다 강해질 수 있어요.',
  '의용군: 진형에 ★3 장수가 1·2·3명 이상이면 그 ★3 장수들의 공격·체력이 +5% · +10% · +15%.',
  '★3이 들어간 인연 9종 추가: 자오곡의 계책, 서량의 마씨, 형주 수비대, 합비 방어전, 칠군 수몰, 강동의 노장, 반하의 일기토, 여포군의 두 장수, 원술의 대장.',
  '장수 레벨 상한이 40에서 50으로 올랐어요. 연습장과 레이드 적도 Lv 50이에요.',
  '전투 결과의 전투 기록에 \'받은 피해\' 탭이 생겼고, MVP 카드에 받은 피해와 남은 체력이 표시돼요.']},
 {v:'1.14.0',date:'2026-10-13',title:'레이드 보스 · 보물 도감 · 연습장',reward:{ap:20},items:[
  '레이드: 결투장 탭 → 레이드. 3일마다 새 적 3명(Lv40 · 돌파 5 · 보물 +50, 체력 20배)이 나타나요. 내 진형으로 10턴 싸워 준 피해가 모두의 게이지에 쌓이고, 하루 3회 도전할 수 있어요.',
  '레이드 보상: 게이지 25%(군량 3,000) · 50%(보물 획득권 10) · 75%(금 30,000) · 100%(보물 획득권 30). 그 회차에 1번 이상 도전한 군주 모두가 받고, 기여 1~3위는 회차가 끝난 뒤 추가 보상을 받아요. 보상은 다음 회차가 끝날 때까지 받을 수 있어요.',
  '보물 도감: 보물마다 +0(보유)·+10·+25·+50에 처음 도달하면 영구 등록되고 모든 장수가 강해져요. 판매해도 등록은 남아요. 세트 16종을 완성하면 추가 효과. 결투장에도 적용돼요. 지금 가진 보물은 자동으로 등록됐어요.',
  '연습장: 결투장 탭 → 연습장. 모든 장수와 보물로 공격덱·NPC 방어덱을 3개씩 따로 저장하고, 전투 보기와 100판 승률로 조합을 시험할 수 있어요. 공격덱의 \'내 진형에 적용\'을 누르면 보유한 장수와 보물을 같은 배치로 내 진형에 옮겨요.',
  '속도가 같은 장수끼리는 이제 매 턴 무작위로 행동 순서를 정해요(이전에는 항상 공격 쪽이 먼저).']},
 {v:'1.13.0',date:'2026-10-13',title:'새 장수 초선·손견·축융 · 쿠폰 · 금화 룰렛',reward:{ap:20},items:[
  '새 장수: ★5 초선(군웅 책사, 미인계), ★5 손견(오 보병, 강동의 호랑이), ★4 축융(군웅 궁병, 비도).',
  '새 인연: 연환지계(초선·여포·동탁), 강동의 손씨(손견·손책·손권), 양인의 결전(손견·화웅, 타국 인연).',
  '진형에 ★5 장수는 2명까지 넣을 수 있어요. 이전 진형에 3명 이상이었다면 앞에서부터 2명만 남아요. 결투장 상대 진형에도 똑같이 적용돼요.',
  '오호대장군의 강화 효과가 5명 전원에서 4명 이상으로 바뀌었어요(★5 제한 때문에 5명 전원을 넣을 수 없어서).',
  '공지(告) 창에서 쿠폰 번호를 입력해 보상을 받을 수 있어요. 쿠폰은 계정마다 한 번씩 쓸 수 있어요.',
  '등용 탭에 금화 룰렛이 생겼어요. 금 1,000으로 돌려 군량 150~5,000을 받고, 하루 20회까지 돌릴 수 있어요.']},
 {v:'1.12.0',date:'2026-10-13',title:'보물 100종 · 3칸 장착 · 보물 돌파',reward:{ap:20,itk:100},items:[
  '보물이 17종에서 100종으로 늘었어요. 방어구(투구·방패), 명마, 장신구(옥새·호부·군기·부채) 등 종류도 다섯 가지가 됐어요.',
  '장수마다 보물을 3개까지 장착할 수 있어요. 명마는 한 장수에게 1개만 장착돼요.',
  '보물 돌파: 같은 보물이 또 나오면 돌파 +1, 최대 +50. 1단계마다 그 보물의 모든 효과 +3%, +50이면 2.5배예요. 금으로 정련해서 올릴 수도 있어요.',
  '새 특수 효과: 치명 확률·치명 피해·흡혈·피해 감소·전법 피해. 일부 보물은 특정 병종이 장착하면 추가 효과가 있어요.',
  '같은 보물을 여러 개 갖고 있었다면 하나로 합쳐지고, 합친 개수만큼 돌파가 올라요. 여러 장수가 같은 보물을 끼고 있었다면 한 장수에게만 남아요.',
  '업데이트 기념으로 보물 획득권 100장을 드려요(보물 100회). 이 공지에서 받아 가세요.']},
 {v:'1.11.0',date:'2026-10-13',title:'궁병의 기병 견제 · 타국 인연 강화',reward:{ap:20},items:[
  '궁병이 기병에게 주는 피해가 +25%에서 +50%로 올랐고, 기병이 궁병에게 주는 피해는 -25%예요. 궁병의 일반 공격은 기병을 먼저 노려요.',
  '기병은 2번째 행동마다 전법을 쓰는 만큼 전법 위력이 75%로 적용돼요.',
  '서로 다른 진영 장수로 이루어진 타국 인연은 효과가 2배예요. 화용도의 의리, 적벽 동맹, 손유 동맹, 백문루의 인연 등 타국 인연 9종을 새로 추가했어요(전체 29종).',
  '촉 진영 보너스를 체력 +10/16/24%로 조정했어요(이전 +12/22/35%).',
  '연합군 보너스 추가: ★3 이상 장수의 나라가 3개국이면 ★3 이상 전원 공격·체력·방어 +5%, 4개국이면 +8%예요. 진형 화면에서 효과를, 도감 인연 탭에서 표를 볼 수 있어요.',
  '돌파 5단계가 끝난 ★4·★5 장수가 다시 나오면 나팔 30개로 돌려드려요(★3은 금 200).']},
 {v:'1.10.0',date:'2026-10-13',title:'새 장수 등애·서성 · 병종별 전법 주기',reward:{ap:20},items:[
  '위에 ★5 보병 등애가 합류했어요. 전법 음평의 결의는 2턴 동안 적의 단일 공격을 자신에게 끌어오는 도발과 방어 강화, 기습 공격을 함께 해요.',
  '오에 ★4 보병 서성이 합류했어요. 전법 의성의 계로 적 전체의 공격력을 낮추고 자신의 방어를 올려요.',
  '새 인연: 발탁의 은혜(사마의·등애), 건업의 수호(손권·서성).',
  '전법 발동 주기가 병종마다 달라졌어요. 기병은 2번째, 보병과 궁병은 3번째, 책사는 4번째 행동마다 전법을 써요.',
  '장수의 돌파 단계가 ◆◇로 표시돼요. 무장 목록, 장수 정보, 진형, 다른 군주 진형에서 볼 수 있어요.',
  '화면 위쪽 ? 버튼으로 능력치, 성장, 전투 규칙, 진형 효과를 설명하는 도움말을 볼 수 있어요.']},
 {v:'1.9.1',date:'2026-10-13',title:'군웅 진영 보너스 강화',items:['★3 장수가 많은 군웅 진영 보너스를 올렸어요. 3·4·5명일 때 방어 +15/25/35%, 공격 +5/10/14%, 체력 +5/10/14%예요.','군웅 진영 보너스가 발동하면 ★3 군웅 장수는 공격과 체력을 3명 +2%, 4명 +4%, 5명 +6% 더 받아요.']},
 {v:'1.9.0',date:'2026-10-13',title:'전투 기록 · 결과 공유 · 보물 잠금',reward:{ap:20},items:[
  '전투가 끝나면 장수별 피해량, 공격 횟수, 회당 피해를 막대그래프로 볼 수 있어요. 아군·적군을 바꿔 볼 수 있고, MVP 장수의 능력치와 전투 기록도 보여줘요.',
  '결투와 연습전이 끝나면 결과를 링크나 이미지로 공유할 수 있어요. 링크를 받은 사람은 같은 전투를 다시 재생해 볼 수 있어요.',
  '결투장 순위의 군주마다 연습 버튼이 생겼어요. 도전 횟수를 쓰지 않고 그 군주의 방어 진형과 겨뤄 볼 수 있어요.',
  '관우의 병과를 보병에서 기병으로 바꿨어요.',
  '보물에 잠금 기능을 추가했어요. 무장 탭의 보물 목록에서 잠기지 않은 보물을 등급별로 골라 한 번에 판매할 수 있어요.',
  '장수 정보에서 슬라이드바로 목표 레벨을 골라 한 번에 올릴 수 있어요. 레벨 초기화를 하면 Lv 1로 돌아가고 쓴 금을 모두 돌려받아요.',
  '무장 탭에서 등급·병종·나라로 장수를 거르고, 등급순·레벨순·보유 인연수·전투력순으로 정렬할 수 있어요.']},
 {v:'1.8.1',date:'2026-10-13',title:'전법 이름 표시 오류 수정',items:['관우, 조운, 하후연 등 여러 번 공격하는 전법의 이름이 숫자로 보이던 문제를 고쳤어요. 전법 효과는 그대로예요.']},
 {v:'1.8.0',date:'2026-10-13',title:'장수별 고유 전법 · 진영 보너스 · 인연',reward:{ap:20},items:[
  '장수 44명 모두에게 연의의 일화를 딴 고유 전법이 생겼어요. 관우 오관참장, 조운 칠진칠출, 장비 장판교 일갈, 제갈량 팔진도, 황개 고육계 등 피해·회복·강화·약화·기절·화상 효과가 다양해요.',
  '같은 진영(★3 이상) 장수를 3·4·5명 넣으면 진영 보너스를 받아요. 위는 공격, 촉은 체력, 오는 공격과 속도, 군웅은 방어와 공격이 올라요.',
  '도원결의, 오호대장군, 와룡봉추, 단금지교 등 인연 18종이 생겼어요. 진형 탭에서 발동 중인 효과와 1명만 더 있으면 발동하는 인연을 볼 수 있어요.',
  '도감에 인연 탭을 추가했어요. 장수 정보에서도 그 장수의 전법 설명과 인연을 볼 수 있어요.']},
 {v:'1.7.0',date:'2026-10-13',title:'결투장 일일 정산과 장수 사용률',reward:{ap:20},items:[
  '대전 탭 이름을 결투장으로 바꿨어요. 순위는 매일 자정까지의 결투로 정해지고, 다음 날 오전 9시에 정산 보상을 받아요.',
  '정산 보상(군량): 1위 1,620(장수 10회 + 보물 10회 등용분), 2위 900(장수 10회), 3위 720(보물 10회), 그 외 참여자 300(장수 3회). 그날 한 번 이상 도전해야 순위에 올라요.',
  '결투장의 일자별 순위 탭에서 최근 10일의 순위와 보상을 볼 수 있어요.',
  '장수 정보와 도감에서 그 장수를 진형에 넣은 군주의 비율(사용률)을 볼 수 있어요.']},
 {v:'1.6.0',date:'2026-10-13',title:'60개 스테이지와 소탕 · 구글 연동',reward:{ap:30},items:[
  '스테이지를 12장 60개로 늘렸어요. 황건적의 난부터 오장원까지 이어지고, 적의 전체 난이도는 이전의 70% 수준으로 낮췄어요.',
  '이미 깬 스테이지는 소탕할 수 있어요. 가진 나팔 안에서 횟수를 골라 전투 없이 반복 보상을 한 번에 받아요(1회 나팔 6개).',
  '스테이지 수가 늘어난 만큼 보상과 시간당 생산량이 단계마다 조금씩, 더 오래 늘어나도록 조정했어요. 지금까지의 진척 숫자는 그대로 유지돼요.',
  '게스트로 시작한 기록을 구글 계정에 연동할 수 있어요. 대전 탭의 내 정보에서 연동하면 기록이 그대로 유지돼요.']},
 {v:'1.5.0',date:'2026-10-13',title:'출석 보상과 공지 기능',reward:{ap:20},items:[

async function sha256hex(x){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
async function redeemCoupon(raw){

  let h;try{h=await sha256hex('cc:'+code)}catch(e){return {err:'이 브라우저에서는 쿠폰을 확인할 수 없어요'}}
  if(S.cpn.includes(h))return {err:'이미 사용한 쿠폰이에요'};
  let cp=COUPONS[h];
  if(!cp&&typeof FS!=='undefined'&&FS&&MODE==='shared'){
    try{const d=await FS.collection('coupons').doc(code).get();
      if(d.exists){const v=d.data()||{},n=(k,mx)=>Math.max(0,Math.min(mx,Math.floor(Number(v[k])||0)));cp={t:String(v.title||'쿠폰').slice(0,40),r:{food:n('food',100000),gold:n('gold',1000000),ap:n('ap',500),itk:n('itk',500),gtk:n('gtk',100),isk:n('isk',100),gpk:n('gpk',500),xtk:n('xtk',10)},until:String(v.until||'')}}}
    catch(e){return {err:'쿠폰을 확인하지 못했어요. 잠시 후 다시 시도해 주세요'}}}
  if(!cp)return {err:'없는 쿠폰 번호예요'};
  if(cp.until&&kstDay()>cp.until)return {err:`기간이 끝난 쿠폰이에요 (${cp.until}까지)`};
  if(S.cpn.includes(h))return {err:'이미 사용한 쿠폰이에요'};
  const r=cp.r;tickAP();S.ap+=r.ap||0;S.food+=r.food||0;S.gold+=r.gold||0;S.itk=(S.itk||0)+(r.itk||0);S.gtk=(S.gtk||0)+(r.gtk||0);S.isk=(S.isk||0)+(r.isk||0);S.gpk=(S.gpk||0)+(r.gpk||0);S.xtk=(S.xtk||0)+(r.xtk||0);S.cpn.push(h);save();renderTop();renderView();
  return {ok:`${cp.t} · ${rewardText(r)}`};
}

const DUEL_REWARD=[1620,900,720], DUEL_REWARD_REST=300, DUEL_KEEP_DAYS=10, DUEL_SETTLE_HOUR=9, DUEL_START='2026-10-13';
const DAY_MS=864e5;
const dayStart=d=>Date.parse(d+'T00:00:00+09:00');
const dayOf=ms=>new Date(ms+9*3600e3).toISOString().slice(0,10);
const settleAt=d=>dayStart(d)+DAY_MS+DUEL_SETTLE_HOUR*3600e3;
const pastDays=n=>Array.from({length:n},(_,i)=>dayOf(Date.now()-(i+1)*DAY_MS));
const duelReward=rank=>rank<=3?DUEL_REWARD[rank-1]:DUEL_REWARD_REST;
const validBattle=b=>b&&typeof b.att==='string'&&typeof b.def==='string'&&typeof b.win==='boolean'&&Number.isFinite(Number(b.at));
function rankDay(bs){
  const m={};const g=id=>m[id]||(m[id]={id,aw:0,al:0,dw:0,dl:0});
  for(const b of bs){if(b.win){g(b.att).aw++;g(b.def).dl++}else{g(b.att).al++;g(b.def).dw++}}
  return Object.values(m).filter(r=>r.aw+r.al>0).map(r=>({...r,score:r.aw*3+r.dw})).sort((a,b)=>b.score-a.score||b.aw-a.aw||(a.aw+a.al)-(b.aw+b.al)||(a.id<b.id?-1:1));
}
function cleanDaily(d){
  const rank=(Array.isArray(d&&d.rank)?d.rank:[]).filter(r=>r&&typeof r.id==='string').slice(0,200).map(r=>({id:r.id,name:cleanName(r.name),score:r.score|0,aw:r.aw|0,al:r.al|0,dw:r.dw|0,dl:r.dl|0}));
  return {day:String(d&&d.day||''),rank,final:true};
}
const DAILY={};
async function loadDaily(d){
  if(DAILY[d])return DAILY[d];
  const ref=FS.collection('daily').doc(d);
  const snap=await ref.get();
  if(snap.exists)return DAILY[d]=cleanDaily(snap.data());
  const q=await FS.collection('battles').where('at','>=',dayStart(d)).where('at','<',dayStart(d)+DAY_MS).limit(1000).get();
  const rank=rankDay(q.docs.map(x=>x.data()).filter(validBattle)).map(r=>{const p=PLAYERS.find(x=>x.id===r.id);return {...r,name:r.id===UID?MYNAME:(p&&p.name)||''}});
  const final=Date.now()>=settleAt(d), v={day:d,rank,final};
  if(final){
    if(rank.length){try{await ref.set({day:d,at:dayStart(d),final:true,rank})}catch(e){try{const s2=await ref.get();if(s2.exists)return DAILY[d]=cleanDaily(s2.data())}catch(_){}}}
    DAILY[d]=v;
  }
  return v;
}
let PENDING=[], settleBusy=false, nextSettleCheck=0;
async function checkSettlement(){
  if(MODE!=='shared'||!FS||settleBusy||!S)return;settleBusy=true;
  try{
    const days=pastDays(DUEL_KEEP_DAYS).filter(d=>d>=DUEL_START&&Date.now()>=settleAt(d)&&!S.duel.done.includes(d)&&!PENDING.some(p=>p.d===d)).reverse();
    for(const d of days){
      const v=await loadDaily(d), i=v.rank.findIndex(r=>r.id===UID);
      if(i<0){S.duel.done.push(d);continue}
      PENDING.push({d,rank:i+1,total:v.rank.length,reward:duelReward(i+1)});
    }
    S.duel.done=S.duel.done.slice(-30);save();updateDot();
    if(PENDING.length&&$('#sheet').hidden&&$('#battle').hidden)openDuelRewards();
    pruneOld();
  }catch(e){}
  settleBusy=false;
}

   획득권을 먼저 쓰고, 모자란 횟수는 군량(10회 묶음은 할인가)으로. 10회마다 ★4 이상 보장.
   천장: 장수 등용·보물 획득을 각각 누적 100회마다 선택권 1장(★5가 나와도 초기화되지 않아요). */
const PITY_N=100, BULK_MAX=300;
const PK={g:{c:GCOST,tk:'gpk',sel:'gtk',tn:'장수 등용권',sn:'장수 선택권',w:'등용'},i:{c:ICOST,tk:'itk',sel:'isk',tn:'보물 획득권',sn:'보물 선택권',w:'획득'}};
function pullCost(kind,n,noTk){const P=PK[kind],t=noTk?0:Math.min(S[P.tk]||0,n),m=n-t;return {t,food:Math.floor(m/10)*P.c[10]+(m%10)*P.c[1]}}
const canPull=(kind,n,noTk)=>pullCost(kind,n,noTk).food<=S.food;
function pullMax(kind){let n=0;while(n<BULK_MAX&&canPull(kind,n+1))n++;return n}
function costHtml(kind,n,noTk){const c=pullCost(kind,n,noTk);return [c.t?`<b class="sl gold">券</b>${fmt(c.t)}`:'',c.food?`<b class="sl food">糧</b>${fmt(c.food)}`:''].filter(Boolean).join(' ')||'—'}
function pullBtns(kind){const P=PK[kind],pc=(S.pity&&S.pity[kind])||0,mx=pullMax(kind);
  // v3.4.2: 획득권이 1~9장이면 획득권만 쓰는 버튼과 군량 10회(할인가) 버튼을 나눠요
  const tk=S[P.tk]||0, split=tk>0&&tk<10;
  return `<div class="row" style="flex-wrap:wrap"><button type="button" class="btn ghost" data-pull="${kind}1" ${canPull(kind,1)?'':'disabled'}>1회 ${costHtml(kind,1)}</button>${split&&tk>1?`<button type="button" class="btn ghost" data-pull="${kind}${tk}">${P.tn.split(' ')[1]} ${tk}회 ${costHtml(kind,tk)}</button>`:''}<button type="button" class="btn" data-pull="${kind}10${split?'f':''}" ${canPull(kind,10,split)?'':'disabled'}>10회 ${costHtml(kind,10,split)}</button><button type="button" class="btn ghost" data-mass="${kind}" ${mx>=10?'':'disabled'}>대량</button></div>
   <div class="pity"><span>천장 <b class="num">${pc}</b>/${PITY_N}</span><div class="bar"><i style="width:${pc/PITY_N*100}%;background:var(--bronze)"></i></div><span>${PITY_N}회마다 ${P.sn}</span></div>`}
let bulkN={g:10,i:10};
function openMass(kind){
  const P=PK[kind],mx=pullMax(kind),tk=S[P.tk]||0;
  const m10=Math.floor(mx/10)*10,tk10=Math.floor(Math.min(tk,mx)/10)*10;if(m10<10){toast('10회분 군량이 부족해요');return}
  // v3.6.2: 대량 소환은 10회 단위로만
  const n=Math.max(10,Math.min(m10,Math.floor((bulkN[kind]||10)/10)*10));bulkN[kind]=n;
  const quick=[10,30,50,100,300].filter(v=>v<m10);
  openSheet(`<div class="sheet-h"><h2 style="margin:0">대량 ${kind==='g'?'등용':'획득'}</h2><button class="x" type="button" data-close aria-label="닫기">✕</button></div>
   <p class="sub" style="margin:0 0 10px">${P.tn} ${fmt(tk)}장을 먼저 쓰고, 모자란 횟수는 군량으로 뽑아요(10회 묶음은 ${fmt(P.c[10])}). 10회 단위로 뽑고, 10회마다 ★4 이상 보장, 한 번에 최대 ${BULK_MAX}회.</p>
   <div class="stat" style="text-align:center;margin:0 0 10px"><b class="num" id="bk-n" style="font-size:28px">${n}</b><span style="font-size:14px">회</span><div class="sub" style="margin:4px 0 0" id="bk-c">${costHtml(kind,n)}</div></div>
   <input type="range" id="bk-r" min="10" max="${m10}" step="10" value="${n}" style="width:100%" aria-label="뽑을 횟수">
   <div class="chips" role="group" aria-label="빠른 선택" style="margin:8px 0">${quick.map(v=>`<button type="button" data-bkq="${v}">${v}회</button>`).join('')}<button type="button" data-bkq="${m10}">최대 ${m10}회</button>${tk10>=10?`<button type="button" data-bkq="${tk10}">${P.tn.slice(0,2)}권 모두 (${tk10}회)</button>`:''}</div>
   <button type="button" class="btn red wide" id="bk-go">${n}회 뽑기</button>`);
  const r=$('#bk-r'),upd=v=>{v=Math.max(10,Math.min(m10,Math.floor((v|0)/10)*10));bulkN[kind]=v;r.value=v;$('#bk-n').textContent=v;$('#bk-c').innerHTML=costHtml(kind,v);$('#bk-go').textContent=v+'회 뽑기'};
  r.oninput=()=>upd(+r.value);
  document.querySelectorAll('[data-bkq]').forEach(b=>b.onclick=()=>upd(+b.dataset.bkq));
  $('#bk-go').onclick=()=>doPull(kind,bulkN[kind]);
}
function doPull(kind,n,noTk){
  const P=PK[kind];if(!(n>=1)||n>BULK_MAX)return;const c=pullCost(kind,n,noTk);if(c.food>S.food){toast('군량이 부족해요');return}
  S[P.tk]=(S[P.tk]||0)-c.t;S.food-=c.food;
  const out=[];
  for(let i=0;i<n;i++){
    let r=rollRar();
    if(i%10===9&&!out.slice(i-9).some(x=>x.rar>=4))r=4;
    if(kind==='g'){
      const g=pick(GENS.filter(x=>x.rar===r));
      const own=S.gens[g.id]; let tag='NEW';
      if(!own){S.gens[g.id]={lv:1,d:0,its:[]}}
      else if(own.d<maxD(r)){own.d++;tag=own.d>5?`한계돌파 ${own.d}`:`돌파 ${own.d}`}
      else{const gg=DUP_GOLD[r];S.gold+=gg;tag=`金 +${fmt(gg)}`}
      out.push({...g,tag,gold:tag[0]==='金'?DUP_GOLD[r]:0});
    } else {
      const it=pick(ITEMS.filter(x=>x.rar===r)), own=S.items.find(x=>x.k===it.id);let tag;
      if(!own){S.items.push({u:'i'+(S.seq++),k:it.id,d:0,n:0,g:0});tag='NEW · '+ITYPE[it.g]}
      else if(own.d<ITEM_MAXD){own.d++;own.n=(own.n||0)+1;tag=`돌파 +${own.d}`}
      else{const gg=ITEM_OVER[r];S.gold+=gg;tag=`金 +${gg}`}
      out.push({...it,tag,gold:tag[0]==='金'?ITEM_OVER[r]:0});
    }
  }
  S.pity=S.pity||{g:0,i:0};const pv=(S.pity[kind]||0)+n,got=Math.floor(pv/PITY_N);S.pity[kind]=pv%PITY_N;
  if(got)S[P.sel]=Math.min(999,(S[P.sel]||0)+got);
  const colNew=kind==='i'?colSync():[];save();renderTop();renderView();colToast(colNew);
  const show=()=>openPullResult(kind,out,got,noTk);
  if(out.some(x=>x.rar===5)&&!btStill())r5Fx(kind,show);else show();
}
const pullCard=(kind,x,i,big)=>`<div class="rv${x.rar===5?' x5':''}" style="animation-delay:${Math.min(i,20)*70}ms">${x.rar===5?'<i class="spk"></i><i class="spk"></i><i class="spk"></i>':''}${kind==='g'?seal(x):`<div class="itm r${x.rar}">${itemImg(x)}</div>`}<div class="nm">${esc(x.name)}</div><div class="stars r${x.rar}">${stars(x.rar)}</div><div class="tag">${esc(x.tag)}</div></div>`;
function openPullResult(kind,out,got,noTk){
  const P=PK[kind],n=out.length,cnt=r=>out.filter(x=>x.rar===r).length;
  const gold=out.reduce((a,x)=>a+(x.gold||0),0),nw=out.filter(x=>x.tag.startsWith('NEW')).length,up=n-nw-out.filter(x=>x.gold).length;
  const pc=S.pity[kind]||0;
  const head=`<div class="sheet-h"><h2 style="margin:0">${kind==='g'?'등용 결과':'획득한 보물'} <small class="sub" style="font-weight:400">${n}회</small></h2><button class="x" type="button" data-close aria-label="닫기">✕</button></div>
   ${got?`<div class="pity-hit" role="status">천장 달성! ${P.sn} +${got}장 · 등용 탭 위 선택권에서 써요</div>`:''}`;
  const foot=`<div class="pity" style="margin-top:12px"><span>천장 <b class="num">${pc}</b>/${PITY_N}</span><div class="bar"><i style="width:${pc/PITY_N*100}%;background:var(--bronze)"></i></div></div>
   <div class="row" style="margin-top:12px;gap:8px">${canPull(kind,n,noTk)&&n>1?`<button type="button" class="btn ghost" data-again="${kind}${n}${noTk?'f':''}">${n}회 더</button>`:''}<button type="button" class="btn ghost" style="flex:1" data-close>확인</button></div>`;
  if(n<=10){out.sort((a,b)=>b.rar-a.rar);openSheet(`${head}<div class="reveal">${out.map((x,i)=>pullCard(kind,x,i)).join('')}</div>${foot}`);return}
  // 11회 이상: ★5는 카드로, ★4·★3은 같은 것끼리 묶어서
  const grp=r=>{const m=new Map();out.filter(x=>x.rar===r).forEach(x=>{const g=m.get(x.id)||{x,c:0};g.c++;g.x=x;m.set(x.id,g)});return [...m.values()].sort((a,b)=>b.c-a.c)};
  const tiles=r=>`<div class="pgrid">${grp(r).map(({x,c})=>`<div class="pt">${kind==='g'?seal(x,'sm'):`<div class="itm r${x.rar}">${itemImg(x)}</div>`}${c>1?`<b class="cnt num">×${c}</b>`:''}<span>${esc(x.name)}</span><small>${esc(x.tag)}</small></div>`).join('')}</div>`;
  const f5=out.filter(x=>x.rar===5);
  openSheet(`${head}
   <div class="pullsum"><span class="r5">★5 <b class="num">${cnt(5)}</b></span><span class="r4">★4 <b class="num">${cnt(4)}</b></span><span class="r3">★3 <b class="num">${cnt(3)}</b></span></div>
   <p class="sub" style="margin:4px 0 10px;text-align:center">신규 ${nw} · ${kind==='g'?'돌파':'강화'} ${up}${gold?` · 金 +${fmt(gold)}`:''}</p>
   ${f5.length?`<div class="reveal">${f5.map((x,i)=>pullCard(kind,x,i)).join('')}</div>`:'<p class="sub" style="text-align:center">이번에는 ★5가 나오지 않았어요.</p>'}
   <h3 style="margin:14px 0 6px">★4 · ${cnt(4)}개</h3>${tiles(4)}
   <details class="p3"><summary>★3 · ${cnt(3)}개 보기</summary>${tiles(3)}</details>
   ${foot}`);
}
// ★5 연출: 화면이 어두워지고 금빛 섬광·빛줄기·天 도장 (업무 모드·동작 줄이기에서는 없음)
function r5Fx(kind,done){
  const el=document.createElement('div');el.className='r5fx';el.setAttribute('role','status');
  el.innerHTML=`<div class="r5-rays"></div><div class="r5-flash"></div><div class="r5-stamp">天</div><div class="r5-txt">★5 ${kind==='g'?'장수':'보물'} 등장 <small>눌러서 건너뛰기</small></div>`;
  let fin=false;const end=()=>{if(fin)return;fin=true;clearTimeout(t);el.remove();done()};
  el.addEventListener('click',end);document.body.appendChild(el);const t=setTimeout(end,1500);
}
document.addEventListener('click',e=>{
  const pa=v=>[v[0],parseInt(v.slice(1),10),v.endsWith('f')];
  const b=e.target.closest('[data-pull]');if(b&&!b.disabled){doPull(...pa(b.dataset.pull));return}
  const k=e.target.closest('[data-mass]');if(k&&!k.disabled){openMass(k.dataset.mass);return}
  const a=e.target.closest('[data-again]');if(a){closeSheet();doPull(...pa(a.dataset.again));return}
});

/* ---------------- 금화 룰렛 (v2.0.4) ----------------
   1회 금 1,000. 칸은 보상 종류 7칸, 실제 보상은 아래 표(확률 ‰)에서 뽑아요.
   가치 환산(군량 기준): 금 0.6 · 나팔 30 · 보물 획득권 80 · 장수 등용권 100 → 1회 평균 약 군량 950어치(이전 약 510). */
const RL_COST=1000, RL_DAILY=100;  // v3.5.0: 하루 20→100회
const RL_K={gold:{n:'금',w:'금',u:''},food:{n:'군량',w:'군량',u:''},ap:{n:'나팔',w:'나팔',u:'개'},itk:{n:'보물 획득권',w:'보물권',u:'장'},gpk:{n:'장수 등용권',w:'장수권',u:'장'},gtk:{n:'장수 선택권',w:'장수선택',u:'장'},isk:{n:'보물 선택권',w:'보물선택',u:'장'},xtk:{n:'보물 강화도 교환권',w:'강화교환',u:'장'}};
const RL_SEG=Object.keys(RL_K);
// v3.5.0: 확률 단위 ‱(1/10000). 보물 선택권 0.1%→0.5%, 보물 강화도 교환권 0.01% 신설 (군량 800에서 0.41%p 차감)
const RL=[['gold',2000,1200],['gold',5000,200],['food',800,2009],['food',2000,1000],['food',6000,150],['ap',10,1500],['ap',30,300],['itk',5,1500],['itk',15,300],['gpk',5,1500],['gpk',15,260],['gtk',1,30],['isk',1,50],['xtk',1,1]];
let rlRot=0, rlBusy=false;
function rlLeft(){return S.rl.day===kstDay()?Math.max(0,RL_DAILY-S.rl.n):RL_DAILY}
function rlRoll(){let r=Math.random()*10000;for(let i=0;i<RL.length;i++){r-=RL[i][2];if(r<0)return i}return 2}
const rlTxt=i=>{const[k,v]=RL[i];return `${RL_K[k].n} ${fmt(v)}${RL_K[k].u}`};
const rlPct=w=>String(+(w/100).toFixed(2))+'%';
function rouletteHtml(){
  const left=rlLeft(), seg=360/RL_SEG.length;
  const grad=RL_SEG.map((k,i)=>`${k==='gtk'||k==='isk'||k==='xtk'?'#7a2a1e':i%2?'var(--panel2)':'#2a2018'} ${i*seg}deg ${(i+1)*seg}deg`).join(',');
  return `<div class="banner-card"><div class="big">輪盤</div><h2>금화 룰렛</h2><p class="sub" style="margin:0">금 ${fmt(RL_COST)}으로 한 번 돌려 금·군량·나팔·보물 획득권·장수 등용권, 드물게 선택권을 받아요. 하루 ${RL_DAILY}회 · 오늘 남은 횟수 <b class="num" style="color:var(--fg)">${left}</b>회</p>
   <div class="wheel-wrap"><div class="wheel" id="wheel" style="background:conic-gradient(${grad});transform:rotate(${rlRot}deg)">${RL_SEG.map((k,i)=>`<span style="transform:rotate(${i*seg+seg/2}deg) translateY(-62px)">${RL_K[k].w}</span>`).join('')}</div><div class="wheel-pin" aria-hidden="true"></div><div class="wheel-hub" aria-hidden="true">金</div></div>
   <div class="rates">${RL.map(([k,v,w],i)=>`<span${w<=50?' style="color:var(--bronze)"':''}>${rlTxt(i)} · ${rlPct(w)}</span>`).join('')}</div>
   <div class="row"><button type="button" class="btn ghost" data-rl="1" ${left<1||S.gold<RL_COST?'disabled':''}>1회 <b class="sl gold">金</b>${fmt(RL_COST)}</button><button type="button" class="btn" data-rl="10" ${left<10||S.gold<RL_COST*10?'disabled':''}>10회 <b class="sl gold">金</b>${fmt(RL_COST*10)}</button></div>
   <p class="sub" style="margin:8px 0 0">매일 0시(한국 시간)에 횟수가 다시 채워져요. 받은 선택권은 등용 탭 맨 위에서 써요.</p></div>`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-rl]');if(!b||b.disabled||rlBusy)return;
  const n=+b.dataset.rl;if(rlLeft()<n){toast('오늘 룰렛 횟수가 부족해요');return}if(S.gold<RL_COST*n){toast('금이 부족해요');return}
  const d=kstDay();if(S.rl.day!==d)S.rl={day:d,n:0};
  const res=Array.from({length:n},rlRoll), sum={};
  for(const i of res){const[k,v]=RL[i];sum[k]=(sum[k]||0)+v}
  S.gold-=RL_COST*n;tickAP();for(const[k,v]of Object.entries(sum))S[k]=(S[k]||0)+v;S.rl.n+=n;save();renderTop();
  const best=res.reduce((a,i)=>RL[i][2]<RL[a][2]?i:a,res[0]), big=RL[best][2]<=300;
  const seg=360/RL_SEG.length, si=RL_SEG.indexOf(RL[best][0]);rlRot=rlRot-(rlRot%360)+360*5+(360-(si*seg+seg/2));
  rlBusy=true;document.querySelectorAll('[data-rl]').forEach(x=>x.disabled=true);
  const w=$('#wheel'), still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(w){w.classList.add('spin');w.style.transform=`rotate(${rlRot}deg)`}
  setTimeout(()=>{rlBusy=false;if(view==='gacha')renderView();
    if(n===1)toast(`룰렛 · ${rlTxt(best)}${big?' · 대박!':''}`);
    else openSheet(`<div class="sheet-h"><h2 style="margin:0">룰렛 ${n}회 결과</h2><button class="x" type="button" data-close aria-label="닫기">✕</button></div>
      <div class="chips">${res.map(i=>`<span class="chip"${RL[i][2]<=300?' style="border-color:var(--bronze);color:var(--bronze)"':''}>${rlTxt(i)}</span>`).join('')}</div>
      <h3>받은 보상</h3><div class="stats" style="grid-template-columns:1fr 1fr;margin-top:6px">${RL_SEG.filter(k=>sum[k]).map(k=>`<div class="stat"><small>${RL_K[k].n}</small><b>+${fmt(sum[k])}${RL_K[k].u}</b></div>`).join('')}<div class="stat"><small>쓴 금</small><b>-${fmt(RL_COST*n)}</b></div></div>
      <div class="row" style="margin-top:16px"><button type="button" class="btn ghost wide" data-close>확인</button></div>`);
  },w&&!still?2300:50);
});

/* ---------------- 추천 편성 ----------------
   고정한 장수(자리 그대로)와 고정한 보물은 두고, 남은 자리와 보물 칸을 추천으로 채워요.
   1) 장수: 진영·연합군·인연 효과까지 넣은 진형 점수가 가장 높은 조합을 찾아요(여러 출발점 + 한 명씩 바꿔 보기)
   2) 보물: 좋은 보물부터, 진형 점수가 가장 많이 오르는 장수에게 끼워요(명마는 1개까지)
   3) 자리: 병종(보병·기병 앞, 궁병·책사 뒤)과 자리 레벨을 함께 따져 배치
   토벌전용은 후보 진형들을 이번 토벌전 보스와 실제로 싸워 보고 평균 피해가 가장 큰 진형을 골라요. */
const REC_W={inf:{a:1.2,h:1.3,d:1.5,s:.35},cav:{a:1.7,h:1,d:1,s:.5},arc:{a:1.7,h:.9,d:.9,s:.35},tac:{a:1.6,h:.9,d:.9,s:.45}};
function recUnitScore(u){const w=REC_W[u.cls]||REC_W.inf;return (atkE(u)*1.5*w.a+u.maxhp/6*w.h+u.def*1.2*w.d+u.spd*3)*(1+((u.cr||.1)-.1)*.6+((u.cd||1.5)-1.5)*.2+(u.ls||0)*.6+(u.dr||0)+(u.skp||0)*w.s)}

const itemU=u=>S.items.find(x=>x.u===u);
function recSpec(g,lv,uids,cb){return {g,lv,d:S.gens[g].d,i:(uids||[]).map(itemU).filter(Boolean).map(x=>x.k+':'+(x.d||0)),cb}}
let recLock={g:new Set(),i:new Set()}, recMode='duel', recPlan=null;
function recLocked(){
  return S.deck.map((g,i)=>g&&recLock.g.has(i)?{slot:i,g,its:S.gens[g].its.filter(u=>recLock.i.has(u)&&itemU(u))}:null).filter(Boolean);

// 1) 장수 고르기 (아이템 없이, 같은 레벨로 비교)
function recPickGens(locked,lv,cb,filt){
  const lockedG=new Set(locked.map(x=>x.g)), free=NSLOT-locked.length;
  const n5L=locked.filter(x=>GMAP[x.g].rar===5).length;
  const lockedSpecs=locked.map(x=>recSpec(x.g,lv,x.its,cb));
  const indiv={};Object.keys(S.gens).forEach(g=>indiv[g]=recUnitScore(mkUnit(recSpec(g,lv,[],cb),0,0)));
  let pool=Object.keys(S.gens).filter(g=>!lockedG.has(g)&&(!filt||filt(g))).sort((a,b)=>indiv[b]-indiv[a]);
  // 후보를 줄이되, 인연 상대는 남겨 둬요
  const keep=new Set(pool.slice(0,30));
  BONDS.forEach(B=>{const m=B.ids.filter(x=>S.gens[x]&&!lockedG.has(x)&&(!filt||filt(x)));if(m.some(x=>keep.has(x)))m.forEach(x=>keep.add(x))});
  pool=pool.filter(g=>keep.has(g));
  if(free<=0)return [[]];
  const ok=set=>set.filter(g=>GMAP[g].rar===5).length+n5L<=MAX5;
  const score=set=>recScore([...lockedSpecs,...set.map(g=>recSpec(g,lv,[],cb))]);
  const fill=base=>{const s=base.slice();for(const g of pool){if(s.length>=free)break;if(s.includes(g))continue;s.push(g);if(!ok(s))s.pop()}return s};
  const seeds=[fill([])];
  BONDS.forEach(B=>{const m=B.ids.filter(x=>S.gens[x]&&!lockedG.has(x)&&(!filt||filt(x))).sort((a,b)=>indiv[b]-indiv[a]);
    const inLock=B.ids.filter(x=>lockedG.has(x)).length, need=(B.fullMin||B.min||B.ids.length)-inLock;
    if(need<=0||m.length<Math.min(need,(B.min||B.ids.length)-inLock))return;
    const take=m.slice(0,Math.min(free,Math.max(need,(B.min||B.ids.length)-inLock)));if(take.length>free||!ok(take))return;seeds.push(fill(take))});
  Object.keys(FAC_BONUS).forEach(f=>{const m=pool.filter(g=>GMAP[g].fac===f);[3,4,5].forEach(n=>{if(n>free||m.length<n)return;let n5=0;const t=m.filter(g=>!(GMAP[g].rar===5&&++n5+n5L>MAX5)).slice(0,n);if(t.length===n)seeds.push(fill(t))})});
  const seen=new Set(), outs=[];
  for(const s0 of seeds){
    let s=s0.slice(), best=score(s);
    for(let it=0;it<8;it++){
      let mv=null;
      for(let p=0;p<s.length;p++)for(const c of pool){if(s.includes(c))continue;const t=s.slice();t[p]=c;if(!ok(t))continue;const v=score(t);if(v>best+1e-6){best=v;mv=t}}
      if(s.length<free)for(const c of pool){if(s.includes(c))continue;const t=[...s,c];if(!ok(t))continue;const v=score(t);if(v>best+1e-6){best=v;mv=t}}
      if(!mv)break;s=mv;
    }
    const key=s.slice().sort().join(',');if(seen.has(key))continue;seen.add(key);outs.push({set:s,score:best});
  }
  return outs.sort((a,b)=>b.score-a.score);

    box.addEventListener('click',e=>{
      const b=e.target.closest('[data-rsu]');if(b){showUnit(b.dataset.rsu);return}
      const it=e.target.closest('[data-rsi]');if(it){const[k,j]=it.dataset.rsi.split(':'),u=unitByKey(res,k),x=u&&u.items[+j];if(x&&IMAP[x.k]&&BT_HIDE_SIDE!==u.side&&BT_HIDE_SIDE!==2)openInfoPop(itemInfoHtml(IMAP[x.k],x.d||0,u));return}
      const sk=e.target.closest('[data-rssk]');if(sk){const u=unitByKey(res,sk.dataset.rssk);if(u)openInfoPop(skillInfoHtml(u))}
    });
    $('#rs-tg').onclick=()=>{rsOpen=!rsOpen;$('#rs-body').hidden=!rsOpen;$('#rs-tg').setAttribute('aria-expanded',String(rsOpen))};
    if(sh&&CAN_SHARE){$('#sh-link').onclick=()=>shareLink(sh,res.win);$('#sh-img').onclick=async()=>{const c=$('#res-card');c.classList.add('cap');try{await shareImage(c,sh)}finally{c.classList.remove('cap')}}}
    $('#bt-close').onclick=()=>{el.hidden=true;el.innerHTML='';if(rp){history.replaceState(null,'',location.pathname+location.search);if(typeof showLogin==='function'&&!S&&MODE!=='local')showLogin()}renderTop();renderView()};
    $('#bt-close').focus({preventScroll:true});
    // 첫 화면은 아래쪽(도장·요약·보상·확인)부터 보여 줘요 (v3.3.0)
    const toMain=()=>{const m=box.querySelector('.res-main');if(!m)return;box.scrollTop=Math.min(box.scrollHeight-box.clientHeight,Math.max(0,m.offsetTop-12))};toMain();requestAnimationFrame(toMain);
    if(!btStill())box.querySelectorAll('.res-main .coin').forEach(c=>{const tn=[...c.childNodes].reverse().find(n=>n.nodeType===3&&/\d/.test(n.nodeValue));if(!tn)return;const m=tn.nodeValue.match(/^(\D*)([\d,]+)(.*)$/);if(!m)return;const to=+m[2].replace(/,/g,'');if(!(to>0))return;
      const t0=performance.now(),D=700,f=t=>{const p=Math.min(1,(t-t0)/D);tn.nodeValue=m[1]+fmt(to*(1-Math.pow(1-p,3)))+m[3];if(p<1&&tn.isConnected)requestAnimationFrame(f)};tn.nodeValue=m[1]+'0'+m[3];requestAnimationFrame(f)});
  };
  // 마지막 일격 (v3.3.0): 0.4초 멈춘 뒤 승리는 먹 번짐, 패배는 화면 탈색
  const finale=()=>{const bt=$('.bt');if(!bt||btStill()){timer=setTimeout(finish,500);return}
    const lost=!res.win&&!(opts&&(opts.replay||opts.verdict));quake();
    timer=setTimeout(()=>{if(tok!==btToken||fin)return;const o=document.createElement('div');o.className='bt-fin '+(lost?'l':'w');o.setAttribute('aria-hidden','true');bt.appendChild(o);timer=setTimeout(finish,750)},400)};
  const cutin=e=>{const a=U(e.s,e.i),bt=$('.bt');if(!a||!bt)return false;const o=fxEl(bt,'xcut'+(fast()?' q':''),fast()?560:900,`${seal(a,'lg')}<div class="t"><small>${esc(a.name)} · 전법</small><b>${esc(e.sk)}</b></div>`);return !!o};
  let cutAt=-1;
  const step=()=>{if(tok!==btToken)return;if(idx>=res.ev.length){finale();return}const e=res.ev[idx];
    if(e.sk&&!e.tick&&!e.skip&&cutAt!==idx&&btCutin()&&!xfast()&&!btStill()&&U(e.s,e.i)&&cutin(e)){cutAt=idx;timer=setTimeout(step,fast()?480:780);return}
    idx++;apply(e,true);
    if(e.sk&&btCutin()&&!xfast()){const hs=(e.hits||[]).filter(h=>!h.self);if(hs.length>1)fxEl($('.bt'),'xcombo',1200,`<b>${hs.length} HIT</b><span>${fmt(hs.reduce((x,h)=>x+h.d,0))}</span>`)}
    timer=setTimeout(step,560/speed)};
  $('#bt-speed').onclick=()=>{speed=BT_SPD[(BT_SPD.indexOf(speed)+1)%BT_SPD.length];btSpeedSave(speed);$('#bt-speed').textContent=speed+'배속';const bt=$('.bt');if(bt){bt.classList.toggle('fast',speed>=4);bt.style.setProperty('--bd',Math.round(560/speed)+'ms')}};
  $('#bt-cut').onclick=()=>{const on=!btCutin();btCutinSave(on);$('#bt-cut').setAttribute('aria-pressed',String(on));toast(on?'전법 컷인을 켰어요':'전법 컷인을 껐어요')};
  $('#bt-graph').onclick=()=>setGraph($('#bt-gr').hidden);$('#bt-gr').onclick=()=>setGraph(false);if(btGraphOn())setGraph(true);
  $('#bt-skip').onclick=finish;
  const qb=$('#bt-quit');let qArm=0;
  if(qb)qb.onclick=()=>{if(fin)return;
    if(!qArm){qArm=1;qb.textContent='한 번 더 누르면 포기';setTimeout(()=>{if(qb.isConnected){qArm=0;qb.textContent='중도포기'}},2500);return}
    btToken++;clearTimeout(timer);el.hidden=true;el.innerHTML='';if(opts.onQuit)opts.onQuit();renderTop();renderView();toast('전투를 그만뒀어요. 도전 횟수는 그대로예요')};
  timer=setTimeout(step,500);
}

/* ---------------- sheet ---------------- */
function openSheet(html){const s=$('#sheet');s.innerHTML=`<div class="sheet-body" role="dialog" aria-modal="true">${html}</div>`;s.hidden=false;const f=s.querySelector('button');f&&f.focus({preventScroll:true})}
function closeSheet(){const s=$('#sheet');s.hidden=true;s.innerHTML=''}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'||e.target.closest('[data-close]'))closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

boot();
</script>
</body>
