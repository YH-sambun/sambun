<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1716">
<meta name="description" content="연합 삼국지 · 창천토벌 — 장수를 모으고 진형을 짜서 친구들과 겨루는 삼국지 게임">
<title>연합 삼국지 · 창천토벌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  /* Layout: phone-first command tent — bronze seals on patina lacquer, one scrolling column, tab bar at the foot */
  --bg:#0e1716; --panel:#152220; --panel2:#1c2d2a; --line:#2a3f3a;
  --fg:#ede5d1; --mute:#93a39b; --ink:#16120a;
  --bronze:#d2aa55; --bronze-d:#7d6330; --cinnabar:#d0503a; --jade:#5ab596;
  --wei:#6197d8; --shu:#5ab596; --wu:#db6a52; --qun:#ab8ed3;
  --r2:#6f7f7a; --r3:#9fb0aa; --r4:#ad90e6; --r5:#e9c66c;
  --display:"Song Myung","Nanum Myeongjo","Batang",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(210,170,85,.10),transparent 60%);}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand-hz{font-family:var(--display);font-size:22px;color:var(--bronze);letter-spacing:.04em;white-space:nowrap}
.brand-ko{font-size:11px;color:var(--mute);letter-spacing:.2em}
.res{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.coin{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-weight:700;font-variant-numeric:tabular-nums}
.sl{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-family:var(--display);font-size:13px;color:var(--ink);font-weight:400}
.sl.gold{background:var(--bronze)} .sl.food{background:var(--jade)}

.claim{margin:0 16px 8px;display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.claim .meter{flex:1;min-width:0}
.claim .lab{font-size:12px;color:var(--mute)}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--jade);border-radius:3px;transition:width .4s}
.banner{margin:0 16px 8px;font-size:12px;color:var(--mute);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}

main#view{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 24px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:var(--panel)}
.tab{background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute)}
.tab b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1}
.tab span{font-size:11px}
.tab[aria-current="true"]{color:var(--bronze)}

h2{font-family:var(--display);font-weight:400;font-size:22px;margin:8px 0 4px;text-wrap:balance}
h3{font-size:14px;margin:16px 0 8px;color:var(--mute);letter-spacing:.06em;font-weight:500}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

.btn{background:var(--bronze);color:var(--ink);font-weight:700;border:0;border-radius:8px;padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.red{background:var(--cinnabar);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:7px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* seals */
.seal{--fac:var(--qun);--rc:var(--r3);width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:24px;color:var(--ink);background:var(--fac);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--rc)}
.seal.lg{width:72px;height:72px;font-size:40px}
.seal.sm{width:34px;height:34px;font-size:18px}
.f-wei{--fac:var(--wei)} .f-shu{--fac:var(--shu)} .f-wu{--fac:var(--wu)} .f-qun{--fac:var(--qun)}
.r2{--rc:var(--r2)} .r3{--rc:var(--r3)} .r4{--rc:var(--r4)} .r5{--rc:var(--r5)}
.seal.r5{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--r5),0 0 14px rgba(233,198,108,.45)}
.stars{color:var(--rc);font-size:11px;letter-spacing:-1px}
.cls{font-family:var(--display);font-size:13px;color:var(--mute)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.gc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.gc .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gc .meta{font-size:11px;color:var(--mute);display:flex;gap:6px;align-items:center}
.gc.in-deck{border-color:var(--bronze-d)}
.chip{font-size:10px;border:1px solid var(--bronze-d);color:var(--bronze);border-radius:999px;padding:0 6px}

.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;margin:4px 0 12px}
.seg button{flex:1;background:none;border:0;border-radius:7px;padding:7px 0;color:var(--mute);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg)}

/* stage map */
.chap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.chap.locked{opacity:.5}
.chap-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.chap-h .hz{font-family:var(--display);font-size:24px;color:var(--bronze)}
.chap-h .ko{font-weight:700}
.chap-h .pg{margin-left:auto;font-size:12px;color:var(--mute)}
.nodes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;position:relative}
.node{aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-family:var(--display);font-size:18px;color:var(--mute);padding:0}
.node.done{background:var(--bronze-d);border-color:var(--bronze);color:var(--fg)}
.node.next{border-color:var(--cinnabar);color:var(--fg);box-shadow:0 0 0 4px rgba(208,80,58,.18);animation:pulse 1.8s ease-in-out infinite}
.node.boss{border-style:double;border-width:4px}
.node:disabled{cursor:not-allowed}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(208,80,58,.05)}}

/* deck */
.slot{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.slot .pos{width:40px;flex:none;text-align:center;font-family:var(--display);color:var(--bronze);font-size:15px;line-height:1.1}
.slot .pos small{display:block;font-family:var(--body);font-size:10px;color:var(--mute)}
.slot .info{flex:1;min-width:0}
.slot .info b{display:block}
.slot .info span{font-size:12px;color:var(--mute)}
.slot.empty{border-style:dashed;color:var(--mute)}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;width:30px;height:24px;font-size:12px;padding:0}
.power{font-family:var(--display);font-size:28px;color:var(--bronze);line-height:1}
.legend{font-size:12px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
.legend b{color:var(--fg);font-weight:500}

/* gacha */
.banner-card{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:12px}
.banner-card .big{font-family:var(--display);font-size:56px;line-height:1;color:var(--bronze);opacity:.16;position:absolute;right:10px;top:4px;pointer-events:none}
.banner-card h2{margin-top:0}
.rates{display:flex;gap:12px;font-size:12px;margin:6px 0 14px;flex-wrap:wrap}
.rates span{color:var(--rc)}
.reveal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:380px){.reveal{grid-template-columns:repeat(4,1fr)}}
.rv{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:11px;animation:pop .45s both;min-width:0}
.rv .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rv .tag{font-size:10px;color:var(--bronze)}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.li .info{flex:1;min-width:0}
.li .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .info span{font-size:12px;color:var(--mute)}
.li.me{border-color:var(--bronze-d)}
.rank{width:22px;text-align:center;font-family:var(--display);color:var(--bronze);font-size:18px;flex:none}
.av{width:34px;height:34px;border-radius:50%;flex:none;background:var(--panel2);object-fit:cover}
.itm{width:40px;height:40px;flex:none;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:22px;background:var(--panel2);border:1.5px solid var(--rc);color:var(--rc)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:var(--panel2);border-radius:10px;padding:8px;text-align:center}
.stat small{display:block;font-size:11px;color:var(--mute)}
.stat b{font-variant-numeric:tabular-nums}
.recbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.empty-state{text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px;padding:20px 16px;font-size:13px}
.empty-state b{display:block;font-family:var(--display);font-weight:400;font-size:28px;color:var(--bronze);margin-bottom:6px}

/* sheet */
#sheet{position:fixed;inset:0;background:rgba(4,8,8,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet-body{width:100%;max-width:540px;max-height:86%;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.sheet-h .x{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:50%;width:32px;height:32px;padding:0}

/* battle */
#battle{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bt{width:100%;max-width:540px;display:flex;flex-direction:column;padding:12px 16px;gap:12px;position:relative;
  background-image:radial-gradient(90% 40% at 50% 50%,rgba(208,80,58,.08),transparent 70%)}
.bt-head{display:flex;align-items:center;gap:8px}
.bt-title{font-family:var(--display);font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-side{font-size:11px;color:var(--mute);letter-spacing:.2em}
.bt-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bu{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;transition:opacity .3s,transform .15s}
.bu .bn{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bu .hp{width:100%;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bu .hp i{display:block;height:100%;background:var(--jade);transition:width .25s}
.bt-foe .bu .hp i{background:var(--cinnabar)}
.bu.dead{opacity:.28;filter:grayscale(1)}
.bu.act{transform:translateY(-4px);border-color:var(--bronze)}
.bt-foe .bu.act{transform:translateY(4px)}
.bu.hit{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.bu.void{visibility:hidden}
.dmg{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-weight:700;font-size:14px;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none;animation:float .8s forwards;white-space:nowrap}
.dmg.c{color:var(--r5);font-size:16px}
.dmg.h{color:var(--jade)}
@keyframes float{to{transform:translate(-50%,-26px);opacity:0}}
.bt-log{flex:1;min-height:90px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:4px}
.bt-log .sk{font-family:var(--display);font-size:26px;color:var(--bronze);min-height:1.2em}
.bt-log .ln{font-size:13px;color:var(--mute);min-height:1.4em}
.bt-res{position:absolute;inset:0;background:rgba(8,12,12,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;text-align:center}
.stamp{font-family:var(--display);font-size:64px;line-height:1;width:132px;height:132px;display:grid;place-items:center;border:4px solid currentColor;border-radius:14px;transform:rotate(-8deg);animation:stamp .35s cubic-bezier(.2,1.6,.4,1) both}
.stamp.w{color:var(--cinnabar)} .stamp.l{color:var(--mute)}
@keyframes stamp{from{transform:scale(2.2) rotate(-8deg);opacity:0}}
.rw{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}
.loading{display:grid;place-items:center;height:60%;color:var(--mute);font-family:var(--display);font-size:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.login{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:40px 4px 24px;max-width:380px;margin:0 auto}
.lg-hz{font-family:var(--display);font-size:46px;color:var(--bronze);letter-spacing:.12em;line-height:1}
input:focus-visible{outline:2px solid var(--bronze);outline-offset:1px}

.sl.ap{background:var(--cinnabar);color:#fff}
.apt{font-size:11px;color:var(--mute);font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--mute)}
.chips button[aria-pressed="true"]{border-color:var(--bronze);color:var(--bronze)}
.li.dex{text-align:left;align-items:flex-start}
.li.unown{opacity:.5}
.li.unown .seal,.li.unown .itm{filter:grayscale(.85)}
.dst{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.dc{display:grid;grid-template-columns:auto 1fr;column-gap:4px;align-items:baseline;min-width:0}
.dc small{font-size:10px;color:var(--mute)}
.dc b{font-size:12px;text-align:right}
.db{grid-column:1/-1;height:3px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:2px}
.db i{display:block;height:100%;background:var(--bronze)}
.dtab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.dtab th,.dtab td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
.dtab th[scope="row"],.dtab thead th:first-child{text-align:left;color:var(--mute);font-weight:500}
.dtab thead th{color:var(--mute);font-weight:500;font-size:12px}
.dtab th[scope="row"]{white-space:nowrap}
.top{flex-wrap:wrap}

.warn{border:1px solid var(--cinnabar);background:rgba(208,80,58,.10);border-radius:12px;padding:12px;margin-top:10px;font-size:13px}
.warn b{color:var(--fg)}
.pc{font-family:var(--display);color:var(--bronze);font-size:17px;flex:none}
.ig{color:var(--rc);font-family:var(--display)}
.li[data-peek]{cursor:pointer}
.li[data-peek]:hover{border-color:var(--bronze-d)}
.li .info .bar{margin-top:6px}
.li .info>span{display:block}

.seal{overflow:hidden}
.seal .px{width:100%;height:100%}
.seal.sm{width:38px;height:38px}
.px{display:block;image-rendering:crisp-edges;image-rendering:pixelated}
.itm{overflow:hidden}
.itm .px{width:32px;height:32px}
.ig .px{display:inline-block;width:16px;height:16px;vertical-align:-3px}

.brand-row{display:flex;align-items:center;gap:10px;min-width:0}
.nb{position:relative;width:34px;height:34px;flex:none;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-family:var(--display);font-size:17px;color:var(--bronze);padding:0}
.nb .dot{position:absolute;top:-1px;right:-1px;width:10px;height:10px;border-radius:50%;background:var(--cinnabar);border:2px solid var(--bg)}
.att-card{background:var(--panel2);border:1px solid var(--bronze-d);border-radius:12px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.att{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.ad{border:1px solid var(--line);border-radius:8px;padding:5px 0;text-align:center;display:flex;flex-direction:column;align-items:center}
.ad small{font-size:10px;color:var(--mute)}
.ad b{font-family:var(--display);font-weight:400;font-size:16px;color:var(--mute)}
.ad.done{background:var(--bronze-d);border-color:var(--bronze)}
.ad.done b{color:var(--fg)}
.ad.today{border-color:var(--cinnabar);box-shadow:0 0 0 2px rgba(208,80,58,.25)}
.ad.today b{color:var(--cinnabar)}
.nt{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.nt-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nt-h small{color:var(--mute);font-size:11px}
.ver{font-family:var(--display);color:var(--bronze);font-size:15px}
.nt ul{margin:8px 0 10px;padding-left:18px;font-size:13px;color:var(--fg);display:flex;flex-direction:column;gap:4px}

.sweep-box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.sweep-box .row b{font-size:15px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{background:var(--panel);border:0;width:36px;height:34px;font-size:18px}
.stepper b{min-width:40px;text-align:center}

.daychips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.daychips button{flex:none}

.dmg.b{color:#f2a35a}
.dmg.s{color:var(--r4);font-size:12px}
.tbox{background:var(--panel);border:1px solid var(--bronze-d);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.tb-h{color:var(--bronze);font-weight:500}
.tbox ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.tbox .hint{color:var(--mute)}
.li.bond{align-items:flex-start}
.bfx{color:var(--bronze)!important}
.bmem{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.bmem>span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--mute)}

function teamBonusInfo(us){

const RMUL={2:.9,3:1,4:1.08,5:1.16};
const BEATS={cav:'inf',inf:'arc',arc:'cav'};
function adv(a,b){if(BEATS[a]===b)return 1.25;if(BEATS[b]===a)return .85;return 1}
function baseOf(spec){return spec.troop||GMAP[spec.g]}
function mkUnit(spec,side,slot){
  const b=baseOf(spec), lv=spec.lv||1, d=spec.d||0;
  const m=RMUL[b.rar]*(1+.07*(lv-1))*(1+.06*d)*(spec.sc||1);
  let hp=(b.lead*10+b.str*3+200)*m;
  let atk=((b.cls==='tac'?b.int:b.str)*1.6+b.lead*.3)*m;
  let def=(b.lead*.8+(b.cls==='inf'?20:0))*m;
  let spd=b.spd+lv*.3;
  const it=spec.i&&IMAP[spec.i];
  if(it){const f=it.fx;hp*=1+(f.hp||0)/100;atk*=1+(f.atk||0)/100;def*=1+(f.def||0)/100;spd+=f.spd||0}
  const sk=skillOf(b);hp=Math.round(hp);
  return {id:b.id,name:b.name,hz:b.hz,fac:b.fac,rar:b.rar,cls:b.cls,skill:sk.n,sk,endure:!!sk.endure,
    hp,maxhp:hp,atk:Math.round(atk),def:Math.round(def),spd:Math.round(spd*10)/10,side,slot,acts:0,bf:[],burn:[],stun:0,endUsed:0};
}
function buildTeam(specs,side){const us=specs.map((s,i)=>s?mkUnit(s,side,i):null).filter(Boolean);const info=applyBonuses(us);return {us,info}}
function unitPower(u){return Math.round(u.atk*1.5+u.maxhp/6+u.def*1.2+u.spd)}
function specPower(s){return unitPower(mkUnit(s,0,0))}
function deckPower(specs){return buildTeam(specs,0).us.reduce((a,u)=>a+unitPower(u),0)}
const arr=x=>!x?[]:Array.isArray(x)?x:[x];
function eff(u,k){let v=1;for(const b of u.bf)v+=b[k]||0;return Math.max(.3,v)}
function simulate(As,Bs,seed){
  const rng=mulberry(seed);
  const A=buildTeam(As,0), B=buildTeam(Bs,1), T=[A.us,B.us];
  const init=[T[0].map(u=>({...u})),T[1].map(u=>({...u}))];
  const ev=[], alive=k=>T[k].some(x=>x.hp>0);
  const dmgTo=(t,d,e,extra)=>{t.hp-=d;if(t.hp<=0){if(t.endure&&!t.endUsed){t.hp=1;t.endUsed=1;e.notes.push(`${t.name} 불굴`)}else t.hp=0}e.hits.push({s:t.side,i:t.slot,d,hp:t.hp,...extra})};
  for(let r=1;r<=25&&alive(0)&&alive(1);r++){
    const order=[...T[0],...T[1]].filter(u=>u.hp>0).sort((a,b)=>b.spd-a.spd||a.side-b.side||a.slot-b.slot);
    for(const u of order){
      if(u.hp<=0)continue;
      if(!alive(1-u.side))break;
      if(u.stun>0){u.stun--;ev.push({s:u.side,i:u.slot,skip:1,hits:[],heals:[],notes:[]});continue}
      u.acts++;
      const sk=u.acts%3===0, S=u.sk, e={s:u.side,i:u.slot,sk:sk?S.n:null,hits:[],heals:[],stuns:[],notes:[]};
      const atkV=u.atk*eff(u,'atk');
      const foes=()=>T[1-u.side].filter(x=>x.hp>0), allies=()=>T[u.side].filter(x=>x.hp>0);
      const hit=(t,mult,o)=>{
        if(!t||t.hp<=0)return;const crit=(o&&o.crit)||rng()<.1;
        const raw=atkV*mult*adv(u.cls,t.cls)*(.9+rng()*.2)*(crit?1.5:1);
        let ed=t.def*eff(t,'def')*(1-((o&&o.ign)||0));if(u.cls==='tac')ed*=.6;
        dmgTo(t,Math.max(1,Math.round(raw*120/(120+ed))),e,{c:crit});
      };
      if(!sk){
        const f=foes();
        if(u.cls==='inf'||u.cls==='cav')hit(f[0],1);
        else if(u.cls==='arc')hit(f.reduce((a,b)=>b.hp/b.maxhp<a.hp/a.maxhp?b:a),1);
        else hit(f[Math.floor(rng()*f.length)],1);
      } else {
        if(S.cost){const c=Math.round(u.maxhp*S.cost);u.hp=Math.max(1,u.hp-c);e.hits.push({s:u.side,i:u.slot,d:c,hp:u.hp,self:1})}
        const pick=()=>{const f=foes();if(!f.length)return null;
          switch(S.tg){case 'front':return f[0];case 'back':return f[f.length-1];
            case 'low':return f.reduce((a,b)=>b.hp/b.maxhp<a.hp/a.maxhp?b:a);
            case 'hpmax':return f.reduce((a,b)=>b.hp/b.maxhp>a.hp/a.maxhp?b:a);
            case 'high':return f.reduce((a,b)=>b.atk*eff(b,'atk')>a.atk*eff(a,'atk')?b:a);
            default:return f[Math.floor(rng()*f.length)]}};
        const hitT=[];
        if(S.tg==='all'){foes().forEach(t=>{hit(t,S.m,S);hitT.push(t)})}
        else if(S.tg!=='none'){
          for(let k=0;k<(S.h||1);k++){const t=pick();if(!t)break;let m=S.m;
            if(S.exe&&t.hp/t.maxhp<=S.exe.thr)m=S.exe.m;
            if(S.cond&&T[u.side].some(x=>x.id===S.cond.ally&&x.hp>0))m=S.cond.m;
            hit(t,m,S);if(!hitT.includes(t))hitT.push(t)}
        }
        if(S.stun)hitT.forEach(t=>{if(t.hp>0&&rng()<S.stun){t.stun=1;e.stuns.push({s:t.side,i:t.slot})}});
        if(S.burn)hitT.forEach(t=>{if(t.hp>0)t.burn.push({d:Math.max(1,Math.round(atkV*S.burn.p)),dur:S.burn.dur})});
        if(S.heal){const H=S.heal, tg=H.to==='all'?allies():H.to==='low'?[allies().reduce((a,b)=>b.hp/b.maxhp<a.hp/a.maxhp?b:a)]:[u];
          tg.forEach(t=>{const h=Math.min(t.maxhp-t.hp,Math.round(t.maxhp*H.p));t.hp+=h;e.heals.push({s:t.side,i:t.slot,h,hp:t.hp})})}
        arr(S.buff).forEach(b=>{(b.to==='all'?allies():[u]).forEach(t=>t.bf.push({atk:b.atk||0,def:b.def||0,dur:b.dur}));const x=fxStr({atk:b.atk>0?b.atk:0,def:b.def>0?b.def:0});const y=[b.atk<0?`공격 ${Math.round(b.atk*100)}%`:'',b.def<0?`방어 ${Math.round(b.def*100)}%`:''].filter(Boolean).join(' · ');e.notes.push(`${b.to==='all'?'아군':'자신'} ${[x,y].filter(Boolean).join(' · ')}`)});
        arr(S.deb).forEach(b=>{(b.to==='all'?foes():hitT.filter(t=>t.hp>0)).forEach(t=>t.bf.push({atk:b.atk||0,def:b.def||0,dur:b.dur}));e.notes.push(`적 ${[b.atk?`공격 ${Math.round(b.atk*100)}%`:'',b.def?`방어 ${Math.round(b.def*100)}%`:''].filter(Boolean).join(' · ')}`)});
        if(S.burn&&hitT.length)e.notes.push('화상');
        if(e.stuns.length)e.notes.push(`기절 ${e.stuns.length}명`);
      }
      ev.push(e);
    }
    // 턴 종료: 화상 피해, 효과 지속 시간 감소
    const tick={tick:1,hits:[],heals:[],notes:[]};
    [...T[0],...T[1]].forEach(u=>{
      if(u.hp>0&&u.burn.length){const d=u.burn.reduce((a,b)=>a+b.d,0);dmgTo(u,d,tick,{burn:1})}
      u.burn=u.burn.filter(b=>--b.dur>0);u.bf=u.bf.filter(b=>--b.dur>0);
    });
    if(tick.hits.length)ev.push(tick);
  }
  let win;
  if(alive(0)&&!alive(1))win=true;
  else if(!alive(0))win=false;
  else{const pct=k=>T[k].reduce((a,x)=>a+x.hp/x.maxhp,0)/T[k].length;win=pct(0)>pct(1)}
  return {win,ev,init,bonus:[A.info,B.info]};
}
function bonusLine(info){if(!info)return '';const p=[...info.bonds.map(b=>b.n),...info.facs.map(f=>`${FAC[f.f]} ${f.c}명`)];return p.join(' · ')}

function sanitize(s){
  const n=newState();
  if(!s||typeof s!=='object')return n;
  const o={...n,...s};
  o.gens={};for(const[k,v]of Object.entries(s.gens||{}))if(GMAP[k]&&v)o.gens[k]={lv:Math.min(MAXLV,Math.max(1,v.lv|0)),d:Math.min(5,Math.max(0,v.d|0)),it:v.it||null};
  if(!Object.keys(o.gens).length)o.gens=n.gens;
  o.items=Array.isArray(s.items)?s.items.filter(x=>x&&IMAP[x.k]&&x.u):[];
  o.deck=Array.from({length:5},(_,i)=>{const g=(s.deck||[])[i];return g&&o.gens[g]?g:null});
  o.pvp=s.pvp&&typeof s.pvp==='object'?{day:String(s.pvp.day||''),used:s.pvp.used|0}:n.pvp;
  for(const k of['gold','food','last','stage','seq'])o[k]=Number(o[k])||n[k];
  o.stage=Math.min(NSTAGE,Math.max(0,o.stage|0));
  o.ap=Number.isFinite(Number(s.ap))?Math.max(0,Math.min(999,Math.floor(Number(s.ap)))):AP_CAP;o.apT=Number(s.apT)||Date.now();
  const at=s.att&&typeof s.att==='object'?s.att:{};o.att={day:String(at.day||''),streak:Math.max(0,at.streak|0),total:Math.max(0,at.total|0)};
  const nt=s.notice&&typeof s.notice==='object'?s.notice:{};const strs=a=>Array.isArray(a)?a.filter(x=>typeof x==='string').slice(-60):[];o.notice={read:strs(nt.read),claimed:strs(nt.claimed)};
  const du=s.duel&&typeof s.duel==='object'?s.duel:{};o.duel={done:strs(du.done).slice(-30),pruned:String(du.pruned||'')};
  const ids=new Set(o.items.map(x=>x.u));
  for(const g of Object.values(o.gens))if(g.it&&!ids.has(g.it))g.it=null;
  return o;
}

async function flush(){
  if(saving||!S)return; saving=true;
  try{
    while(dirty){
      dirty=false;
      const snap=JSON.parse(JSON.stringify(S));
      if(MODE==='shared'){
        await writeRetry(()=>FS.collection('saves').doc(UID).set(snap));
        const pub=publicDoc(), key=JSON.stringify(pub);
        if(key!==lastPub){await writeRetry(()=>FS.collection('players').doc(UID).set({...pub,at:Date.now()}));lastPub=key}
      } else lsSave();
    }
  }catch(e){
    if(e&&e.code==='permission-denied'){toast('저장 권한이 없어요. 로그아웃 후 다시 로그인해 주세요.')}
    else{dirty=true;setTimeout(flush,4000)}
  }
  saving=false;
}

async function boot(){
  if(!configured()||!window.firebase){
    MODE='local';S=sanitize(lsLoad());
    setBanner(configured()?'서버에 연결하지 못해 이 기기에만 저장 중이에요.':'서버 설정 전이라 이 기기에만 저장돼요. (관리자: index.html의 FIREBASE_CONFIG를 채워 주세요)');
    showGame(true);render();setInterval(renderTop,1000);setTimeout(runPopups,500);return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  AUTH=firebase.auth();FS=firebase.firestore();
  try{const rr=await AUTH.getRedirectResult();if(rr&&rr.operationType==='link')setTimeout(()=>toast('구글 계정과 연동했어요.'),800)}catch(e){toast(linkMsg(e))}
  AUTH.onAuthStateChanged(async u=>{
    closeSheet();
    if(!u){unsubscribeAll();UID=null;S=null;MODE='boot';showLogin();return}
    UID=u.uid;
    $('#view').innerHTML='<div class="loading">군영을 세우는 중…</div>';
    try{
      const snap=await FS.collection('saves').doc(UID).get();
      S=sanitize(snap.exists?snap.data():null);
      const p=await FS.collection('players').doc(UID).get();
      const pd=p.exists?p.data():null;
      MYNAME=cleanName(pd&&pd.name)||cleanName(u.displayName)||('군주'+Math.floor(1000+Math.random()*9000));
      lastPub='';
      MODE='shared';setBanner(u.isAnonymous?'게스트로 플레이 중이에요. 대전 탭 → 내 정보에서 구글 계정을 연동하면 다른 기기에서도 이어서 할 수 있어요.':'');
      dirty=true;flush();
      subscribe();showGame(true);render();
      if(!pd)setTimeout(()=>openSettings(true),400);else setTimeout(runPopups,500);
    }catch(e){toast('기록을 불러오지 못했어요 ('+(e.code||'오류')+')');showLogin()}
  });
  setInterval(renderTop,1000);
}
let BAT_DAY='', unsubBat=null;
function subBattles(){
  if(unsubBat){try{unsubBat()}catch(e){}}
  BAT_DAY=kstDay();
  unsubBat=FS.collection('battles').where('at','>=',dayStart(BAT_DAY)).orderBy('at','desc').limit(1000).onSnapshot(snap=>{
    BATTLES=snap.docs.map(d=>d.data()).filter(validBattle);refreshPvp();
  },()=>{});
}
function subscribe(){
  unsubscribeAll();
  UNSUB.push(FS.collection('players').limit(300).onSnapshot(snap=>{
    PLAYERS=snap.docs.map(d=>({id:d.id,...cleanPlayer(d.data())})).filter(p=>p.deck.length);refreshPvp();
  },()=>{}));
  subBattles();
  setTimeout(checkSettlement,1500);
}
function unsubscribeAll(){UNSUB.forEach(f=>{try{f()}catch(e){}});UNSUB=[];if(unsubBat){try{unsubBat()}catch(e){}unsubBat=null}}
function refreshPvp(){if(view==='pvp'&&duelTab==='today'&&$('#sheet').hidden&&$('#battle').hidden)renderView()}
function duelTick(){
  if(MODE!=='shared'||!FS)return;
  if(BAT_DAY&&BAT_DAY!==kstDay()){subBattles();renderView()}
  const now=Date.now();if(now>=nextSettleCheck){nextSettleCheck=now+60000;checkSettlement()}
}
function cleanPlayer(d){
  const deck=(Array.isArray(d&&d.deck)?d.deck:[]).slice(0,5).filter(s=>s&&GMAP[s.g]).map(s=>({g:s.g,lv:Math.min(MAXLV,Math.max(1,s.lv|0)),d:Math.min(5,Math.max(0,s.d|0)),i:IMAP[s.i]?s.i:null}));
  return {name:cleanName(d&&d.name),deck,stage:Math.min(NSTAGE,Math.max(0,(d&&d.stage)|0)),at:Number(d&&d.at)||0};
}

async function googleLogin(){
  const pr=new firebase.auth.GoogleAuthProvider();
  try{await AUTH.signInWithPopup(pr)}
  catch(e){
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){try{await AUTH.signInWithRedirect(pr)}catch(e2){toast(authMsg(e2))}}
    else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')toast(authMsg(e));
  }
}

function linkMsg(e){const c=e&&e.code||'';if(c==='auth/credential-already-in-use'||c==='auth/email-already-in-use'||c==='auth/provider-already-linked')return '이 구글 계정은 이미 다른 게임 기록에 연결돼 있어요. 다른 구글 계정으로 연동해 주세요.';return authMsg(e)}
async function afterLink(user){
  if(/^군주\d{4}$/.test(MYNAME)){const nm=cleanName(user.displayName);if(nm){MYNAME=nm;save()}}

}
async function linkGoogle(){
  const u=AUTH&&AUTH.currentUser;if(!u||!u.isAnonymous)return;
  await flush();
  const pr=new firebase.auth.GoogleAuthProvider();
  try{const r=await u.linkWithPopup(pr);await afterLink(r.user)}
  catch(e){
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){try{await u.linkWithRedirect(pr)}catch(e2){toast(linkMsg(e2))}}
    else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')toast(linkMsg(e));
  }
}

  logoutArm=false;bindReset();
  const lg=$('#link-google');if(lg)lg.onclick=linkGoogle;

    flush().finally(()=>AUTH.signOut());
  };
}

/* ---------------- 결투장 일일 정산 ---------------- */
const DUEL_REWARD=[1620,900,720], DUEL_REWARD_REST=300, DUEL_KEEP_DAYS=10, DUEL_SETTLE_HOUR=9, DUEL_START='2026-10-13';
const DAY_MS=864e5;
const dayStart=d=>Date.parse(d+'T00:00:00+09:00');
const dayOf=ms=>new Date(ms+9*3600e3).toISOString().slice(0,10);
const settleAt=d=>dayStart(d)+DAY_MS+DUEL_SETTLE_HOUR*3600e3;
const pastDays=n=>Array.from({length:n},(_,i)=>dayOf(Date.now()-(i+1)*DAY_MS));
const duelReward=rank=>rank<=3?DUEL_REWARD[rank-1]:DUEL_REWARD_REST;
const validBattle=b=>b&&typeof b.att==='string'&&typeof b.def==='string'&&typeof b.win==='boolean'&&Number.isFinite(Number(b.at));
function rankDay(bs){
  const m={};const g=id=>m[id]||(m[id]={id,aw:0,al:0,dw:0,dl:0});
  for(const b of bs){if(b.win){g(b.att).aw++;g(b.def).dl++}else{g(b.att).al++;g(b.def).dw++}}
  return Object.values(m).filter(r=>r.aw+r.al>0).map(r=>({...r,score:r.aw*3+r.dw})).sort((a,b)=>b.score-a.score||b.aw-a.aw||(a.aw+a.al)-(b.aw+b.al)||(a.id<b.id?-1:1));
}
function cleanDaily(d){
  const rank=(Array.isArray(d&&d.rank)?d.rank:[]).filter(r=>r&&typeof r.id==='string').slice(0,200).map(r=>({id:r.id,name:cleanName(r.name),score:r.score|0,aw:r.aw|0,al:r.al|0,dw:r.dw|0,dl:r.dl|0}));
  return {day:String(d&&d.day||''),rank,final:true};
}
const DAILY={};
async function loadDaily(d){
  if(DAILY[d])return DAILY[d];
  const ref=FS.collection('daily').doc(d);
  const snap=await ref.get();
  if(snap.exists)return DAILY[d]=cleanDaily(snap.data());
  const q=await FS.collection('battles').where('at','>=',dayStart(d)).where('at','<',dayStart(d)+DAY_MS).limit(1000).get();
  const rank=rankDay(q.docs.map(x=>x.data()).filter(validBattle)).map(r=>{const p=PLAYERS.find(x=>x.id===r.id);return {...r,name:r.id===UID?MYNAME:(p&&p.name)||''}});
  const final=Date.now()>=settleAt(d), v={day:d,rank,final};
  if(final){
    if(rank.length){try{await ref.set({day:d,at:dayStart(d),final:true,rank})}catch(e){try{const s2=await ref.get();if(s2.exists)return DAILY[d]=cleanDaily(s2.data())}catch(_){}}}
    DAILY[d]=v;
  }
  return v;
}
let PENDING=[], settleBusy=false, nextSettleCheck=0;
async function checkSettlement(){
  if(MODE!=='shared'||!FS||settleBusy||!S)return;settleBusy=true;
  try{
    const days=pastDays(DUEL_KEEP_DAYS).filter(d=>d>=DUEL_START&&Date.now()>=settleAt(d)&&!S.duel.done.includes(d)&&!PENDING.some(p=>p.d===d)).reverse();
    for(const d of days){
      const v=await loadDaily(d), i=v.rank.findIndex(r=>r.id===UID);
      if(i<0){S.duel.done.push(d);continue}
      PENDING.push({d,rank:i+1,total:v.rank.length,reward:duelReward(i+1)});
    }
    S.duel.done=S.duel.done.slice(-30);save();updateDot();
    if(PENDING.length&&$('#sheet').hidden&&$('#battle').hidden)openDuelRewards();
    pruneOld();
  }catch(e){}
  settleBusy=false;
}

  let h=`<div class="row"><div><h2>진형</h2><p class="sub" style="margin:0">이 진형으로 출정하고, 대전에서는 방어 진형으로도 쓰여요.</p></div></div>
  <div class="row" style="margin:12px 0"><div><div class="sub" style="margin:0">총 전투력</div><div class="power num">${fmt(deckPower(specs))}</div></div><span class="sp"></span><button type="button" class="btn ghost sm" id="auto">자동 편성</button></div>${teamBoxHtml(specs)}`;
  S.deck.forEach((gid,i)=>{
    const pos=`<div class="pos">${i+1}<small>${POS[i]}</small></div>`;
    if(!gid){h+=`<div class="slot empty" role="button" tabindex="0" data-slot="${i}">${pos}<div class="info"><b>빈 자리</b><span>눌러서 장수 편성</span></div></div>`;return}
    const g=GMAP[gid], s=specs[i], it=s.i?IMAP[s.i]:null;
    h+=`<div class="slot" role="button" tabindex="0" data-slot="${i}">${pos}${seal(g,'sm')}<div class="info"><b>${esc(g.name)} <span class="stars r${g.rar}">${stars(g.rar)}</span></b><span>${CLS[g.cls].g} ${CLS[g.cls].n} · Lv ${s.lv}${s.d?` · 돌파 ${s.d}`:''}${it?` · ${esc(it.name)}`:''} · 전투력 ${fmt(specPower(s))}</span></div>
    <div class="mv"><button type="button" data-mv="${i}:-1" aria-label="앞으로" ${i===0?'disabled':''}>▲</button><button type="button" data-mv="${i}:1" aria-label="뒤로" ${i===4?'disabled':''}>▼</button></div></div>`;
  });
  h+=`<div class="legend"><b>전투 규칙</b><br>보병·기병은 앞 번호의 적부터 공격하고, 궁병은 체력이 가장 낮은 적을, 책사는 무작위 적을 노립니다. 세 번째 행동마다 전법이 발동해요.<br><b>상성</b> 기병 → 보병 → 궁병 → 기병 (유리하면 피해 +25%)<br><b>진영·인연</b> 같은 진영 3명 이상, 또는 인연 있는 장수를 함께 넣으면 능력치가 올라요. 도감의 인연 탭에서 전체 목록을 볼 수 있어요.</div>`;
  return h;
}
document.addEventListener('click',e=>{
  const mv=e.target.closest('[data-mv]');
  if(mv){e.stopPropagation();const[i,d]=mv.dataset.mv.split(':').map(Number);const j=i+d;if(j<0||j>4)return;[S.deck[i],S.deck[j]]=[S.deck[j],S.deck[i]];save();renderView();return}
  const sl=e.target.closest('[data-slot]');if(sl){openSlotPicker(+sl.dataset.slot);return}
  if(e.target.closest('#auto')){autoDeck();return}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-slot]')){e.preventDefault();openSlotPicker(+e.target.dataset.slot)}});
function autoDeck(){
  const order={inf:0,cav:1,arc:2,tac:3};
  const top=Object.keys(S.gens).map(g=>({g,p:specPower(specOf(g))})).sort((a,b)=>b.p-a.p).slice(0,5).map(x=>x.g);
  top.sort((a,b)=>order[GMAP[a].cls]-order[GMAP[b].cls]);
  S.deck=Array.from({length:5},(_,i)=>top[i]||null);save();renderView();toast('전투력이 높은 순으로 편성했어요');
}
function sortedOwned(){return Object.keys(S.gens).sort((a,b)=>GMAP[b].rar-GMAP[a].rar||S.gens[b].lv-S.gens[a].lv||specPower(specOf(b))-specPower(specOf(a)))}
function openSlotPicker(i){
  const cur=S.deck[i];
  const list=sortedOwned().filter(g=>g!==cur);
  openSheet(`<div class="sheet-h"><h2 style="margin:0">${i+1}번 ${POS[i]} 편성</h2><button class="x" type="button" data-close aria-label="닫기">✕</button></div>
  ${cur?`<button type="button" class="btn ghost wide" data-setslot="${i}:" style="margin-bottom:10px">${esc(GMAP[cur].name)} 빼기</button>`:''}
  <div class="list">${list.map(g=>{const b=GMAP[g],s=specOf(g),at=S.deck.indexOf(g);return `<button type="button" class="li" data-setslot="${i}:${g}" style="text-align:left">${seal(b,'sm')}<div class="info"><b>${esc(b.name)} <span class="stars r${b.rar}">${stars(b.rar)}</span></b><span>${CLS[b.cls].g} ${CLS[b.cls].n} · Lv ${s.lv} · 전투력 ${fmt(specPower(s))}${at>=0?` · 현재 ${at+1}번`:''}</span></div></button>`}).join('')}</div>`);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-setslot]');if(!b)return;
  const[i,g]=b.dataset.setslot.split(':');const idx=+i;
  if(g){const at=S.deck.indexOf(g);if(at>=0)S.deck[at]=S.deck[idx];S.deck[idx]=g}else S.deck[idx]=null;
  save();closeSheet();renderView();
});
/* ---------------- 진영·인연 화면 ---------------- */
function teamBoxHtml(specs){
  const us=specs.filter(Boolean).map((s,i)=>mkUnit(s,0,i)), info=teamBonusInfo(us);
  const li=[...info.facs.map(F=>`<li><b>${FAC[F.f]} ${F.c}명</b> · ${fxStr(F.b)} <span class="sub">(${FAC[F.f]} 장수)</span></li>`),
    ...info.bonds.map(B=>`<li><b>인연 · ${B.n}</b> · ${fxStr(bondFx(B,info.ids))} <span class="sub">(${B.ids.filter(x=>info.ids.has(x)).map(x=>GMAP[x].name).join('·')})</span></li>`)];
  const hints=BONDS.filter(B=>!bondActive(B,info.ids)).map(B=>{const have=B.ids.filter(x=>info.ids.has(x)),need=(B.min||B.ids.length)-have.length;return {B,have,need}})
    .filter(x=>x.have.length&&x.need===1).slice(0,3)
    .map(({B,have})=>`<li class="hint">${B.n}: ${B.ids.filter(x=>!info.ids.has(x)).map(x=>`${GMAP[x].name}${S.gens[x]?'':'(미보유)'}`).join(' 또는 ')} 추가 시 발동</li>`);
  return `<div class="tbox"><b class="tb-h">진영·인연 효과</b>${li.length?`<ul>${li.join('')}</ul>`:'<p class="sub" style="margin:4px 0 0">같은 진영 장수를 3명 이상 넣거나 인연이 있는 장수를 함께 넣으면 능력치가 올라요.</p>'}${hints.length?`<ul>${hints.join('')}</ul>`:''}</div>`;
}
function bondsOfHtml(id){
  const bs=BONDS.filter(B=>B.ids.includes(id));if(!bs.length)return '';
  return `<h3>인연</h3><div class="list">${bs.map(B=>`<div class="li" style="display:block"><b>${B.n}</b> <span class="sub">· ${fxStr(B.fx)}${B.full?` (전원 ${fxStr(B.full)})`:''}</span><div class="sub" style="margin:2px 0 0">${B.ids.map(x=>GMAP[x].name).join(' · ')}${B.min?` 중 ${B.min}명 이상`:''}</div></div>`).join('')}</div>`;
}
function bondsDexHtml(){
  const facRows=Object.entries(FAC_BONUS).map(([f,t])=>`<tr><th scope="row">${FAC[f]}</th>${t.map(v=>`<td>${fxStr(v)}</td>`).join('')}</tr>`).join('');
  return `<h3>진영 보너스 <span style="font-weight:400">· 같은 진영 ★3 이상 장수에게 적용</span></h3>
  <div style="overflow-x:auto"><table class="dtab"><thead><tr><th></th><th>3명</th><th>4명</th><th>5명</th></tr></thead><tbody>${facRows}</tbody></table></div>
  <h3>인연 ${BONDS.length}종 <span style="font-weight:400">· 함께 편성하면 해당 장수들에게 적용</span></h3>
  <div class="list">${BONDS.map(B=>`<div class="li bond"><div class="info"><b>${B.n}</b><span>${esc(B.d)}</span><span class="bfx">${fxStr(B.fx)}${B.full?` · 전원 시 ${fxStr(B.full)}`:''}${B.min?` · ${B.min}명 이상`:''}</span>
    <div class="bmem">${B.ids.map(x=>`<span class="${S.gens[x]?'':'unown'}" title="${GMAP[x].name}">${seal(GMAP[x],'sm')}<small>${GMAP[x].name}</small></span>`).join('')}</div></div></div>`).join('')}</div>`;

function vGens(){
  const own=sortedOwned();
  let h=`<h2>무장</h2><div class="seg" role="group"><button type="button" data-gt="gens" aria-pressed="${genTab==='gens'}">장수 ${own.length}/${GENS.length}</button><button type="button" data-gt="items" aria-pressed="${genTab==='items'}">보물 ${S.items.length}</button></div>`;
  if(genTab==='gens'){
    h+=`<div class="grid">${own.map(g=>{const b=GMAP[g],s=S.gens[g];return `<button type="button" class="gc ${S.deck.includes(g)?'in-deck':''}" data-gen="${g}">${seal(b)}<div class="nm">${esc(b.name)}</div><div class="stars r${b.rar}">${stars(b.rar)}</div><div class="meta"><span class="cls">${CLS[b.cls].g}</span><span class="num">Lv ${s.lv}</span>${S.deck.includes(g)?'<span class="chip">출전</span>':''}</div></button>`}).join('')}</div>`;
  } else {
    if(!S.items.length)return h+`<div class="empty-state"><b>寶庫</b>아직 보물이 없어요. 등용 탭의 보물 획득에서 얻을 수 있어요.</div>`;
    const items=[...S.items].sort((a,b)=>IMAP[b.k].rar-IMAP[a.k].rar||a.k.localeCompare(b.k));
    h+=`<div class="list">${items.map(x=>{const it=IMAP[x.k],hd=itemHolder(x.u);return `<div class="li"><div class="itm r${it.rar}">${itemImg(it)}</div><div class="info"><b>${esc(it.name)} <span class="stars r${it.rar}">${stars(it.rar)}</span></b><span>${ITYPE[it.g]} · ${fxText(it)}${hd?` · ${esc(GMAP[hd].name)} 장착`:''}</span></div>${hd?'':`<button type="button" class="btn ghost sm" data-sell="${x.u}">판매 金${SELL[it.rar]}</button>`}</div>`}).join('')}</div>`;

const SELL={3:40,4:150,5:500};
function fxText(it){const f=it.fx,o=[];if(f.atk)o.push(`공격 +${f.atk}%`);if(f.hp)o.push(`체력 +${f.hp}%`);if(f.def)o.push(`방어 +${f.def}%`);if(f.spd)o.push(`속도 +${f.spd}`);return o.join(' · ')}
let sellArm=null;
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-gt]');if(t){genTab=t.dataset.gt;renderView();return}
  const s=e.target.closest('[data-sell]');
  if(s){const u=s.dataset.sell;
    if(sellArm!==u){sellArm=u;s.textContent='한 번 더 누르면 판매';s.classList.add('red');setTimeout(()=>{if(sellArm===u){sellArm=null;renderView()}},2500);return}
    const x=S.items.find(i=>i.u===u);if(!x)return;const g=SELL[IMAP[x.k].rar];S.items=S.items.filter(i=>i.u!==u);S.gold+=g;sellArm=null;save();renderTop();renderView();toast(`${IMAP[x.k].name} 판매 · 金 +${g}`);return}

});

document.addEventListener('click',e=>{
  const l=e.target.closest('[data-lvup]');
  if(l&&!l.disabled){const g=l.dataset.lvup,st=S.gens[g],c=50*st.lv;if(S.gold<c||st.lv>=MAXLV)return;S.gold-=c;st.lv++;save();renderTop();openGen(g);renderView();return}
  const d=e.target.closest('[data-deckt]');
  if(d){const g=d.dataset.deckt,at=S.deck.indexOf(g);if(at>=0)S.deck[at]=null;else{const e2=S.deck.indexOf(null);if(e2<0){toast('진형이 가득 찼어요. 진형 탭에서 자리를 비워 주세요.');return}S.deck[e2]=g}save();openGen(g);renderView();return}
  const q=e.target.closest('[data-equip]');if(q){openEquip(q.dataset.equip);return}

function standings(){
  const m={};const g=id=>m[id]||(m[id]={aw:0,al:0,dw:0,dl:0});
  for(const b of BATTLES){if(b.win){g(b.att).aw++;g(b.def).dl++}else{g(b.att).al++;g(b.def).dw++}}
  return m;
}
const score=r=>r?r.aw*3+r.dw:0;
let duelTab='today', histDay='';

  const ranked=rankDay(BATTLES), rk={};ranked.forEach((r,i)=>rk[r.id]=i+1);

  }
  h+=`<button type="button" class="btn ghost wide" id="practice" style="margin-top:16px">연습전 (보상 없음 · 도전 횟수 차감 없음)</button>

const ITEM_COMP={3:.4,4:.7,5:1};

   <div class="stat" style="text-align:left;margin:8px 0 12px"><div class="row"><small style="font-size:12px">진형 완성도</small><span class="sp"></span><span class="pc num" style="font-size:22px">${pct(dc)}</span></div><div class="bar"><i style="width:${dc*100}%;background:var(--bronze)"></i></div></div>

   <p class="sub" style="margin-top:10px">완성도는 레벨 60%, 돌파 25%, 장비 등급 15%를 반영해요. 빈 자리는 0%로 계산돼요.</p>
   ${!mine&&MODE==='shared'?`<button type="button" class="btn red wide" data-duel="${esc(id)}" ${ticketsLeft()<1||!mySpecs().some(Boolean)?'disabled':''}>도전 (오늘 ${ticketsLeft()}/${PVP_DAILY}회 남음)</button>`:''}`);
  fillNames();

/* ---------------- battle playback ---------------- */
let btToken=0;
function playBattle(res,title,allyLab,foeLab,resultHtml){
  const tok=++btToken;
  const units=[res.init[0].map(u=>({...u})),res.init[1].map(u=>({...u}))];
  const row=(k)=>{let h='';for(let i=0;i<5;i++){const u=units[k].find(x=>x.slot===i);h+=u?`<div class="bu" id="bu-${k}-${i}">${seal(u,'sm')}<div class="bn">${esc(u.name)}</div><div class="hp"><i style="width:100%"></i></div></div>`:`<div class="bu void"></div>`}return h};
  const el=$('#battle');
  el.innerHTML=`<div class="bt"><div class="bt-head"><span class="bt-title">${esc(title)}</span><button type="button" class="btn ghost sm" id="bt-speed">1배속</button><button type="button" class="btn ghost sm" id="bt-skip">결과 보기</button></div>
  <div class="bt-side">${esc(foeLab)}</div><div class="bt-row bt-foe">${row(1)}</div>
  <div class="bt-log"><div class="sk" id="bt-sk"></div><div class="ln" id="bt-ln">${esc(bonusLine(res.bonus&&res.bonus[0])?'아군 효과 · '+bonusLine(res.bonus[0]):'전투 개시')}</div></div>
  <div class="bt-row bt-ally">${row(0)}</div><div class="bt-side" style="text-align:right">${esc(allyLab)}</div></div>`;
  el.hidden=false;
  let speed=1, idx=0, timer=null;
  const U=(s,i)=>units[s].find(x=>x.slot===i);
  const paint=(s,i)=>{const u=U(s,i),n=$(`#bu-${s}-${i}`);if(!u||!n)return;n.querySelector('.hp i').style.width=(u.hp/u.maxhp*100)+'%';n.classList.toggle('dead',u.hp<=0)};
  const float=(s,i,txt,cls)=>{const n=$(`#bu-${s}-${i}`);if(!n)return;const f=document.createElement('span');f.className='dmg '+cls;f.textContent=txt;n.appendChild(f);setTimeout(()=>f.remove(),800)};
  const apply=(e,anim)=>{
    const a=e.tick?null:U(e.s,e.i);
    for(const h of e.hits||[]){const t=U(h.s,h.i);if(!t)continue;t.hp=h.hp;paint(h.s,h.i);if(anim){float(h.s,h.i,'-'+h.d,h.c?'c':(h.self||h.burn)?'b':'');const n=$(`#bu-${h.s}-${h.i}`);if(n){n.classList.remove('hit');void n.offsetWidth;n.classList.add('hit')}}}
    for(const h of e.heals||[]){const t=U(h.s,h.i);if(!t)continue;t.hp=h.hp;paint(h.s,h.i);if(anim&&h.h>0)float(h.s,h.i,'+'+h.h,'h')}
    if(anim)for(const st of e.stuns||[])float(st.s,st.i,'기절','s');
    if(anim){
      document.querySelectorAll('.bu.act').forEach(n=>n.classList.remove('act'));
      if(a){const an=$(`#bu-${e.s}-${e.i}`);an&&an.classList.add('act')}
      $('#bt-sk').textContent=e.sk||'';
      let ln;
      if(e.tick)ln='화상 피해';
      else if(e.skip)ln=`${a.name} 기절로 행동하지 못함`;
      else{const hs=(e.hits||[]).filter(h=>!h.self),tot=hs.reduce((x,h)=>x+h.d,0),uniq=new Set(hs.map(h=>h.s+'-'+h.i)).size;
        const tgt=uniq>1?`적 ${uniq}명`:hs[0]?U(hs[0].s,hs[0].i).name:'';
        ln=hs.length?`${a.name} → ${tgt} ${fmt(tot)} 피해${hs.length>uniq?` (${hs.length}회)`:''}${hs.some(h=>h.c)?' · 치명타':''}`:a.name}
      if(e.notes&&e.notes.length)ln+=' · '+e.notes.join(' · ');
      $('#bt-ln').textContent=ln;
    }
  };
  const finish=()=>{
    clearTimeout(timer);
    while(idx<res.ev.length)apply(res.ev[idx++],false);
    document.querySelectorAll('.bu.act').forEach(n=>n.classList.remove('act'));
    const box=document.createElement('div');box.className='bt-res';
    box.innerHTML=`<div class="stamp ${res.win?'w':'l'}">${res.win?'勝':'敗'}</div><h2 style="margin:0">${res.win?'승리':'패배'}</h2>${resultHtml()}<button type="button" class="btn" id="bt-close" style="min-width:160px">확인</button>`;
    $('.bt').appendChild(box);
    $('#bt-close').onclick=()=>{el.hidden=true;el.innerHTML='';renderTop();renderView()};
    $('#bt-close').focus();
  };
  const step=()=>{if(tok!==btToken)return;if(idx>=res.ev.length){timer=setTimeout(finish,500);return}apply(res.ev[idx++],true);timer=setTimeout(step,560/speed)};
  $('#bt-speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;$('#bt-speed').textContent=speed+'배속'};
  $('#bt-skip').onclick=finish;
  timer=setTimeout(step,500);
}

function openSheet(html){const s=$('#sheet');s.innerHTML=`<div class="sheet-body" role="dialog" aria-modal="true">${html}</div>`;s.hidden=false;const f=s.querySelector('button');f&&f.focus({preventScroll:true})}
function closeSheet(){const s=$('#sheet');s.hidden=true;s.innerHTML=''}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'||e.target.closest('[data-close]'))closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

boot();
</script>
</body>
</html>
